  var KEY='maxcade.homepos2',PC=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches),BW=PC?72:42,BH=PC?84:58,pos=[1,.5],host=document.createElement('div');

    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'

    +(PC?'.h svg{width:34px;height:34px}.ht{display:block;margin-top:3px;font:900 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;color:#1a1205}.h{border-width:3px;border-radius:14px}.h:hover{background:#ffc94d}':'')
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'

    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'

    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'

    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;

  });

})();

<style>

.pop.yell{color:var(--pink);font-size:20px}

function prop(kind,x,z,y0,rotY,extra){

  if(kind==='table'){mesh=new THREE.Group();mesh.add(bx(2,.12,1.1,0xa86a3a,0,.3,0));mesh.add(bx(.14,.75,1,0x7a4a26,-.8,-.08,0));mesh.add(bx(.14,.75,1,0x7a4a26,.8,-.08,0));
    return addBody(mesh,x,(y0||0)+.45,z,Object.assign({hh:.45,r:1,mass:2,pts:20,name:'Picnic table'},extra));}
  if(kind==='mailbox'){mesh=new THREE.Group();mesh.add(bx(.14,1,.14,0x7a4a26,0,-.1,0));mesh.add(bx(.4,.32,.62,0x3b6fd1,0,.45,0));
    return addBody(mesh,x,(y0||0)+.6,z,Object.assign({hh:.6,r:.42,mass:.6,pts:15,name:'Mailbox'},extra));}
  mesh=mk(G[kind],d.col);if(rotY)mesh.rotation.y=rotY;
  if(kind==='hay')mesh.rotation.z=PI/2;
  const o=Object.assign({},d,extra);delete o.col;
  return addBody(mesh,x,(y0||0)+d.hh,z,o);
}
function pyramid(cx,cz,n){for(let k=0;k<n;k++)for(let i=0;i<n-k;i++)prop('crate',cx,cz+(i-(n-k-1)/2)*1.05,k*1.0,0,{stacked:true});}

function ragNPC(b,vx,vy,vz){
  const n=b.npc;if(n.state==='walk')popup(yells[(R()*yells.length)|0],b.p,'yell');
  n.state='rag';b.awake=true;b.still=0;b.v.set(vx,vy,vz);b.spin.set((R()-.5)*14,(R()-.5)*8,(R()-.5)*14);
}
function updateNPC(b,dt){
  const n=b.npc;n.tt-=dt;if(n.flee>0)n.flee-=dt;
  let dx=n.tx-b.p.x,dz=n.tz-b.p.z;const d=Math.hypot(dx,dz);
  if(d<1.5||n.tt<=0){pickTarget(n);return;}
  const sp=n.flee>0?4.2:1.5;dx/=d;dz/=d;
  b.p.x+=dx*sp*dt;b.p.z+=dz*sp*dt;b.v.set(0,0,0);
  const g=worldCollide(b.p,b.p.y-.9,.4,b.v,0,dt);b.p.y=Math.max(g,0)+.9;
  if(g<-1){b.p.x*=.9;b.p.z*=.9;pickTarget(n);}
  n.head=lerpAngle(n.head,Math.atan2(dx,dz),Math.min(1,8*dt));b.mesh.rotation.set(0,n.head,0);
  n.ph+=dt*sp*4.5;const s=Math.sin(n.ph)*.7;n.legs[0].rotation.x=s;n.legs[2].rotation.x=-s;n.legs[1].rotation.x=-s;n.legs[3].rotation.x=s;
  b.mesh.position.copy(b.p);
}

// cars
const PATH=300;
function pathAt(s,out){
  s=((s%PATH)+PATH)%PATH;
  if(s<90){out.set(-45+s,0,-30);return PI/2;}
  if(s<150){out.set(45,0,-30+(s-90));return 0;}
  if(s<240){out.set(45-(s-150),0,30);return -PI/2;}
  out.set(-45,0,30-(s-240));return PI;
}
function makeCar(s,col){
  const g=new THREE.Group();g.add(bx(2,.7,4.2,col,0,0,0));g.add(bx(1.7,.6,2.1,0xdff2fa,0,.62,-.2));
  for(const x of [-1,1])for(const z of [-1.3,1.3]){const w=mk(new THREE.CylinderGeometry(.42,.42,.3,10),0x22222a);w.rotation.z=PI/2;w.position.set(x*1,-.4,z);g.add(w);}
  const b=addBody(g,0,.82,0,{hh:.82,r:1.9,mass:6,pts:200,name:'Car'});b.car={state:'drive',s,speed:10+R()*3};return b;
}
makeCar(0,0xe2574c);makeCar(100,0x3b6fd1);makeCar(200,0xf6c945);
const _cp=new V3();
function updateCar(b,dt){
  const c=b.car;c.s+=c.speed*dt;const h=pathAt(c.s,_cp);
  b.p.set(_cp.x,.82,_cp.z);b.mesh.position.copy(b.p);b.mesh.rotation.set(0,h,0);
  const dx=Math.sin(h),dz=Math.cos(h);
  if(playing&&Math.hypot(goat.p.x-b.p.x,goat.p.z-b.p.z)<2.5&&goat.p.y<1.9){
    if(goat.hbT>0){c.state='fly';b.awake=true;b.still=0;b.v.set(Math.sin(goat.yaw)*13,10,Math.cos(goat.yaw)*13);b.spin.set(6,2,4);b.fuse=1.4;addScore(200,'Car punted',b.p);quest('none');boomSnd(.3);}
    else if(goat.hitCd<=0){goat.v.set(dx*15,13,dz*15);goatRag();goat.hitCd=1.2;addScore(150,'Run over',goat.p);quest('car');thud(1);shake=.6;}
  }
  for(const o of bodies){if(o===b||o.gone>0||(o.car&&o.car.state==='drive'))continue;
    const ox=o.p.x-b.p.x,oz=o.p.z-b.p.z;
    if(ox*ox+oz*oz<6.8&&o.p.y<2.2&&o.v.x*dx+o.v.z*dz<4){
      const k=12/Math.sqrt(o.mass);
      if(o.npc){if(o.npc.state==='walk')ragNPC(o,dx*k,7,dz*k);else{o.v.set(dx*k,6,dz*k);o.awake=true;o.still=0;o.npc.state='rag';}}
      else{wake(o);o.v.set(dx*k,6,dz*k);o.spin.set(R()*8,R()*4,R()*8);}
    }}
}

/* ---------- explosions ---------- */
const fx=[];
const fxGeo=new THREE.SphereGeometry(1,14,10);
function explodeAt(pos){
  for(const col of [0xffb020,0x443c38]){const m=new THREE.Mesh(fxGeo,new THREE.MeshBasicMaterial({color:col,transparent:true}));m.position.copy(pos);scene.add(m);fx.push({m,t:0,dur:col===0xffb020?.4:.8,R:col===0xffb020?8:5.5});}
  boomSnd(1);shake=1;
  const d=new V3();
  for(const o of bodies){if(o.gone>0)continue;d.subVectors(o.p,pos);const L=d.length();if(L>10||L<.01)continue;
    const f=1-L/10;d.multiplyScalar(1/L);d.y+=.6;const k=26*f/Math.sqrt(o.mass);
    if(o.car&&o.car.state==='drive'){o.car.state='fly';o.fuse=1+R()*.5;}
    if(o.npc){if(o.npc.state==='walk'){ragNPC(o,d.x*k,d.y*k,d.z*k);addScore(50,'Blasted',o.p);}else{o.npc.state='rag';o.awake=true;o.still=0;o.v.addScaledVector(d,k);}}
    else{wake(o);o.v.addScaledVector(d,k);o.spin.set((R()-.5)*16,(R()-.5)*8,(R()-.5)*16);}
    if(o.explosive&&o.fuse<=0)o.fuse=.12+R()*.35;
  }
  d.subVectors(goat.p,pos);const L=d.length();
  if(playing&&L<10){const f=1-L/10;d.normalize();goat.v.addScaledVector(d,22*f);goat.v.y+=11*f;goatRag();}
}
function blow(b){
  explodeAt(b.p);addScore(100,'BOOM',b.p);if(b.explosive)quest('boom');
  b.gone=b.car?7:22;b.mesh.visible=false;b.awake=false;b.fuse=0;if(goat.lick===b)lickOff();
}
function revive(b){
  b.gone=0;b.mesh.visible=true;b.p.copy(b.home);b.v.set(0,0,0);b.spin.set(0,0,0);b.mesh.rotation.set(0,b.homeRot,0);b.mesh.position.copy(b.p);b.awake=false;
  if(b.car)b.car.state='drive';
}

function updateBodies(dt){
  for(let i=0;i<bodies.length;i++){const b=bodies[i];
    if(b.cd>0)b.cd-=dt;
    if(b.gone>0){b.gone-=dt;if(b.gone<=0)revive(b);continue;}
    if(b.npc){const n=b.npc;
      if(n.state==='walk'){updateNPC(b,dt);continue;}
      if(n.state==='down'){if(goat.lick===b)n.downT=1;n.downT-=dt;
        if(n.downT<=0){if(b.p.y<-1){b.p.set((R()-.5)*40,0,(R()-.5)*30);}
          n.state='walk';n.flee=6;b.awake=false;b.p.y=.9;pickTarget(n);b.mesh.rotation.set(0,n.head,0);}
        if(!b.awake)continue;}
    }
    if(b.car&&b.car.state==='drive'){updateCar(b,dt);continue;}
    if(b.fuse>0){b.fuse-=dt;if(b.fuse<=0){blow(b);continue;}b.awake=true;}
    if(!b.awake)continue;
    b.v.y-=GRAV*dt;b.p.addScaledVector(b.v,dt);
    const g=worldCollide(b.p,b.p.y-b.hh,b.r*.8,b.v,.4,dt);
    if(b.p.y-b.hh<=g){
      b.p.y=g+b.hh;
      if(b.v.y<-3)b.v.y*=-b.rest;else b.v.y=0;
      const fr=Math.max(0,1-(b.rest>.6?1.2:4)*dt);b.v.x*=fr;b.v.z*=fr;b.spin.multiplyScalar(Math.max(0,1-3.5*dt));
      if(b.v.x*b.v.x+b.v.z*b.v.z<.12&&Math.abs(b.v.y)<.2){b.still+=dt;
        if(b.still>.5&&b.fuse<=0&&goat.lick!==b){b.awake=false;b.v.set(0,0,0);b.spin.set(0,0,0);if(b.npc){b.npc.state='down';b.npc.downT=2.5+R()*2;}}
      }else b.still=0;
    }
    b.mesh.rotation.x+=b.spin.x*dt;b.mesh.rotation.y+=b.spin.y*dt;b.mesh.rotation.z+=b.spin.z*dt;
    // body vs body
    for(let j=0;j<bodies.length;j++){const o=bodies[j];if(o===b||o.gone>0)continue;
      const dx=o.p.x-b.p.x,dy=o.p.y-b.p.y,dz=o.p.z-b.p.z,rr=(b.r+o.r)*.9,d2=dx*dx+dy*dy+dz*dz;
      if(d2>=rr*rr||d2<1e-6)continue;
      if(o.car&&o.car.state==='drive')continue;
      const sp=b.v.length();
      if(o.npc&&o.npc.state==='walk'){if(sp>5)ragNPC(o,b.v.x*.7,3+sp*.2,b.v.z*.7);continue;}
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,nz=dz/d,ov=rr-d;
      const vn=(b.v.x-o.v.x)*nx+(b.v.y-o.v.y)*ny+(b.v.z-o.v.z)*nz;
      if(!o.awake&&vn<1.2){b.p.x-=nx*ov;b.p.z-=nz*ov;if(vn>0){b.v.x-=nx*vn;b.v.z-=nz*vn;}continue;}
      wake(o);if(o.npc)o.npc.state='rag';
      const tm=b.mass+o.mass;b.p.x-=nx*ov*o.mass/tm;b.p.y-=ny*ov*o.mass/tm;b.p.z-=nz*ov*o.mass/tm;
      o.p.x+=nx*ov*b.mass/tm;o.p.y+=ny*ov*b.mass/tm;o.p.z+=nz*ov*b.mass/tm;
      if(vn>0){const jj=vn*1.3/(1/b.mass+1/o.mass);b.v.x-=nx*jj/b.mass;b.v.y-=ny*jj/b.mass;b.v.z-=nz*jj/b.mass;o.v.x+=nx*jj/o.mass;o.v.y+=ny*jj/o.mass;o.v.z+=nz*jj/o.mass;}
    }
    b.mesh.position.copy(b.p);
  }
}

function goatRag(){if(!goat.rag){goat.rag=true;goat.ragT=0;}goat.grounded=false;goat.spin.set((R()-.5)*18,(R()-.5)*8,(R()-.5)*18);}

function updateGoat(dt){
  const g0=goat;
  if(g0.hbT>0)g0.hbT-=dt;if(g0.hbCd>0)g0.hbCd-=dt;if(g0.hitCd>0)g0.hitCd-=dt;
  const s=Math.sin(camYaw),c=Math.cos(camYaw);
  const wx=s*inp.y+c*inp.x,wz=c*inp.y-s*inp.x,wl=Math.hypot(wx,wz);
  if(wl>.15)camYaw-=inp.x*1.1*dt;
  const px=g0.p.x,pz=g0.p.z;
  if(!g0.rag){
    if(g0.hbT<=0){const k=Math.min(1,(g0.grounded?12:3.5)*dt);
      if(g0.grounded||wl>.15){g0.v.x+=(wx*9-g0.v.x)*k;g0.v.z+=(wz*9-g0.v.z)*k;}
      if(wl>.15)g0.yaw=lerpAngle(g0.yaw,Math.atan2(wx,wz),Math.min(1,12*dt));}
    if(!g0.grounded)g0.v.y-=GRAV*dt;
  }else{g0.ragT+=dt;g0.v.y-=GRAV*dt;}
  g0.p.addScaledVector(g0.v,dt);
  const g=worldCollide(g0.p,g0.p.y,.6,g0.v,g0.rag?.5:0,dt),surf=hitSurf;
  if(g0.grounded){
    if(g<g0.p.y-.35){g0.grounded=false;g0.jumps=1;g0.v.y=Math.min(16,Math.max(0,g0.gvy*1.7));}
    else{g0.gvy=(g-g0.p.y)/dt;g0.p.y=g;g0.v.y=0;}
  }else if(g0.p.y<=g){
    if(g0.v.y>0){g0.p.y=g;}
    else{
      g0.p.y=g;
      if(g0.airT>1.2)addScore(Math.round(g0.airT*10)*10,'Airtime',g0.p);
      g0.airT=0;
      if(surf&&surf.bounce&&g0.v.y<-2){g0.v.y=Math.min(32,Math.max(13,-g0.v.y*1.14));g0.jumps=1;tone(180,620,.25,.2,'sine');popup('Boing',g0.p);quest('tramp');}
      else if(g0.rag){
        if(g0.v.y<-4){g0.v.y*=-.45;g0.v.x*=.75;g0.v.z*=.75;thud(.5);}
        else{g0.v.y=0;const fr=Math.max(0,1-3*dt);g0.v.x*=fr;g0.v.z*=fr;g0.spin.multiplyScalar(Math.max(0,1-4*dt));
          if(g0.ragT>1.3&&g0.v.x*g0.v.x+g0.v.z*g0.v.z<3){g0.rag=false;g0.grounded=true;g0.jumps=0;gTum.rotation.set(0,0,0);}}
      }else{g0.grounded=true;g0.jumps=0;g0.v.y=0;g0.gvy=0;}
    }
  }
  if(!g0.grounded&&g0.p.y>g+.3){g0.airT+=dt;if(g0.airT>=2.5)quest('air');}
  if(g0.grounded&&g0.p.y>=11.5)quest('tower');
  if(g0.p.y<-1.3){popup("Goats can't swim",g0.p,'yell');g0.p.set(0,3,4);g0.v.set(0,0,0);g0.rag=false;g0.grounded=false;g0.airT=0;gTum.rotation.set(0,0,0);lickOff();tone(300,90,.3,.15,'sine');}

  // goat vs bodies
  const fx_=Math.sin(g0.yaw),fz_=Math.cos(g0.yaw),cy=g0.p.y+.8;
  for(let i=0;i<bodies.length;i++){const b=bodies[i];if(b.gone>0||(b.car&&b.car.state==='drive'))continue;
    let dx=b.p.x-g0.p.x,dy=b.p.y-cy,dz=b.p.z-g0.p.z;const rr=b.r+.75,d2=dx*dx+dy*dy+dz*dz;if(d2>=rr*rr)continue;
    const d=Math.sqrt(d2)||.01;dx/=d;dy/=d;dz/=d;const ov=rr-d,walking=b.npc&&b.npc.state==='walk';
    if(g0.hbT>0){
      const k=1/Math.sqrt(b.mass),vx=fx_*20*k+dx*3,vy=9*k,vz=fz_*20*k+dz*3;
      if(b.npc){ragNPC(b,vx,vy,vz);if(b.cd<=0)quest('npc');}else{wake(b);b.v.set(vx,vy,vz);b.spin.set((R()-.5)*16,(R()-.5)*8,(R()-.5)*16);}
      if(b.explosive&&b.fuse<=0)b.fuse=.7;
      if(b.car&&b.fuse<=0)b.fuse=1.4;
      if(b.cd<=0){b.cd=1.2;addScore(b.pts*2,b.name+' headbutted',b.p);thud(.8);shake=Math.max(shake,.25);}
      continue;
    }
    const vn=g0.v.x*dx+g0.v.y*dy+g0.v.z*dz;
    if(vn>2.5&&!(walking&&vn<4)){
      const k=vn*1.3/b.mass;
      if(b.npc){if(walking)ragNPC(b,dx*k,2+vn*.3,dz*k);else{b.v.x+=dx*k;b.v.z+=dz*k;b.v.y+=2;b.awake=true;b.still=0;b.npc.state='rag';}}
      else{wake(b);b.v.x+=dx*k;b.v.z+=dz*k;b.v.y+=2+vn*.3/b.mass;b.spin.set((R()-.5)*10,(R()-.5)*5,(R()-.5)*10);}
      if(b.cd<=0&&vn>4){b.cd=1.2;addScore(b.pts,b.name,b.p);thud(.5);}
    }
    if(b.mass>=4||walking||!b.awake){g0.p.x-=dx*ov;g0.p.z-=dz*ov;}else{b.p.x+=dx*ov;b.p.z+=dz*ov;}
  }

  // tongue
  if(g0.lick){const b=g0.lick;mouth(_m);_d.subVectors(b.p,_m);const L=_d.length();
    if(b.gone>0||L>18)lickOff();
    else{
      if(L>2.2){_d.multiplyScalar(1/L);b.v.addScaledVector(_d,-(L-2.2)*40*dt/Math.max(.6,b.mass*.5));b.v.multiplyScalar(Math.max(0,1-1.5*dt));wake(b);if(b.npc)b.npc.state='rag';
        if(b.car)b.car.state='fly';}
      tongue.visible=true;tongue.position.copy(_m);tongue.lookAt(b.p);tongue.scale.z=Math.max(.1,L);
      g0.drag+=Math.hypot(g0.p.x-px,g0.p.z-pz);if(g0.drag>=5){quest('drag',g0.drag);g0.drag=0;}
    }}

  // visuals
  gRoot.position.copy(g0.p);gRoot.rotation.y=g0.yaw;
  const hs=Math.hypot(g0.v.x,g0.v.z);
  if(g0.rag){gTum.rotation.x+=g0.spin.x*dt;gTum.rotation.y+=g0.spin.y*dt;gTum.rotation.z+=g0.spin.z*dt;gTum.position.y=.5;
    for(let i=0;i<4;i++)legsG[i].rotation.x=Math.sin(tNow*18+i*1.7)*1.1;}
  else{gTum.position.y=.8;
    if(g0.flipT>0){g0.flipT-=dt;gTum.rotation.x=(1-Math.max(0,g0.flipT)/.5)*PI*2;}
    else gTum.rotation.x=g0.hbT>0?.35:0;
    g0.ph+=dt*hs*1.6;const a=g0.grounded?Math.sin(g0.ph)*Math.min(1,hs/5)*.8:.9;
    legsG[0].rotation.x=g0.grounded?a:-a;legsG[1].rotation.x=g0.grounded?-a:a;legsG[2].rotation.x=g0.grounded?-a:-a;legsG[3].rotation.x=a;}
}

/* ---------- score, goals, popups ---------- */
let score=0,combo=0,comboT=0,best=0,playing=false,shake=0,tNow=0;
try{best=+localStorage.getItem('badgoat.best')||0;}catch(e){}
const ptsEl=$('pts'),comboEl=$('combo'),pops=$('pops'),toastEl=$('toast');
const _pv=new V3();
function popup(text,pos,cls){
  if(pops.childElementCount>14)return;
  _pv.set(pos.x,pos.y+1.6,pos.z).project(camera);if(_pv.z>1)return;
  const e=document.createElement('div');e.className='pop'+(cls?' '+cls:'');e.textContent=text;
  e.style.left=((_pv.x*.5+.5)*window.innerWidth+(R()-.5)*30)+'px';e.style.top=((-_pv.y*.5+.5)*window.innerHeight)+'px';
  pops.appendChild(e);setTimeout(()=>e.remove(),950);
}
function addScore(pts,label,pos){
  if(!playing)return;
  combo++;comboT=3;const mult=Math.min(10,combo);score+=pts*mult;
  popup(label+' +'+pts*mult,pos||goat.p);ptsEl.textContent=score;comboEl.textContent=mult>1?'x'+mult:'';
  if(combo>=10)quest('combo');
  if(score>best){best=score;try{localStorage.setItem('badgoat.best',best);}catch(e){}}
}
const Q=[['npc','Headbutt 5 people',5],['boom','Blow up a barrel',1],['tramp','Bounce on the trampoline 3 times',3],['air','Stay in the air for 2.5 seconds',1],
  ['car','Get hit by a car',1],['drag','Drag something 60 m by tongue',60],['tower','Stand on top of the tower',1],['combo','Chain a x10 combo',1]];
let qProg={},qDone={},toastT=0;
function renderGoals(){
  const ul=$('goals');ul.textContent='';let n=0;
  for(const q of Q){const li=document.createElement('li');if(qDone[q[0]]){li.className='done';n++;}
    const a=document.createElement('span');a.textContent=q[1];const b=document.createElement('b');
    b.textContent=qDone[q[0]]?'done':(q[2]>1?Math.floor(qProg[q[0]]||0)+'/'+q[2]:'');li.append(a,b);ul.appendChild(li);}
  $('goalsBtn').textContent='Goals '+n+'/'+Q.length;
}
function quest(id,amt){
  if(!playing||qDone[id])return;const q=Q.find(x=>x[0]===id);if(!q)return;
  qProg[id]=(qProg[id]||0)+(amt||1);
  if(qProg[id]>=q[2]){qDone[id]=1;score+=500;ptsEl.textContent=score;toastEl.textContent='Goal done: '+q[1]+'  +500';toastEl.hidden=false;toastT=2.6;tone(520,1040,.3,.15,'triangle');}
  renderGoals();
}
renderGoals();
$('goalsBtn').addEventListener('click',()=>{$('goals').hidden=!$('goals').hidden;});

/* ---------- sound ---------- */
let ac=null,lastThud=0;
function initAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function tone(f0,f1,dur,vol,type){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,freq,vol){if(!ac)return;const n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(R()*2-1)*(1-i/n);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start();}
function thud(v){if(tNow-lastThud<.07)return;lastThud=tNow;noise(.12,500,.5*v);}
function boomSnd(v){noise(.9,260,.9*v);tone(120,30,.6,.4*v,'sine');}
function bleat(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain(),f=ac.createBiquadFilter();
  o.type='sawtooth';o.frequency.setValueAtTime(540,t);o.frequency.linearRampToValueAtTime(410,t+.45);l.frequency.value=15;lg.gain.value=45;l.connect(lg);lg.connect(o.frequency);
  f.type='bandpass';f.frequency.value=1100;f.Q.value=2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.3,t+.03);g.gain.linearRampToValueAtTime(0,t+.5);
  o.connect(f);f.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+.55);l.stop(t+.55);}

/* ---------- input ---------- */
const inp={x:0,y:0};let camYaw=-PI/2,pitch=.38;const camDist=9.5;
const touch=$('touch'),stick=$('stick'),knob=stick.firstElementChild;
let stickId=null,sx=0,sy=0,camId=null,lx=0,ly=0;
touch.addEventListener('pointerdown',e=>{
  if(!playing)return;try{touch.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType!=='mouse'&&e.clientX<window.innerWidth*.45&&stickId===null){stickId=e.pointerId;sx=e.clientX;sy=e.clientY;stick.style.left=sx+'px';stick.style.top=sy+'px';knob.style.transform='';stick.hidden=false;}
  else if(camId===null){camId=e.pointerId;lx=e.clientX;ly=e.clientY;}
});
touch.addEventListener('pointermove',e=>{
  if(e.pointerId===stickId){let dx=e.clientX-sx,dy=e.clientY-sy;const L=Math.hypot(dx,dy),mx=50;if(L>mx){dx*=mx/L;dy*=mx/L;}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';inp.x=dx/mx;inp.y=dy/mx;}
  else if(e.pointerId===camId){camYaw-=(e.clientX-lx)*.007;pitch=Math.min(1.25,Math.max(.06,pitch+(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;}
});
function pUp(e){if(e.pointerId===stickId){stickId=null;stick.hidden=true;inp.x=0;inp.y=0;}if(e.pointerId===camId)camId=null;}
touch.addEventListener('pointerup',pUp);touch.addEventListener('pointercancel',pUp);
for(const [id,fn] of [['bJump',doJump],['bButt',doButt],['bLick',doLick],['bFlop',doFlop]])
  $(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();});
const keys={};
function keyAxes(){const x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(stickId===null){const L=Math.hypot(x,y)||1;inp.x=x/L;inp.y=y/L;}}
window.addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;
  if(e.code==='Space'){e.preventDefault();doJump();}else if(e.code==='KeyJ'||e.code==='ShiftLeft')doButt();else if(e.code==='KeyK'||e.code==='KeyE')doLick();else if(e.code==='KeyL'||e.code==='KeyR')doFlop();
  keyAxes();});
window.addEventListener('keyup',e=>{keys[e.code]=0;keyAxes();});
document.addEventListener('contextmenu',e=>e.preventDefault());

$('best').textContent=best?'Your best: '+best:'';
$('play').addEventListener('click',()=>{initAudio();if(ac&&ac.resume)ac.resume();playing=true;$('start').hidden=true;camYaw=-PI/2;bleat();});

/* ---------- loop ---------- */
const tgt=new V3(),des=new V3();let last=performance.now();
camera.position.set(-12,6,4);
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.033,(now-last)/1000)||.016;last=now;tNow+=dt;
  if(playing)updateGoat(dt);else{camYaw+=dt*.15;gRoot.position.copy(goat.p);gRoot.rotation.y=goat.yaw;}
  updateBodies(dt);
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt;const k=f.t/f.dur;if(k>=1){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1);continue;}
    f.m.scale.setScalar(1+f.R*k);f.m.material.opacity=1-k;if(f.dur>.5)f.m.position.y+=dt*3;}
  if(comboT>0){comboT-=dt;if(comboT<=0){combo=0;comboEl.textContent='';}}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.hidden=true;}
  tgt.set(goat.p.x,goat.p.y+1.6,goat.p.z);const cp=Math.cos(pitch);
  des.set(tgt.x+Math.sin(camYaw)*cp*camDist,tgt.y+Math.sin(pitch)*camDist,tgt.z+Math.cos(camYaw)*cp*camDist);
  camera.position.lerp(des,1-Math.exp(-10*dt));
  if(shake>0){shake=Math.max(0,shake-dt*2.2);camera.position.x+=(R()-.5)*shake;camera.position.y+=(R()-.5)*shake;}
  if(camera.position.y<.4)camera.position.y=.4;
  camera.lookAt(tgt);
  sun.position.set(goat.p.x+30,goat.p.y+55,goat.p.z+22);sun.target.position.copy(goat.p);
  renderer.render(scene,camera);
}
function boot(d){
  if(d&&typeof d.score==='number'){score=d.score;qProg=d.qProg||{};qDone=d.qDone||{};ptsEl.textContent=score;renderGoals();}
  requestAnimationFrame(frame);
}
const hot=window.__mxNoHot&&window.__mxNoHot.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({score,qProg,qDone}));}catch(e){}
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
