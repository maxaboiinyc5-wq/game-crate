<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@500&display=swap">
<style>

   if(Math.abs(Math.abs(x)-60)<10||Math.abs(Math.abs(z)-60)<10)continue;if(Math.abs(x)>68&&Math.abs(z)>68)continue;
   if(Math.hypot(x,z)<42||Math.abs(x)<7||Math.abs(z)<7)continue;tp.push([x,z,.8+rng()*.7])}
 const tr=new THREE.InstancedMesh(new THREE.CylinderGeometry(.25,.38,2.6,6),mat('#6b4a2f'),tp.length),
       cr=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2,0),mat('#3f7d3a'),tp.length),d=new THREE.Object3D();
 tp.forEach(([x,z,s],i)=>{d.position.set(x,1.3,z);d.scale.set(1,1,1);d.rotation.set(0,0,0);d.updateMatrix();tr.setMatrixAt(i,d.matrix);
   d.position.set(x,3.6*s+.6,z);d.scale.set(s,s*1.15,s);d.rotation.y=rng()*6;d.updateMatrix();cr.setMatrixAt(i,d.matrix);
   solids.push({x0:x-.2,x1:x+.2,z0:z-.2,z1:z+.2,h:99})});
 tr.castShadow=cr.castShadow=true;scene.add(tr,cr)}
// clouds
{const cm=new THREE.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.85});
 for(let i=0;i<10;i++){const c=new THREE.Mesh(new THREE.SphereGeometry(14+rng()*14,8,6),cm);c.scale.y=.3;c.position.set(rng()*700-350,90+rng()*40,rng()*700-350);scene.add(c)}}
// footprints onto the map
m.fillStyle='rgba(20,22,28,.55)';for(const s of solids)if(s.h<90&&s.h>1.4)m.fillRect(P(s.x0),P(s.z0),(s.x1-s.x0)*K,(s.z1-s.z0)*K);
gtex.needsUpdate=true;
const MS2=document.createElement('canvas');MS2.width=MS2.height=208;MS2.getContext('2d').drawImage(MC,0,0,208,208);

// ---------- skater ----------
const pl=new THREE.Group();pl.rotation.order='YXZ';scene.add(pl);
function part(g,geo,c,x,y,z){const me=new THREE.Mesh(geo,mat(c));me.position.set(x,y,z);me.castShadow=true;g.add(me);return me}
const board=new THREE.Group();board.position.y=.12;pl.add(board);
part(board,new THREE.BoxGeometry(.3,.04,1.05),'#ff3d7f',0,0,0);
part(board,new THREE.BoxGeometry(.3,.04,.14),'#ff3d7f',0,.03,.56).rotation.x=-.5;part(board,new THREE.BoxGeometry(.3,.04,.14),'#ff3d7f',0,.03,-.56).rotation.x=.5;
for(const sx of[-.12,.12])for(const sz of[-.34,.34]){part(board,new THREE.CylinderGeometry(.055,.055,.06,10),'#f7f3e3',sx,-.06,sz).rotation.z=PI/2}
const rider=new THREE.Group();rider.position.y=.15;rider.rotation.y=-1.25;pl.add(rider);
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
part(rider,B(.15,.08,.3),'#f7f3e3',-.27,.04,.03);part(rider,B(.15,.08,.3),'#f7f3e3',.27,.04,.03);
part(rider,B(.15,.56,.17),'#2b3a55',-.23,.36,0).rotation.z=-.16;part(rider,B(.15,.56,.17),'#2b3a55',.23,.36,0).rotation.z=.16;
part(rider,B(.42,.2,.24),'#2b3a55',0,.7,0);
part(rider,B(.46,.52,.26),'#1f8a8a',0,1.03,0);part(rider,B(.3,.22,.08),'#176b6b',0,.95,.15);
const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.26,1.24,0);armR.position.set(.26,1.24,0);rider.add(armL,armR);
for(const a of[armL,armR]){part(a,B(.12,.5,.12),'#1f8a8a',0,-.22,0);part(a,new THREE.SphereGeometry(.07,8,6),'#e8b98a',0,-.5,0)}
part(rider,new THREE.CylinderGeometry(.07,.07,.1,8),'#e8b98a',0,1.33,0);
part(rider,new THREE.SphereGeometry(.16,14,10),'#e8b98a',0,1.5,0);
part(rider,new THREE.SphereGeometry(.18,14,8,0,PI*2,0,PI/2),'#ffd23f',0,1.52,0);
part(rider,B(.24,.03,.12),'#ffd23f',0,1.53,.2);
part(rider,new THREE.SphereGeometry(.025,6,6),'#14161c',-.06,1.48,.15);part(rider,new THREE.SphereGeometry(.025,6,6),'#14161c',.06,1.48,.15);

// ---------- state ----------
const MAXS=24,FL=['Kickflip','Heelflip','360 Shove-it','Tre Flip'];
const p={x:0,y:0,z:32,h:PI,sp:0,vy:0,gr:true,climb:0,g:null,flip:0,fk:0,fn:'',bail:0,spin:0};
let combo=[],cpts=0,points=0,done={},on=false,camH=PI,lean=0,pitch=0;
try{const s=JSON.parse(localStorage.getItem('kickflip-island')||'{}');points=s.points||0;done=s.done||{}}catch(e){}
function save(){try{localStorage.setItem('kickflip-island',JSON.stringify({points,done}))}catch(e){}}
let ac=null;function snd(f,d,t,v){if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;
  g.gain.value=v||.04;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let tT=0;function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;tT=1.8}

// ---------- missions ----------
const MS=[
 {id:'tok',n:'Token Sweep',d:'Grab 12 tokens around the plaza. Some need an ollie.',x:0,z:16,c:0xffd23f,t:60,goal:12,u:'tokens'},
 {id:'park',n:'Park Session',d:'Bank 2500 trick points. Chain tricks for multipliers.',x:92,z:-120,c:0xff3d7f,t:75,goal:2500,u:'pts'},
 {id:'rail',n:'Rail Rat',d:'Grind 60 metres of rail.',x:-78,z:-118,c:0x4cc9f0,t:70,goal:60,u:'m'},
 {id:'run',n:'Courier Run',d:'Hit 8 gates through downtown.',x:-104,z:70,c:0xff8c42,t:60,goal:8,u:'gates'},
 {id:'flip',n:'Flip the Pier',d:'Land 6 flip tricks.',x:85,z:125,c:0xb388ff,t:60,goal:6,u:'flips'}];
const GATES=[[-136,90],[-136,125],[-115,136],[-104,160],[-80,168],[-70,136],[-90,104],[-104,80]];
for(const q of MS){q.g=new THREE.Group();q.mt=new THREE.MeshBasicMaterial({color:q.c,transparent:true,opacity:.3,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3,.18,8,32),new THREE.MeshBasicMaterial({color:q.c}));ring.rotation.x=PI/2;ring.position.y=.15;
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.7,.7,60,12,1,true),q.mt);beam.position.y=30;q.ring=ring;
  q.g.add(ring,beam);q.g.position.set(q.x,0,q.z);scene.add(q.g)}
function paintDone(){let n=0;for(const q of MS)if(done[q.id]){n++;q.mt.color.set(0x4ade80);q.ring.material.color.set(0x4ade80)}$('mis').textContent='Missions '+n+'/5'}
paintDone();
let act=null,near=null;
const tokG=new THREE.CylinderGeometry(.55,.55,.12,16),tokM=new THREE.MeshLambertMaterial({color:0xffd23f,emissive:0x8a6a00});
const gate=new THREE.Mesh(new THREE.TorusGeometry(3,.25,8,28),new THREE.MeshBasicMaterial({color:0xff8c42}));gate.visible=false;scene.add(gate);
function startM(q){act={m:q,t:q.t,p:0,ex:[],i:0};for(const k of MS)k.g.visible=false;$('prompt').hidden=true;$('obj').hidden=false;
  if(q.id==='tok')for(let i=0;i<12;i++){const a=i/12*PI*2,r=i%2?25:15,me=new THREE.Mesh(tokG,tokM);
    me.position.set(Math.sin(a)*r,i%3===0?3:1.1,Math.cos(a)*r);me.rotation.x=PI/2;scene.add(me);act.ex.push(me)}
  if(q.id==='run'){gate.visible=true;gate.position.set(GATES[0][0],3,GATES[0][1])}
  toast(q.n+': go!');snd(520,.1);snd(780,.2)}
function endM(win){const q=act.m;for(const e of act.ex)scene.remove(e);gate.visible=false;act=null;$('obj').hidden=true;for(const k of MS)k.g.visible=true;
  if(win){const first=!done[q.id];done[q.id]=1;points+=first?1000:250;toast(q.n+' cleared! +'+(first?1000:250));snd(660,.12);snd(880,.12);snd(1320,.3);paintDone();save()}
  else if(win===false){toast('Time is up. Try again.');snd(160,.4,'sawtooth')}}
function hook(k,v){if(!act)return;const id=act.m.id;if(id==='park'&&k==='bank')act.p+=v;if(id==='rail'&&k==='grind')act.p+=v;if(id==='flip'&&k==='flip')act.p+=1}
$('startm').addEventListener('click',()=>{if(near&&!act)startM(near)});
$('quit').addEventListener('click',()=>{if(act)endM(null)});

// ---------- tricks ----------
function ollie(){if(!on||p.bail>0)return;if(p.gr||p.g){p.vy=9.5;p.gr=false;p.g=null;p.spin=0;snd(300,.07)}}
function flip(){if(!on||p.bail>0||p.gr||p.g||p.flip>0)return;p.flip=.42;p.fk=(Math.random()*4)|0;p.fn=FL[p.fk]}
function endFlip(){p.flip=0;combo.push(p.fn);cpts+=p.fk===3?160:100;hook('flip');snd(560,.06,'triangle')}
function doBail(){p.flip=0;p.bail=1.3;p.sp*=.3;combo=[];cpts=0;p.g=null;toast('Bail!');snd(110,.35,'sawtooth',.07)}
function touch(){if(p.flip>.08){doBail();return false}if(p.flip>0)endFlip();
  if(p.spin>2.6){const n=Math.round(p.spin/PI)*180;combo.push(n+' Spin');cpts+=n}p.spin=0;return true}
function bank(){if(!combo.length)return;const n=combo.length,g=Math.round(cpts)*n;points+=g;
  toast(combo.slice(-3).join(' + ')+(n>1?'  x'+n:'')+'  +'+g);hook('bank',g);combo=[];cpts=0;save();snd(700,.07);snd(1000,.1)}

// ---------- input ----------
let jx=0,jy=0,jid=null,kx=0,ky=0;const joy=$('joy'),knob=$('knob'),keys={};
function jmove(e){const r=joy.getBoundingClientRect();let dx=(e.clientX-r.left-r.width/2)/(r.width/2),dy=(e.clientY-r.top-r.height/2)/(r.height/2);
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}jx=dx;jy=dy;knob.style.transform='translate('+dx*38+'px,'+dy*38+'px)'}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(_){}jmove(e)});
joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e)});
const jend=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;knob.style.transform=''}};joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);
$('bO').addEventListener('pointerdown',e=>{e.preventDefault();ollie()});$('bT').addEventListener('pointerdown',e=>{e.preventDefault();flip()});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=1;if(e.repeat)return;if(e.code==='Space'){e.preventDefault();ollie()}
  if(e.code==='KeyX'||e.code==='KeyK')flip();if((e.code==='KeyE'||e.code==='Enter')&&near&&!act&&on)startM(near)});
addEventListener('keyup',e=>{keys[e.code]=0});
$('play').addEventListener('click',()=>{if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}on=true;$('intro').hidden=true});

// ---------- simulation ----------
const wrap=a=>{while(a>PI)a-=2*PI;while(a<-PI)a+=2*PI;return a};
function step(dt){
  kx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);ky=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  const ix=cl(jx+kx,-1,1),iy=cl(-jy+ky,-1,1);
  if(tT>0){tT-=dt;if(tT<=0)$('toast').style.opacity=0}
  if(!on)return ix;
  if(p.flip>0&&!p.gr&&!p.g){p.flip-=dt;if(p.flip<=0)endFlip()}
  if(p.bail>0){p.bail-=dt;p.sp*=.92}
  if(p.g){const r=p.g.r,mv=p.sp*dt;p.g.t+=p.g.d*mv;p.sp=Math.max(7,p.sp-1.5*dt);cpts+=mv*10;hook('grind',mv);
    p.x=r.ax+r.ux*p.g.t;p.z=r.az+r.uz*p.g.t;p.y=r.h;p.h=Math.atan2(r.ux*p.g.d,r.uz*p.g.d);
    if(p.g&&(p.g.t<0||p.g.t>r.len)){p.g=null;p.vy=0;p.gr=false;p.spin=0}
  }else{
    if(p.bail<=0){
      if(p.gr){if(iy>.15)p.sp=Math.min(MAXS,p.sp+12*iy*dt);else if(iy<-.3)p.sp-=30*dt;
        p.sp=Math.max(0,p.sp-p.sp*.22*dt);p.h-=ix*(2.7-p.sp*.045)*dt}
      else{const d=ix*3.6*dt;p.h-=d;p.spin+=Math.abs(d)}}
    const y0=p.y,dx=Math.sin(p.h)*p.sp*dt,dz=Math.cos(p.h)*p.sp*dt;
    let nx=cl(p.x+dx,-196,196),nz=p.z;if(sample(nx,nz,p.y).b){nx=p.x;p.sp*=.7}
    nz=cl(p.z+dz,-196,196);if(sample(nx,nz,p.y).b){nz=p.z;p.sp*=.7}
    p.x=nx;p.z=nz;const f=sample(nx,nz,p.y).f;
    if(p.gr){if(f>=p.y-.6){p.climb=cl((f-p.y)/dt,-20,p.sp*.75);p.y=f}else{p.gr=false;p.vy=Math.max(0,p.climb)*1.15;p.spin=0}}
    else{p.vy-=26*dt;p.y+=p.vy*dt;
      if(p.vy<=0&&p.bail<=0)for(const r of rails){const t=(p.x-r.ax)*r.ux+(p.z-r.az)*r.uz;if(t<0||t>r.len)continue;
        const ex=r.ax+r.ux*t-p.x,ez=r.az+r.uz*t-p.z;
        if(ex*ex+ez*ez<1.1&&y0>=r.h-.1&&p.y<=r.h+.1){if(!touch())break;
          p.g={r,t,d:(Math.sin(p.h)*r.ux+Math.cos(p.h)*r.uz)>=0?1:-1};p.y=r.h;p.vy=0;p.sp=Math.max(p.sp,8);combo.push('Grind');cpts+=50;snd(900,.05,'sawtooth',.03);break}}
      if(!p.g&&p.y<=f&&p.vy<=0){p.y=f;p.gr=true;p.vy=0;p.climb=0;if(touch())bank()}}
  }
  // missions
  if(act){const q=act.m;act.t-=dt;
    if(q.id==='tok')for(const e of act.ex)if(e.visible){e.rotation.z+=dt*3;const a=e.position;
      if(Math.hypot(a.x-p.x,a.y-p.y-1,a.z-p.z)<1.8){e.visible=false;act.p++;snd(1100,.08,'triangle')}}
    if(q.id==='run'){gate.rotation.y+=dt*1.5;const g=GATES[act.i];if(g&&Math.hypot(g[0]-p.x,g[1]-p.z)<4.5){act.i++;act.p++;snd(900,.1,'triangle');
      if(GATES[act.i])gate.position.set(GATES[act.i][0],3,GATES[act.i][1])}}
    $('objt').textContent=q.n+' · '+Math.floor(act.p)+'/'+q.goal+' '+q.u+' · '+Math.max(0,Math.ceil(act.t))+'s';
    if(act.p>=q.goal)endM(true);else if(act.t<=0)endM(false);
  }else{near=null;for(const q of MS)if(Math.hypot(q.x-p.x,q.z-p.z)<6)near=q;
    const show=!!near&&on;if($('prompt').hidden===show){$('prompt').hidden=!show}
    if(near){$('pn').textContent=near.n+(done[near.id]?' ✓':'');$('pd').textContent=near.d+' '+near.t+'s.'}}
  return ix}

// ---------- render ----------
const V=new THREE.Vector3(),mc=$('mini').getContext('2d'),MP=v=>(200-v)/400*208;
function render(dt,ix){
  const air=!p.gr&&!p.g,k=Math.min(1,10*dt);
  pl.position.set(p.x,p.y,p.z);pl.rotation.y=p.h;
  lean+=((p.gr?ix*.32*Math.min(1,p.sp/10):0)-lean)*k;pl.rotation.z=lean;
  const tp=p.gr&&p.sp>1?-Math.atan2(p.climb,p.sp):air?cl(-p.vy*.015,-.25,.25):0;pitch+=(tp-pitch)*k;pl.rotation.x=pitch;
  board.rotation.set(0,p.g?.5:0,0);
  if(p.flip>0){const q=1-p.flip/.42;if(p.fk===0)board.rotation.z=q*PI*2;if(p.fk===1)board.rotation.z=-q*PI*2;
    if(p.fk===2)board.rotation.y=q*PI*2;if(p.fk===3){board.rotation.z=q*PI*2;board.rotation.y=q*PI*2}}
  rider.scale.y+=((air?.84:p.g?.88:1)-rider.scale.y)*k;rider.position.y+=((.15+(p.flip>0?.32:0))-rider.position.y)*k;
  rider.rotation.x+=((p.bail>0?-1.45:0)-rider.rotation.x)*k;
  const ar=air||p.g?1.5:.35;armL.rotation.z+=(-ar-armL.rotation.z)*k;armR.rotation.z+=(ar-armR.rotation.z)*k;
  camH+=wrap(p.h-camH)*Math.min(1,(p.gr||p.g?3.5:1.2)*dt);
  const D=portrait?9.5:8;V.set(p.x-Math.sin(camH)*D,p.y+3.9,p.z-Math.cos(camH)*D);cam.position.lerp(V,1-Math.exp(-8*dt));cam.lookAt(p.x,p.y+1.4,p.z);
  sun.position.set(p.x+40,60,p.z+25);sun.target.position.set(p.x,0,p.z);sun.target.updateMatrixWorld();
  for(const q of MS)q.ring.rotation.z+=dt;
  $('pts').textContent=points.toLocaleString();
  $('combo').textContent=combo.length?combo.slice(-3).join(' + ')+'  x'+combo.length:'';
  // minimap (rotated 180 so "forward" from spawn reads as up)
  mc.save();mc.translate(208,208);mc.scale(-1,-1);mc.drawImage(MS2,0,0);mc.restore();
  if(!act)for(const q of MS){mc.fillStyle=done[q.id]?'#4ade80':'#'+q.c.toString(16).padStart(6,'0');mc.strokeStyle='#14161c';mc.lineWidth=2;
    mc.beginPath();mc.arc(MP(q.x),MP(q.z),7,0,7);mc.fill();mc.stroke()}
  else{mc.fillStyle='#ffd23f';if(act.m.id==='tok')for(const e of act.ex)if(e.visible)mc.fillRect(MP(e.position.x)-2,MP(e.position.z)-2,5,5);
    const g=act.m.id==='run'&&GATES[act.i];if(g){mc.fillStyle='#ff8c42';mc.beginPath();mc.arc(MP(g[0]),MP(g[1]),6,0,7);mc.fill()}}
  mc.save();mc.translate(MP(p.x),MP(p.z));mc.rotate(Math.atan2(-Math.sin(p.h),Math.cos(p.h)));
  mc.fillStyle='#fff';mc.strokeStyle='#14161c';mc.lineWidth=2;mc.beginPath();mc.moveTo(0,-9);mc.lineTo(6,7);mc.lineTo(-6,7);mc.closePath();mc.fill();mc.stroke();mc.restore();
  R.render(scene,cam)}
let last=performance.now();
function loop(n){const dt=Math.min(.033,(n-last)/1000)||.016;last=n;if(cv.clientWidth!==loop.w||cv.clientHeight!==loop.h){loop.w=cv.clientWidth;loop.h=cv.clientHeight;fit()}
  const ix=step(dt);render(dt,ix||0);requestAnimationFrame(loop)}
cam.position.set(0,5,42);requestAnimationFrame(loop);
})();
</script>
