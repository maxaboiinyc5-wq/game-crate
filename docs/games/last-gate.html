    +(PC?'.h svg{width:28px;height:28px}.ht{display:block;margin-top:3px;font:900 10px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;color:#1a1205}.h{border-width:3px;border-left:0;border-radius:0 14px 14px 0}.h:hover{background:#ffc94d}':'')

    +'.open .h{opacity:1;background:#ffc94d;animation:none}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'

    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'

    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'

<title>Last Gate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen field console. Status strip, live yard camera, tabbed clipboard, one big night switch.
   On a computer the yard takes the left side and the clipboard sits on the right. */
:root{
  --bg:#13150e; --panel:#1c1f15; --panel2:#272b1c; --line:#3b402b;
  --ink:#e8e3cd; --dim:#9c9a80; --amber:#f0a81e; --rust:#dc5a34; --sick:#a4d63c; --ok:#7fc06a; --steel:#6fc3c9;
  --display:'Saira Stencil One',Impact,sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 17px/1.3 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,select{font:inherit;color:inherit}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
#hud{padding:8px 16px 6px;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:baseline;gap:6px 8px;flex-wrap:wrap}
.top h1{font:400 22px/1 var(--display);margin:0;letter-spacing:.04em;color:var(--amber)}
.top .day{font:400 14px var(--mono);color:var(--ink)}
.top .threat{margin-left:auto;font:400 12px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.top .threat.big{color:var(--rust)}
.mute{background:var(--panel);border:1px solid var(--line);padding:2px 8px;font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim);border-radius:2px}
.res{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.chip{background:var(--panel);border:1px solid var(--line);padding:3px 2px 2px;text-align:center;min-width:0}
.chip b{display:block;font:400 17px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.chip span{display:block;font:400 10px/1.2 var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.chip.low b{color:var(--rust)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;align-items:center;gap:6px;font:400 10px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.bar i{flex:1;height:7px;background:var(--panel2);border:1px solid var(--line);position:relative;display:block}
.bar i u{position:absolute;inset:0 auto 0 0;background:var(--amber);display:block}
.bar em{font-style:normal;color:var(--ink);min-width:44px;text-align:right}
#sceneWrap{position:relative;height:30%;min-height:150px;border-block:1px solid var(--line)}
#scene{width:100%;height:100%;display:block}
#banner{position:absolute;left:0;right:0;top:6px;text-align:center;font:400 13px var(--mono);letter-spacing:.1em;color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none}
#fast{position:absolute;right:10px;bottom:8px;background:#000a;border:1px solid var(--line);padding:4px 10px;font:400 12px var(--mono);letter-spacing:.08em}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel)}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 0 7px;font:600 14px var(--body);text-transform:uppercase;letter-spacing:.02em;color:var(--dim);white-space:nowrap}
#tabs button.on{color:var(--amber);border-bottom-color:var(--amber)}
#tabs button sup{font:400 11px var(--mono);color:var(--bg);background:var(--amber);padding:0 5px;margin-left:3px;border-radius:8px}
#panel{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
footer{padding:8px 16px 12px}
.btn{background:var(--panel2);border:1px solid var(--line);padding:9px 12px;font:600 16px var(--body);text-transform:uppercase;letter-spacing:.05em;border-radius:2px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,select:focus-visible,#tabs button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.go{background:var(--amber);color:#1a1405;border-color:var(--amber)}
.btn.bad{border-color:var(--rust);color:var(--rust)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.sm{padding:6px 10px;font-size:14px}
#nightBtn{width:100%;padding:13px;font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
.h{font:600 19px/1.1 var(--body);text-transform:uppercase;letter-spacing:.04em}
.dim{color:var(--dim)}
.small{font-size:15px}
.mono{font:400 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tag{font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.quote{font-style:italic;color:var(--ink);border-left:2px solid var(--line);padding-left:8px}
.face{width:68px;height:68px;border:1px solid var(--line);flex:none;image-rendering:pixelated}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chk{background:var(--panel2);border:1px dashed var(--line);padding:7px 8px;text-align:left;font:500 15px/1.2 var(--body);min-height:52px;cursor:pointer}
.chk b{display:block;font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:2px}
.chk.done{border-style:solid;cursor:default}
.chk.r-ok{border-color:var(--ok)} .chk.r-ok b{color:var(--ok)}
.chk.r-warn{border-color:var(--amber)} .chk.r-warn b{color:var(--amber)}
.chk.r-bad{border-color:var(--rust)} .chk.r-bad b{color:var(--rust)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.person{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%}
.hpb{height:4px;background:var(--panel2);margin-top:3px;width:90px;max-width:100%}
.hpb u{display:block;height:100%;background:var(--ok)}
select{background:var(--panel2);border:1px solid var(--line);padding:6px 6px;border-radius:2px;font:600 15px var(--body)}
.pick{border:1px solid var(--line);background:var(--panel2);padding:6px 10px;font:600 15px var(--body);cursor:pointer}
.pick.on{border-color:var(--amber);color:var(--amber)}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.logl{font-size:15px;padding:3px 0;border-bottom:1px solid var(--line)}
.logl b{font:400 11px var(--mono);color:var(--dim);margin-right:6px}
.c-bad{color:var(--rust)} .c-good{color:var(--ok)} .c-warn{color:var(--amber)} .c-sick{color:var(--sick)}
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal .box{background:var(--panel);border:1px solid var(--amber);max-width:440px;width:100%;max-height:88%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#modal h2{font:400 22px/1.1 var(--display);margin:0;color:var(--amber);letter-spacing:.03em;text-wrap:balance}
#modal p{margin:0}
#modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
#modal .acts{display:flex;flex-direction:column;gap:6px;margin-top:4px}
#acct{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
#acct .box{background:var(--panel);border:1px solid var(--amber);max-width:440px;width:100%;max-height:92%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
#acct h2{font:400 26px/1 var(--display);margin:0;color:var(--amber);letter-spacing:.04em}
#acct p{margin:0}
#acctList{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;gap:6px}
.arow .btn:first-child{flex:1;min-width:0;text-align:left;text-transform:none;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .btn:first-child span{display:block;font:400 11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#acctForm{display:flex;gap:6px}
#acctName{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 10px;font:600 18px var(--body);border-radius:2px;user-select:text;-webkit-user-select:text}
#acctName:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.grade{font:400 72px/1 var(--display);color:var(--amber);text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stats div{background:var(--panel2);border:1px solid var(--line);padding:6px 8px;font:400 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.stats b{display:block;font:400 22px/1.1 var(--mono);color:var(--ink)}
#credits{position:fixed;inset:0;background:#0b0c08;z-index:12;overflow:hidden}
#credRoll{position:absolute;left:0;right:0;top:0;padding:0 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:roll 40s linear forwards}
#credRoll.still{animation:none;top:50%;transform:translateY(-50%)}
#credRoll h3{font:400 40px/1 var(--display);color:var(--amber);margin:0 0 20px;letter-spacing:.04em}
#credRoll h4{font:400 12px var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--dim);margin:34px 0 6px}
#credRoll p{margin:0;font:600 22px/1.25 var(--body)}
#credRoll p small{font:400 12px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-left:6px}
#credRoll .big{font:400 26px/1.2 var(--display);color:var(--ink);margin-top:6px}
#credBtn{position:absolute;right:16px;bottom:16px}
@keyframes roll{from{transform:translateY(100vh)}to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){#credits{overflow-y:auto}#credRoll{animation:none;position:static;padding-block:40px 90px}}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#000d;border:1px solid var(--line);padding:8px 14px;max-width:88%;text-align:center;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;font-size:16px}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

const STORIES=['Walked here from Dayton after the bridge fell.','My group got split up at the rail yard three days ago.','I was holed up in a school gym until the food ran out.','Been following your smoke for two days.','Our bus broke down on Route 9. I am the only one left.','I worked the night shift when it started. Never made it home.','A family took me in for a while. They are gone now.','I hid in a grain silo for a month.','I heard there were walls here. That is all I want.','Lost my brother at the river crossing. Kept walking.',
'I drove a delivery truck until the gas ran out outside Yonkers.','We had a rooftop garden on 9th. Then the stairwell door gave out.','I was a lifeguard at the Y. I can carry people. I can work.','My dog found your road. He did not make it the last mile.','I slept in a parked subway car for two weeks.','I was on a fishing boat. We came back to an empty dock.','My neighbors and I held our building for a month. I am the last one.','I taught third grade. I walked eleven kids to a shelter. Then I kept going.','I fixed elevators. I know generators, wiring, anything with a motor.','I was in a hospital bed when it started. Woke up to nobody.','We heard your radio once. Just once. That was enough.','I have been living off vending machines since August.','A man on a bike told me about this place. He would not come himself.','I buried my wife by the reservoir. I have not stopped walking since.','I cooked at a diner on Queens Boulevard. I can feed forty people out of nothing.','I was a mail carrier. I know every back street from here to the water.','My church group went north. I twisted my ankle and they left me a note.','I rode out the first month in a car wash. Good doors on a car wash.','I do not talk much. I work hard. Let me show you.','I was on the last ferry. It never docked.','My kid sister is out there somewhere. I need a safe place to look from.','I spent six days on a billboard catwalk waiting for them to wander off.','I ran a bodega. They took it, not the dead. People did.','I am a night person. Put me on the wall and I will not blink.','I followed the power lines. Figured they had to lead to somebody.','We were nine in a laundromat. Then seven. Then me.','I have counted forty one days alone. I am done counting.','I can stitch a wound and I can shut up. Which do you need?','I used to drive the Q58. I know which roads are jammed and which are clear.','I climbed out a third floor window with a bedsheet. Still have the rope burn.'];
const NEWS=[
 {h:'The Manhattan Bridge has collapsed',t:'Scouts on the roof watched the middle span of the Manhattan Bridge drop into the East River this morning. Anyone crossing from that side is on foot now.',s:['I walked all the way here after the Manhattan Bridge fell.','I was on the Manhattan Bridge when it went. I held a cable until the shaking stopped.','We were crossing the Manhattan Bridge in a van. I got out to move a cart. The van is in the river.','After the bridge fell I swam the last part. Lost my pack, kept my boots.','I saw the Manhattan Bridge go from a rooftop in Dumbo. Knew then I had to leave the city.','My camp was under the Manhattan Bridge. There is no camp now.','Everyone ran for the Brooklyn Bridge after the Manhattan one dropped. I went the other way.','I heard the bridge fall from twenty blocks off. Sounded like a train that never stopped.']},
 {h:'Fire is spreading through Midtown',t:'A wall of smoke is standing over Midtown. The fire jumped Sixth Avenue overnight and nobody is left to put it out.',s:['I ran from the Midtown fire with a wet towel on my face.','The fire took my whole block on 44th. I got out with what I am wearing.','We were safe on the 30th floor until the smoke came up the shafts.','I walked through ash up to my ankles for a day to get here.','The Midtown fire pushed thousands of the dead downtown. I slipped out behind them.','I watched Times Square burn from across the river. Then I started walking.','My lungs are still rough from the smoke. It is smoke, not sickness, I swear.']},
 {h:'The subway tunnels have flooded',t:'The pumps finally died. Water is coming up the stairs at half the stations in the city, and the people who were living down there are coming up with it.',s:['I lived on a subway platform for a month. Then the water came up overnight.','We had forty people in the tunnels under Canal Street. I do not know how many got out.','I waded two stops in the dark with water at my chest.','When the tunnels flooded, everything down there came up. Rats first. Then the dead.','I was a track worker. I told them the pumps would go. Nobody listens to a track worker.','My boots are still wet from the 7 line. Three days now.','I climbed out an emergency hatch on Lexington with the water right behind me.']},
 {h:'The stadium shelter has fallen',t:'The big shelter at the stadium went quiet on the radio last night. This morning the lot is full of the dead and the gates are open.',s:['I was at the stadium shelter. One bite in the food line and it was over in an hour.','They kept twelve hundred of us on the field. I went over the outfield wall.','I was a guard at the stadium. I opened gate C so people could run. I do not regret it.','My family was in section 214. I looked for a whole day.','After the stadium fell I hid in a dugout until dark.','The stadium had soldiers and it still fell. You need to be careful who you let in here.','I got out of the stadium in a laundry cart. Do not ask.']},
 {h:'A hospital ship has docked at Pier 90',t:'A white hospital ship came up the Hudson and tied off at Pier 90. No word on who is running it, but people are heading for the river.',s:['I went to the hospital ship at Pier 90. They are full. They turned me around.','The ship took my mother and told me to wait on the dock. I waited four days.','There are soldiers at Pier 90 and they are not letting anyone on without papers.','I got a tetanus shot on that ship and then they put me back on the street.','Thousands are camped at the pier. The dead are following the noise. I left before they got there.','I worked the gangway at Pier 90 for a week. I saw who they let on. It was not people like us.']},
 {h:'The power grid is down for good',t:'The last lights across the river went out at 2 a.m. and did not come back. Whatever was keeping the plant running is gone.',s:['When the lights went out for good, my building emptied in one night.','I ran a generator for my block until the fuel was gone. Then the lights went and so did they.','No power means no pumps, no locks, no freezers. I left the same morning.','My father was on a breathing machine. After the grid died I had no reason to stay.','I was a lineman. I can tell you that power is not coming back.','The night the grid died you could see every star. First nice thing in months.','Our door locks were electric. You can guess how that went.']},
 {h:'A prison bus was found empty on the expressway',t:'A corrections bus is sitting sideways on the expressway with the doors forced from the inside. Whoever was on it is out here somewhere.',s:['I saw that prison bus. I stayed in a ditch until the men from it had gone by.','Men in orange took my bike and my food on the expressway. Left me my shoes.','I was a guard on that bus. I am not proud of running, but I ran.','Some of the ones from the bus are fine. Some are not. I travelled with them for a day and left at night.','Everybody on the road is talking about that bus. I just want a wall between me and them.','I was on that bus. Six months for unpaid tickets. I am telling you now so you hear it from me.']},
 {h:'The army has pulled out of the city',t:'The last convoy rolled north before dawn. The checkpoints are empty and the radios only play a recording.',s:['I was at the Queensboro checkpoint when the soldiers just got in their trucks and left.','The army left crates behind at the armory. Everyone is fighting over them.','A soldier gave me his rations and told me to head for a place with walls.','I followed the convoy for a day hoping they would stop. They did not stop.','My husband is with that convoy. He said he would come back. I need somewhere to wait.','When the army left, the raiders moved into the checkpoints the same day.','I drove a supply truck for them. They left me behind with a flat tire.']},
 {h:'A herd has overrun Flushing',t:'A herd bigger than anyone has seen came down Main Street in Flushing yesterday. The survivors from there are scattering in every direction.',s:['I got out of Flushing over the rooftops. The street was just heads, wall to wall.','We had a good setup in Flushing. A market, a clinic. It lasted one afternoon.','I ran the clinic in Flushing. I have seen every kind of bite there is.','The herd in Flushing walked right past me while I lay under a truck for nine hours.','My whole street in Flushing left together. I am the only one who made it this far.','I rang the church bell in Flushing to pull them off the school. It worked. Then I ran.']},
 {h:'The Brooklyn water tower has been poisoned',t:'People who drank from the big water tower in Brooklyn got sick within a day. Nobody knows if it was raiders or just rot.',s:['I drank from the Brooklyn tower. I was sick for two days. I am fine now, check me.','Half my camp drank that water. I only had tea from my own bottle.','Raiders did that to the tower. I saw them on the ladder the night before.','I have not had a clean drink since the tower went bad. Please.','We buried six after the water went bad. I stopped trusting anything I did not boil.','I was the one who told people not to drink it. They drank it anyway.']},
 {h:'A plane went down in the bay',t:'A cargo plane circled twice and then went into the bay. Crates are washing up along the shore, and so are people.',s:['I was on that plane. I do not know how I am standing here.','I pulled two crates out of the surf after the crash. Raiders took them off me by noon.','I saw the plane hit the water. I thought help was finally coming.','The pilot made it to shore. He died that night. He told me to find walls.','Everyone ran to the beach for the crates. So did every dead thing for a mile.','I swam out to the wreck for supplies. Came back with a radio that does not work.']},
 {h:'Winter came early',t:'Frost on the wall this morning, a month ahead of time. People sleeping rough are going to start moving, and fast.',s:['I woke up with ice in my water bottle. I cannot do another night outside.','The cold got my friend before the dead could. I will work for a blanket.','The dead slow down in the cold. That is the only reason I made it here.','I burned my own furniture last night. There is nothing left to burn.','My tent collapsed under the frost. I have been walking since four in the morning.','You have smoke coming out of chimneys. I could see it for miles. So could everyone else.']}
];

let AC=null,muted=false,nbuf=null,lastShot=0,lastThump=0,nextGroan=0;try{muted=localStorage.getItem('lastgate.mute')==='1'}catch(e){}

const RE=164.8,RIFF=[[[RE,0],[196,3],[220,6],[196,10],[RE,12]],[[RE,0],[246.9,4],[233.1,6],[220,8],[196,12]],[[146.8,0],[RE,3],[196,6],[RE,12]],[[RE,0],[293.7,4],[246.9,8],[196,10],[RE,14]]];

function tone(f,d,type,v,f2,delay){if(muted)return;const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

  const t=a.currentTime+(delay||0),sr=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter();sr.buffer=nbuf;fl.type='lowpass';fl.frequency.value=fq||1200;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(fl);fl.connect(g);g.connect(a.destination);sr.start(t,Math.random()*.5,d+.03)}

};
const ASND={tab:'tap',admit:'ok',deny:'thump',trade:'coin',build:'build',expand:'build',wall:'build',repair:'build',turret:'build',ammo:'coin',send:'gate',auto:'tap',loc:'tap',crew:'tap',bcast:'warn',sendoff:'tap',restart:'tap',switchAcct:'tap',mute:'tap',music:'tap'};
let S, tab='gate', sel={loc:'suburbs',ids:[]}, N=null, restartArm=false;

function mkPerson(skill,name){return{id:S.nid++,name:name||pick(NAMES),skill,role:'rest',hp:100,st:'ok',q:0,inf:false,tr:null,seed:R(1,1e9)}}
function fresh(){
  S={v:1,day:1,food:40,water:40,scrap:60,meds:4,ammo:60,morale:70,wall:150,wallMax:150,cols:3,rows:2,rooms:['bunks','farm','well'],turrets:0,people:[],visitors:[],checks:5,broadcast:false,bcastY:false,crew:null,log:[],nid:1,hordeBonus:1,expands:0,wallLv:0,phase:'day',best:S&&S.best||0};
  const nm=NAMES.slice().sort(()=>Math.random()-.5);

const count=t=>S.rooms.filter(r=>r===t).length;

const roomCost=t=>Math.round(ROOMS[t].cost*(1+.25*count(t)));
const expandCost=()=>30+10*S.expands, wallCost=()=>25+8*S.wallLv, turretCost=()=>25+5*S.turrets;
function hordeSize(){return Math.round((3+1.3*Math.min(S.day,6)+.45*Math.max(0,S.day-6))*(S.day%5===0?1.4:1)*(S.broadcast?1.35:1)*S.hordeBonus)}
function log(m,c){S.log.unshift({d:S.day,m,c:c||''});if(S.log.length>90)S.log.pop()}
function morale(n){S.morale=clamp(S.morale+n,0,100)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function remove(p){S.people=S.people.filter(x=>x!==p)}
function stt(){return S.stats||(S.stats={kills:0,saved:0,turned:0,lost:[]})}
function kill(p,why){stt().lost.push(p.name);remove(p);morale(-8);log(`${p.name} ${why}.`,'c-bad')}
let ACCT=null,delArm=null;
const AK='lastgate.accounts',akey=n=>'lastgate.acct.'+n.toLowerCase();
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function accts(){try{const a=JSON.parse(localStorage.getItem(AK)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}

function loadAcct(n){try{const j=JSON.parse(localStorage.getItem(akey(n))||'null');return j&&j.v===1&&j.people&&j.people.length?j:null}catch(e){return null}}
function save(){if(!ACCT||!S)return;try{localStorage.setItem(akey(ACCT),JSON.stringify(S))}catch(e){}}
function showAccts(){
  let a=accts();
  if(!a.length){try{const old=localStorage.getItem('lastgate.save');if(old&&JSON.parse(old).people){a=['My base'];setAccts(a);localStorage.setItem(akey('My base'),old);localStorage.removeItem('lastgate.save')}}catch(e){}}
  $('#acctList').innerHTML=a.map((n,i)=>{const j=loadAcct(n);return`<div class="arow"><button class="btn" data-acct="${i}">${esc(n)}<span>${j?`Day ${j.day} · ${j.people.length} survivors · best ${j.best||0}`:'New base'}</span></button><button class="btn sm ${delArm===i?'bad':''}" data-del="${i}">${delArm===i?'Sure?':'Delete'}</button></div>`}).join('')||'<p class="dim small">No accounts yet. Make one below.</p>';

function enterAcct(n){

$('#acctList').addEventListener('click',e=>{const a=accts(),b=e.target.closest('[data-acct]'),d=e.target.closest('[data-del]');

function modal({title,html,choices}){

    const m=$('#modal'),b=m.querySelector('.box');

/* ---------- visitors ---------- */
function genVisitor(){
  const r=Math.random();
  if(r<.12&&S.day>1){
    const T=[['scrap',10,'food',8],['scrap',10,'water',8],['food',8,'meds',2],['scrap',12,'ammo',12],['food',6,'scrap',10],['scrap',15,'meds',2],['ammo',10,'food',8],['water',8,'scrap',9]].sort(()=>Math.random()-.5).slice(0,3);
    return{type:'trader',name:pick(NAMES),seed:R(1,1e9),offers:T.map(t=>({g:t[0],gn:t[1],k:t[2],kn:t[3],used:false}))};
  }
  const type=r<.7?'clean':r<.84?'infected':r<.93?'thief':'raider';
  const v={type,name:pick(NAMES),skill:pick(Object.keys(SKILLS)),story:(an=>an.length&&chance(.55)?pick(NEWS[pick(an).i].s):pick(STORIES))(activeNews()),seed:R(1,1e9),bite:false,fake:false,shaky:false,weapon:false,fever:false,bag:false,res:{}};
  if(type==='clean'){v.fake=chance(.08);v.shaky=chance(.15);v.weapon=chance(.12);v.fever=chance(.06)}
  if(type==='infected'){v.bite=true;v.fever=true;v.shaky=chance(.5)}
  if(type==='thief'){v.fake=chance(.75);v.shaky=chance(.6);v.weapon=chance(.6);if(!v.fake&&!v.shaky&&!v.weapon)v.fake=true;v.bag=chance(.7)}
  if(type==='raider'){v.weapon=chance(.85);v.shaky=chance(.5);v.fake=chance(.4);if(!v.fake&&!v.shaky&&!v.weapon)v.weapon=true;v.bag=chance(.7)}
  return v;
}
function checkResult(v,k){
  const bad=v.type==='thief'||v.type==='raider';
  if(k==='arms')return v.bite?['bad','Fresh bite under the left sleeve. Infected.']:['ok','Arms and neck are clean. No bites.'];
  if(k==='id')return v.fake?(bad?['bad','The photo is someone else. Fake ID.']:['warn','No papers at all. Says they burned.']):['ok','ID matches the face and the name.'];
  if(k==='temp')return v.fever?(v.bite?['bad','Burning up. Fever of 103 and grey around the eyes.']:['warn','A little warm. Could be the long walk.']):['ok','Normal temperature. Clear eyes.'];
  if(k==='bag')return v.bag?(v.type==='raider'?['bad','A map with your base circled in red.']:['bad','A bag full of other people\'s ration cards.']):['ok','Spare clothes, a photo, half a water bottle.'];
  if(k==='story')return v.shaky?['warn','Story changes when you ask twice.']:['ok','Same answers both times. Story holds up.'];
  return v.weapon?(v.type==='raider'?['bad','Loaded pistol in the boot and a raider radio.']:v.type==='thief'?['bad','Lockpicks and an empty duffel bag.']:['warn','A kitchen knife. Handed it over right away.']):['ok','No weapons in pockets or bag.'];
}
function newDay(){
  const n=S.day===1?2:R(2,4)+(S.bcastY?2:0);
  S.phase='day';S.checks=20+(count('tower')?3:0);
  S.visitors=[];for(let i=0;i<n;i++)S.visitors.push(genVisitor());
  save();tab='gate';render();showCard('DAY '+S.day,n+' at the gate');finalWarn();
}
const isFinal=()=>S.day>=30&&!S.won;
function finalWarn(){
  if(!isFinal()||S.warned===S.day)return;S.warned=S.day;save();SFX.bell();
  modal({title:`Day ${S.day} · the last night`,html:'<p>Scouts warn that the last zombies are coming, including the boss zombie. Be prepared.</p><p class="dim small">The boss is armored, takes about 300 hits, calls more zombies the whole fight, and goes berserk at half health. Max out guards, turrets, ammo and the wall. Beat it tonight and you win.</p>',choices:[{t:'Get ready',v:1,cls:'bad'}]});
}

/* ---------- actions ---------- */
function autoAssign(silent){
  S.people.forEach(p=>{if(p.st==='ok')p.role='rest'});
  S.people.filter(p=>p.st==='ok').forEach(p=>{
    const want=Object.keys(MATCH).find(r=>MATCH[r]===p.skill)||'guard';
    p.role=workers(want).length<slots(want)?want:'guard';
  });
  if(!silent){toast('Jobs handed out by skill');render()}
}
const A={
  tab(d){tab=d.t;restartArm=false;render()},
  check(d){const v=S.visitors[0];if(!v||v.res[d.k])return;if(S.checks<1)return toast('No checks left today');S.checks--;v.res[d.k]=checkResult(v,d.k);SFX[v.res[d.k][0]==='ok'?'tap':v.res[d.k][0]]();render()},
  admit(){stt().saved++;const v=S.visitors.shift();const p=mkPerson(v.skill,v.name);p.seed=v.seed;p.inf=v.bite;p.tr=v.type==='thief'||v.type==='raider'?v.type:null;
    const want=Object.keys(MATCH).find(r=>MATCH[r]===p.skill)||'guard';S.people.push(p);p.role=workers(want).length<slots(want)?want:'guard';
    stamp('LET IN','ok');log(`Let in ${v.name}, ${SKILLS[v.skill].n.toLowerCase()}.`);toast(S.people.length>cap()?`${v.name} is in. You are over your bed count.`:`${v.name} is in.`);render()},
  deny(){stt().turned++;const v=S.visitors.shift();const t={clean:`was honest. A ${SKILLS[v.skill].n.toLowerCase()} lost.`,infected:'was infected. Good call.',thief:'was a thief. Good call.',raider:'was a raider scout. Good call.'}[v.type];
    stamp('TURNED AWAY','bad');log(`Turned away ${v.name}. ${v.name} ${t}`,v.type==='clean'?'c-warn':'c-good');toast(`${v.name} ${t}`);render()},
  trade(d){const v=S.visitors[0],o=v.offers[+d.i];if(o.used||S[o.g]<o.gn)return;S[o.g]-=o.gn;S[o.k]+=o.kn;o.used=true;log(`Traded ${o.gn} ${o.g} for ${o.kn} ${o.k}.`);render()},
  sendoff(){S.visitors.shift();render()},
  build(d){const t=d.t,c=roomCost(t);if(S.rooms.length>=plots())return toast('No free plot. Expand the base first.');if(S.scrap<c)return toast('Not enough scrap');S.scrap-=c;S.rooms.push(t);log(`Built ${ROOMS[t].n}.`,'c-good');render()},
  expand(){const c=expandCost();if(S.scrap<c)return toast('Not enough scrap');S.scrap-=c;S.expands++;if(S.cols<=S.rows+1&&S.cols<6)S.cols++;else S.rows++;log('Pushed the walls out. More plots.','c-good');render()},
  wall(){const c=wallCost();if(S.scrap<c)return toast('Not enough scrap');S.scrap-=c;S.wallLv++;S.wallMax+=50;S.wall+=50;log('Reinforced the wall.','c-good');render()},
  repair(){if(S.scrap<5||S.wall>=S.wallMax)return;S.scrap-=5;S.wall=Math.min(S.wallMax,S.wall+20);render()},
  turret(){const c=turretCost();if(S.scrap<c)return toast('Not enough scrap');S.scrap-=c;S.turrets++;log('Mounted a turret on the wall.','c-good');render()},
  ammo(){if(S.scrap<5)return;S.scrap-=5;S.ammo+=15;render()},
  bcast(){S.broadcast=!S.broadcast;toast(S.broadcast?'On the air. More people tomorrow, more dead tonight.':'Radio off');render()},
  auto(){autoAssign()},
  loc(d){sel.loc=d.l;render()},
  crew(d){const id=+d.id,i=sel.ids.indexOf(id);if(i>=0)sel.ids.splice(i,1);else if(sel.ids.length<4)sel.ids.push(id);else toast('Four people at most');render()},
  send(){const ids=sel.ids.filter(id=>S.people.some(p=>p.id===id&&p.st==='ok'));if(!ids.length)return;S.crew={loc:sel.loc,ids};ids.forEach(id=>S.people.find(p=>p.id===id).st='away');sel.ids=[];log(`Sent ${ids.length} to the ${LOCS[S.crew.loc].n.toLowerCase()}.`);toast('Crew is out. Back at dusk.');render()},
  music(){musicOn=!musicOn;try{localStorage.setItem('lastgate.music',musicOn?'1':'0')}catch(e){}musicSync();renderHUD()},
  mute(){muted=!muted;try{localStorage.setItem('lastgate.mute',muted?'1':'0')}catch(e){}renderHUD();if(!muted)SFX.ok()},
  ending(){ending()},
  switchAcct(){save();delArm=null;showAccts()},
  restart(){if(!restartArm){restartArm=true;return render()}restartArm=false;fresh();intro();newDay()}
};

function vGate(){
  const v=S.visitors[0];

  if(v==='c'){S.meds-=3;p.inf=false;log(`Cured ${p.name}.`,'c-good')}
  else if(v==='q'){p.st='quar';p.q=2;log(`${p.name} went into quarantine.`,'c-sick')}

}
async function crewReturn(){

    for(const k in loc.loot)got[k]=(got[k]||0)+Math.round(R(...loc.loot[k])*(sc?1.6:1));
    if(chance(loc.risk*(sc?.5:1))){const r=Math.random();
      if(r<.5){p.hp-=40;if(p.hp<=0){kill(p,'died of wounds on the way back');lines.push(`<li class="c-bad">${p.name} died on the way back.</li>`)}else lines.push(`<li class="c-warn">${p.name} came back hurt.</li>`)}

function battle(n,raiders,fin){

      else if(z.boss){if((z.bt-=dt)<=0){z.bt=1.1;shake=5;SFX.thump();const vs=S.people.filter(p=>p.st==='ok');if(vs.length){const v=pick(vs);v.hp-=55;if(v.hp<=0){kill(v,'was killed by the boss');N.lost.push(v.name)}}}}

  if(count('tower'))sh.push({k:'w',x:bx-5,y:by-5,rate:1.4,acc:.7});
