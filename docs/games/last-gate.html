    if(END){if(END.t>6.5){const r=EB[bar];if(i===0){mNote(r,t,spb*16,'sawtooth',.15,true);mNote(r*1.5,t,spb*16,'sawtooth',.09,true)}if(i===0||i===8)mKick(t,.3);if(i===4||i===12)mHit(t,.1,.08,1500);if(i%4===0){const q=EM[bar][i/4];mNote(q,t,.75,'sawtooth',.12,true);mNote(q*2,t,.4,'square',.015)}}mNext+=spb;continue}

const ASND={tab:'tap',admit:'ok',deny:'thump',trade:'coin',build:'build',expand:'build',wall:'build',repair:'build',turret:'build',ammo:'coin',send:'gate',auto:'tap',loc:'tap',crew:'tap',bcast:'warn',sendoff:'tap',restart:'tap',switchAcct:'tap',mute:'tap',music:'tap'};

/* ---------- visitors ---------- */
function genVisitor(){
  const r=Math.random();
  if(r<.12&&S.day>1){
    const T=[['scrap',10,'food',8],['scrap',10,'water',8],['food',8,'meds',2],['scrap',12,'ammo',12],['food',6,'scrap',10],['scrap',15,'meds',2],['ammo',10,'food',8],['water',8,'scrap',9]].sort(()=>Math.random()-.5).slice(0,3);
    return{type:'trader',name:pick(NAMES),seed:R(1,1e9),offers:T.map(t=>({g:t[0],gn:t[1],k:t[2],kn:t[3],used:false}))};
  }
  const type=r<.7?'clean':r<.84?'infected':r<.93?'thief':'raider';
  const v={type,name:pick(NAMES),skill:pick(Object.keys(SKILLS)),story:pick(STORIES),seed:R(1,1e9),bite:false,fake:false,shaky:false,weapon:false,fever:false,bag:false,res:{}};
  if(type==='clean'){v.fake=chance(.08);v.shaky=chance(.15);v.weapon=chance(.12);v.fever=chance(.06)}
  if(type==='infected'){v.bite=true;v.fever=true;v.shaky=chance(.5)}
  if(type==='thief'){v.fake=chance(.75);v.shaky=chance(.6);v.weapon=chance(.6);if(!v.fake&&!v.shaky&&!v.weapon)v.fake=true;v.bag=chance(.7)}
  if(type==='raider'){v.weapon=chance(.85);v.shaky=chance(.5);v.fake=chance(.4);if(!v.fake&&!v.shaky&&!v.weapon)v.weapon=true;v.bag=chance(.7)}
  return v;
}
function checkResult(v,k){
  const bad=v.type==='thief'||v.type==='raider';
  if(k==='arms')return v.bite?['bad','Fresh bite under the left sleeve. Infected.']:['ok','Arms and neck are clean. No bites.'];
  if(k==='id')return v.fake?(bad?['bad','The photo is someone else. Fake ID.']:['warn','No papers at all. Says they burned.']):['ok','ID matches the face and the name.'];
  if(k==='temp')return v.fever?(v.bite?['bad','Burning up. Fever of 103 and grey around the eyes.']:['warn','A little warm. Could be the long walk.']):['ok','Normal temperature. Clear eyes.'];
  if(k==='bag')return v.bag?(v.type==='raider'?['bad','A map with your base circled in red.']:['bad','A bag full of other people\'s ration cards.']):['ok','Spare clothes, a photo, half a water bottle.'];
  if(k==='story')return v.shaky?['warn','Story changes when you ask twice.']:['ok','Same answers both times. Story holds up.'];
  return v.weapon?(v.type==='raider'?['bad','Loaded pistol in the boot and a raider radio.']:v.type==='thief'?['bad','Lockpicks and an empty duffel bag.']:['warn','A kitchen knife. Handed it over right away.']):['ok','No weapons in pockets or bag.'];
}
function newDay(){

/* ---------- actions ---------- */

  S.people.filter(p=>p.st==='ok').forEach(p=>{
    const want=Object.keys(MATCH).find(r=>MATCH[r]===p.skill)||'guard';

  });

  wall(){const c=wallCost();if(S.scrap<c)return toast('Not enough scrap');S.scrap-=c;S.wallLv++;S.wallMax+=50;S.wall+=50;log('Reinforced the wall.','c-good');render()},

  ammo(){if(S.scrap<5)return;S.scrap-=5;S.ammo+=15;render()},
  bcast(){S.broadcast=!S.broadcast;toast(S.broadcast?'On the air. More people tomorrow, more dead tonight.':'Radio off');render()},
  auto(){autoAssign()},
  loc(d){sel.loc=d.l;render()},
  crew(d){const id=+d.id,i=sel.ids.indexOf(id);if(i>=0)sel.ids.splice(i,1);else if(sel.ids.length<4)sel.ids.push(id);else toast('Four people at most');render()},
  send(){const ids=sel.ids.filter(id=>S.people.some(p=>p.id===id&&p.st==='ok'));if(!ids.length)return;S.crew={loc:sel.loc,ids};ids.forEach(id=>S.people.find(p=>p.id===id).st='away');sel.ids=[];log(`Sent ${ids.length} to the ${LOCS[S.crew.loc].n.toLowerCase()}.`);toast('Crew is out. Back at dusk.');render()},
  music(){musicOn=!musicOn;try{localStorage.setItem('lastgate.music',musicOn?'1':'0')}catch(e){}musicSync();renderHUD()},
  mute(){muted=!muted;try{localStorage.setItem('lastgate.mute',muted?'1':'0')}catch(e){}renderHUD();if(!muted)SFX.ok()},
  ending(){ending()},

/* ---------- render ---------- */
function renderHUD(){
  const big=S.day%5===0,tw=count('tower');
  const threat=S.phase==='night'?'':isFinal()?'Final night · boss':tw?`Horde tonight: ${hordeSize()}`:big?'Big horde tonight':'Horde size unknown';
  const chip=(k,v,low)=>`<div class="chip ${low?'low':''}"><b>${v}</b><span>${k}</span></div>`;

async function handleSick(p,msg){
  const inf=count('infirmary');SFX.warn();
  const v=await modal({title:'Infection inside',html:`<p>${msg}</p><p class="dim small">You have ${S.meds} meds.${inf?'':' No infirmary, so no quarantine.'}</p>`,choices:[{t:'Cure · 3 meds',v:'c',cls:'good',dis:S.meds<3},{t:'Quarantine · 2 days, might not make it',v:'q',dis:!inf},{t:'Send away',v:'x',cls:'bad'}]});
  if(v==='c'){S.meds-=3;p.inf=false;log(`Cured ${p.name}.`,'c-good')}
  else if(v==='q'){p.st='quar';p.q=2;log(`${p.name} went into quarantine.`,'c-sick')}
  else{remove(p);morale(-6);log(`${p.name} was sent out the gate, infected.`,'c-bad')}
}
async function crewReturn(){
  const c=S.crew;if(!c)return;S.crew=null;const loc=LOCS[c.loc],got={},lines=[],bit=[];
  for(const id of c.ids){const p=S.people.find(x=>x.id===id);if(!p)continue;p.st='ok';const sc=p.skill==='scout';
    for(const k in loc.loot)got[k]=(got[k]||0)+Math.round(R(...loc.loot[k])*(sc?1.6:1));
    if(chance(loc.risk*(sc?.5:1))){const r=Math.random();
      if(r<.5){p.hp-=40;if(p.hp<=0){kill(p,'died of wounds on the way back');lines.push(`<li class="c-bad">${p.name} died on the way back.</li>`)}else lines.push(`<li class="c-warn">${p.name} came back hurt.</li>`)}
      else if(r<.78){bit.push(p);lines.push(`<li class="c-sick">${p.name} came back bitten.</li>`)}
      else{kill(p,`never came back from the ${loc.n.toLowerCase()}`);lines.push(`<li class="c-bad">${p.name} never came back.</li>`)}}}
  for(const k in got)S[k]+=got[k];
  const haul=Object.keys(got).filter(k=>got[k]).map(k=>`${got[k]} ${k}`).join(', ')||'nothing';
  log(`Crew back from the ${loc.n.toLowerCase()}: ${haul}.`);renderHUD();
  await modal({title:'Crew is back',html:`<p>Haul from the ${loc.n.toLowerCase()}: <b>${haul}</b>.</p><ul>${lines.join('')||'<li class="c-good">Everyone made it back fine.</li>'}</ul>`,choices:[{t:'Good',v:1}]});
  for(const p of bit)if(S.people.includes(p))await handleSick(p,`${p.name} has a bite on the forearm from the run.`);
}
async function startNight(){
  S.phase='busy';render();
  if(S.visitors.length){log(`${S.visitors.length} left outside when the gate shut.`);S.visitors=[]}
  await crewReturn();
  let raiders=0;const rd=S.people.find(p=>p.tr==='raider');
  if(rd){remove(rd);raiders=4;S.wall=Math.max(0,S.wall-20);const f=Math.min(8,Math.ceil(S.food*.15)),a=Math.min(10,Math.ceil(S.ammo*.15));S.food-=f;S.ammo-=a;morale(-10);SFX.bad();log(`${rd.name} was a raider scout. Opened the gate from inside.`,'c-bad');
    await modal({title:'Betrayal',html:`<p>${rd.name} unbolts the gate after dark and whistles. Raiders rush in, grab <b>${f} food</b> and <b>${a} ammo</b>, and smash the wall on the way out. More of them are coming with the horde.</p>`,choices:[{t:'To the wall',v:1,cls:'bad'}]})}

function battle(n,raiders,fin){
  return new Promise(res=>{
    const sp=[];for(let i=0;i<n;i++)sp.push({t:Math.random()*Math.min(15,4+n*.35),brute:S.day>=5&&chance(fin?.25:.06)});
    if(fin)sp.push({t:7,boss:true});
    for(let i=0;i<raiders;i++)sp.push({t:Math.random()*3,raider:true});
    sp.sort((a,b)=>a.t-b.t);
    N={sp,zs:[],shots:[],t:0,kills:0,lost:[],cd:{},res,fin:!!fin,fast:false,hud:0};
    $('#fast').hidden=false;$('#fast').textContent='Speed x3';
  });
}
function stepNight(dt){

    const x=e===0?-6:e===1?G.W+6:Math.random()*G.W,y=e===2?-6:e===3?G.H+6:Math.random()*G.H;

  for(const z of N.zs){const cx=clamp(z.x,bx,bx+bw),cy=clamp(z.y,by,by+bh),dx=cx-z.x,dy=cy-z.y,d=Math.hypot(dx,dy);
    if(d>3){z.x+=dx/d*z.sp*dt;z.y+=dy/d*z.sp*dt}
    else{z.at=true;if(S.wall>0&&performance.now()-lastThump>420){lastThump=performance.now();SFX.thump()}if(S.wall>0)S.wall=Math.max(0,S.wall-(z.boss?(z.rage?20:12):z.brute?4:1.8)*dt);
      else if(z.boss){if((z.bt-=dt)<=0){z.bt=1.1;SFX.thump();const vs=S.people.filter(p=>p.st==='ok');if(vs.length){const v=pick(vs);v.hp-=55;if(v.hp<=0){kill(v,'was killed by the boss');N.lost.push(v.name)}}}}
      else{z.hp=0;z.in=true;const vs=S.people.filter(p=>p.st==='ok');if(vs.length&&!chance(.45)){const v=pick(vs);v.hp-=55;if(v.hp<=0){kill(v,'was pulled down at the breach');N.lost.push(v.name)}}}}}
  const sh=[];const gs=workers('guard');
  gs.forEach((p,i)=>{const [x,y]=per((i+.5)/gs.length);sh.push({k:'g'+p.id,x,y,rate:p.skill==='guard'?.6:1,acc:p.skill==='guard'?.92:.78,g:1})});
  for(let i=0;i<S.turrets;i++){const [x,y]=per(i*.37+.06);sh.push({k:'t'+i,x,y,rate:.45,acc:.8})}
  if(count('tower'))sh.push({k:'w',x:bx-5,y:by-5,rate:1.4,acc:.7});
  for(const s of sh){N.cd[s.k]=(N.cd[s.k]??Math.random()*s.rate)-dt;if(N.cd[s.k]>0)continue;
    let t=null,bd=1e9;for(const z of N.zs){if(z.hp<=0)continue;const d=Math.hypot(z.x-s.x,z.y-s.y);if(d<bd){bd=d;t=z}}
    if(!t)continue;
    if(S.ammo>0){S.ammo--;N.cd[s.k]=s.rate;if(performance.now()-lastShot>80){lastShot=performance.now();SFX.shot()}if(chance(s.acc*(t.boss?.65:1)))t.hp--;N.shots.push({x1:s.x,y1:s.y,x2:t.x,y2:t.y,l:.12})}
    else if(s.g&&t.at){N.cd[s.k]=s.rate*1.2;if(chance(.7))t.hp--;N.shots.push({x1:s.x,y1:s.y,x2:t.x,y2:t.y,l:.1,m:1})}
    else N.cd[s.k]=.3}
  N.zs=N.zs.filter(z=>{if(z.hp<=0){if(!z.in)N.kills++;if(z.boss){N.bossDead=true;SFX.over();toast('The boss is down!')}return false}return true});
  const bz0=N.zs.find(z=>z.boss);if(bz0){bz0.rage=bz0.hp<150;if((bz0.sm=(bz0.sm??5)-dt)<=0&&(N.sum||0)<45){bz0.sm=bz0.rage?3:4.5;for(let k=0;k<3;k++)N.sp.unshift({t:N.t});N.sum=(N.sum||0)+3;SFX.groan()}}

  N.hud-=dt;if(N.hud<=0){N.hud=.2;renderHUD();const bz=N.zs.find(z=>z.boss);$('#banner').textContent=`${N.fin?'FINAL NIGHT':'NIGHT '+S.day} · ${N.zs.length+N.sp.length} OUTSIDE${bz?(bz.rage?' · BOSS ENRAGED ':' · BOSS ')+Math.max(0,bz.hp)+' HP':''}${S.ammo<=0?' · OUT OF AMMO':''}`}
  if((!N.sp.length&&!N.zs.length)||!S.people.length){const r={kills:N.kills,lost:N.lost,fin:N.fin},f=N.res;N=null;$('#fast').hidden=true;$('#banner').textContent='';f(r)}
}
async function dawn(nr){

async function randomEvent(){

    async()=>{const v=await modal({title:'A kid at the gate',html:'<p>A girl, maybe nine, stands alone outside with a backpack and a flashlight. No bites. No one with her.</p>',choices:[{t:'Let her in',v:1,cls:'good'},{t:'Turn her away',v:0,cls:'bad'}]});
      if(v){const p=mkPerson('scout','Pip');S.people.push(p);p.role='rest';morale(10);log('Took in Pip, a kid who is quick on her feet.','c-good')}else{morale(-10);log('Turned a kid away. Nobody is talking today.','c-bad')}},
    async()=>{const v=await modal({title:'Soldier',html:`<p>A soldier in torn gear bangs on the gate. He wants 8 food and 6 ammo "for the war effort".</p>`,choices:[{t:'Pay him',v:'p',dis:S.food<8||S.ammo<6},{t:'Offer him a bunk instead',v:'b'},{t:'Refuse',v:'r',cls:'bad'}]});

      else if(chance(.5)){log('The soldier spat and walked off.');toast('He spits and walks off.')}

    async()=>{S.scrap+=12;S.ammo+=5;log('Found a supply crate: 12 scrap, 5 ammo.','c-good');await modal({title:'Supply crate',html:'<p>A parachute crate is tangled in a tree by the road. Inside: 12 scrap and 5 ammo.</p>',choices:[{t:'Haul it in',v:1,cls:'good'}]})},
    async()=>{const l=Math.ceil(S.food*.2);S.food-=l;log(`Rats in the pantry. Lost ${l} food.`,'c-bad');await modal({title:'Rats',html:`<p>Rats chewed through the pantry sacks overnight. ${l} food is ruined.</p>`,choices:[{t:'Set traps',v:1}]})},
    async()=>{const v=await modal({title:'Guitar at the gate',html:'<p>An old man with a guitar asks to play for a meal, then move on.</p>',choices:[{t:'Feed him · 2 food',v:1,cls:'good',dis:S.food<2},{t:'No room for songs',v:0}]});if(v){S.food-=2;morale(12);log('A night of music. Morale up.','c-good')}},
    async()=>{S.hordeBonus=1.25;log('A herd is passing close. Tonight is worse.','c-warn');await modal({title:'Herd on the highway',html:'<p>A huge herd is drifting past on the highway. A quarter more dead will find the wall tonight.</p>',choices:[{t:'Get ready',v:1,cls:'bad'}]})}
  ];

}
async function gameOver(){
  const d=S.day;if(d>(S.best||0))S.best=d;const best=S.best;
  
  renderHUD();
  SFX.over();
  await modal({title:'The gate fell',html:`<p>Nobody is left inside. You held out for <b>${d} day${d>1?'s':''}</b>.</p><p class="dim">Best run: ${best} days.</p>`,choices:[{t:'Start over',v:1,cls:'go'}]});
  fresh();S.best=best;newDay();
}
let END=null;
async function ending(){
  const e=S.end;if(!e||END)return;const ph=S.phase;S.phase='busy';render();
  END={t:0};$('#banner').textContent='SUNRISE';SFX.win();
  await new Promise(r=>setTimeout(r,7500));
  $('#banner').textContent='';
  const good=e.grade==='S'||e.grade==='A',mid=e.grade==='B'||e.grade==='C';

}
function credits(e){
  return new Promise(res=>{
    const c=$('#credits'),r=$('#credRoll'),b=$('#credBtn'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
    const lines=e.names.length+e.lost.length+10;

      ${e.lost.length?`<h4>In memory of</h4>${e.lost.map(n=>`<p>${esc(n)}</p>`).join('')}`:'<h4>Nobody was lost</h4>'}
      <h4>Base commander</h4><p>${esc(ACCT||'You')}</p><h4>Created by</h4><p class="big">Maxcade developers</p><h4>Thanks for holding the gate</h4>`;
    r.style.animationDuration=Math.max(22,Math.min(70,lines*1.6))+'s';
    b.textContent=still?'Keep playing':'Skip';c.hidden=false;
    const fin=()=>{r.className='still';r.innerHTML='<h3>LAST GATE</h3><h4>Created by</h4><p class="big">Maxcade developers</p><h4>The end</h4>';b.textContent='Keep playing'};
    r.onanimationend=fin;
    b.onclick=()=>{SFX.tap();c.hidden=true;r.onanimationend=null;r.innerHTML='';res()};

}
function intro(){return modal({title:'Last Gate',html:`<p>You run the last safe base for miles. Hold out until day 30, then beat the boss zombie and its horde to win.</p><ul><li><b>Gate:</b> check each stranger, then let them in or turn them away. You get 20 checks a day.</li><li><b>Build</b> rooms and <b>People</b> jobs keep everyone fed.</li><li><b>Scavenge</b> for meds, ammo and scrap.</li><li>Lock the gate when ready. The dead come every night, and a big horde every 5th.</li></ul>`,choices:[{t:'Open the gate',v:1,cls:'go'}]})}

/* ---------- drawing ---------- */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawFace(c,seed){const r=rng(seed),x=c.getContext('2d'),P=(a)=>a[Math.floor(r()*a.length)];
  x.fillStyle=P(['#2b3022','#30291f','#252b2e']);x.fillRect(0,0,34,34);
  x.fillStyle=P(['#4a5a3a','#5a4a3a','#3a4a5a','#5a3a3a','#555']);x.fillRect(6,26,22,8);
  const skin=P(['#e3b58c','#c98f62','#a06a42','#7a4a2c','#f0c9a4']);x.fillStyle=skin;x.fillRect(11,9,12,15);x.fillRect(14,24,6,3);
  x.fillStyle=P(['#1c1410','#4a2f18','#8a8478','#a8552a','#2a2a2a']);const h=Math.floor(r()*4);
  if(h===0){x.fillRect(10,6,14,5)}else if(h===1){x.fillRect(10,6,14,4);x.fillRect(9,9,3,12);x.fillRect(22,9,3,12)}else if(h===2){x.fillRect(10,7,14,3)}else{x.fillStyle=P(['#5a5f3a','#3a3f4a','#6a3a2a']);x.fillRect(9,5,16,5);x.fillRect(9,9,19,2)}
  x.fillStyle='#111';x.fillRect(13,15,2,2);x.fillRect(19,15,2,2);x.fillStyle='#0004';x.fillRect(15,20,4,1);
  if(r()<.3){x.fillStyle='#0003';x.fillRect(11,20,12,4)}
  if(r()<.25){x.fillStyle='#7a2a1a';x.fillRect(21,12,1,5)}
}
const cv=$('#scene'),cx=cv.getContext('2d');let G={W:360,H:200,bx:0,by:0,bw:10,bh:10,cell:10};
const debris=Array.from({length:70},()=>[Math.random(),Math.random(),Math.random()]);
const pos=new Map();
function per(t){const{bx,by,bw,bh}=G,P=2*(bw+bh);let d=(((t%1)+1)%1)*P;if(d<bw)return[bx+d,by];d-=bw;if(d<bh)return[bx+bw,by+d];d-=bh;if(d<bw)return[bx+bw-d,by+bh];d-=bw;return[bx,by+bh-d]}
function layout(){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  const W=360,H=360*h/Math.max(1,w),cell=Math.min(W*.6/S.cols,H*.58/S.rows),bw=cell*S.cols,bh=cell*S.rows;
  G={W,H,cell,bw,bh,bx:(W-bw)/2,by:(H-bh)/2-3,sc:cv.width/W};
}
function draw(dt){
  layout();const{W,H,bx,by,bw,bh,cell}=G,night=S.phase==='night';
  cx.setTransform(G.sc,0,0,G.sc,0,0);
  if(END){END.t+=dt;const k=clamp(END.t/6,0,1),m=(a,b)=>Math.round(a+(b-a)*k);cx.fillStyle=`rgb(${m(11,120)},${m(13,98)},${m(14,48)})`;cx.fillRect(0,0,W,H);
    const sy=by-6-k*10,gr=cx.createRadialGradient(W/2,sy,2,W/2,sy,W*.6);gr.addColorStop(0,`rgba(255,214,120,${.85*k})`);gr.addColorStop(1,'rgba(255,214,120,0)');cx.fillStyle=gr;cx.fillRect(0,0,W,H);
    cx.fillStyle=`rgba(255,236,170,${k})`;cx.beginPath();cx.arc(W/2,sy,7,0,7);cx.fill()}
  else{cx.fillStyle=night?'#0b0d0e':'#23261a';cx.fillRect(0,0,W,H)}
  cx.fillStyle=night?'#15181a':'#2e3122';cx.fillRect(W/2-9,by+bh,18,H);
  for(const d of debris){cx.fillStyle=night?'#1a1e20':d[2]<.5?'#2f3323':'#1b1d14';cx.fillRect(d[0]*W,d[1]*H,1.5+d[2]*2,1.5)}
  cx.fillStyle=night?'#16191a':'#34382a';cx.fillRect(bx,by,bw,bh);
  for(let i=0;i<plots();i++){const x=bx+(i%S.cols)*cell,y=by+Math.floor(i/S.cols)*cell,t=S.rooms[i];
    if(t){const r=ROOMS[t];cx.fillStyle=r.c;cx.globalAlpha=night?.6:1;cx.fillRect(x+2.5,y+2.5,cell-5,cell-5);cx.globalAlpha=1;
      cx.fillStyle='#0008';cx.fillRect(x+2.5,y+cell-2.5-cell*.26,cell-5,cell*.26);
      cx.fillStyle='#f3eed8';cx.font=`600 ${Math.max(5,cell*.19)}px "Barlow Condensed",sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(r.n.toUpperCase().split(' ')[0],x+cell/2,y+cell-2.5-cell*.13);
      if(t==='infirmary'){cx.fillStyle='#b3261a';cx.fillRect(x+cell/2-1.5,y+cell*.2,3,cell*.3);cx.fillRect(x+cell/2-cell*.15,y+cell*.35-1.5,cell*.3,3)}
      if(t==='farm'){cx.strokeStyle='#8fb04a';cx.lineWidth=1;for(let k=1;k<4;k++){cx.beginPath();cx.moveTo(x+5,y+3+k*cell*.16);cx.lineTo(x+cell-5,y+3+k*cell*.16);cx.stroke()}}
      if(t==='well'){cx.fillStyle='#8fd0e8';cx.beginPath();cx.arc(x+cell/2,y+cell*.36,cell*.14,0,7);cx.fill()}
    }else{cx.strokeStyle='#ffffff18';cx.lineWidth=.6;cx.setLineDash([2,2]);cx.strokeRect(x+3,y+3,cell-6,cell-6);cx.setLineDash([])}}
  const wr=S.wall/S.wallMax;cx.strokeStyle=wr<=0?'#5a2a1a':wr<.3?'#dc5a34':'#8d8a70';cx.lineWidth=2.4+S.wallLv*.5;
  cx.beginPath();cx.moveTo(W/2-7,by+bh);cx.lineTo(bx,by+bh);cx.lineTo(bx,by);cx.lineTo(bx+bw,by);cx.lineTo(bx+bw,by+bh);cx.lineTo(W/2+7,by+bh);cx.stroke();
  cx.strokeStyle=S.phase==='day'?'#f0a81e':'#8d8a70';cx.lineWidth=2;cx.beginPath();if(S.phase==='day'||END){cx.moveTo(W/2-7,by+bh);cx.lineTo(W/2-11,by+bh+6);cx.moveTo(W/2+7,by+bh);cx.lineTo(W/2+11,by+bh+6)}else{cx.moveTo(W/2-7,by+bh);cx.lineTo(W/2+7,by+bh)}cx.stroke();
  if(count('tower')){cx.fillStyle='#6a6f58';cx.fillRect(bx-9,by-9,8,8);cx.strokeStyle='#f0a81e';cx.lineWidth=.8;cx.strokeRect(bx-9,by-9,8,8)}
  for(let i=0;i<S.turrets;i++){const[x,y]=per(i*.37+.06);cx.fillStyle='#22241a';cx.beginPath();cx.arc(x,y,3.4,0,7);cx.fill();cx.strokeStyle='#f0a81e';cx.lineWidth=1;cx.stroke()}
  const gs=workers('guard');
  for(const p of S.people){if(p.st==='away'){pos.delete(p.id);continue}
    let o=pos.get(p.id);if(!o){o={x:W/2,y:by+bh-4,tx:W/2,ty:by+bh/2,w:0};pos.set(p.id,o)}
    const gi=gs.indexOf(p);
    const pi=S.people.indexOf(p);
    if(END){if(END.t>pi*.35){if(o.y<by+bh-1.5&&Math.abs(o.x-W/2)>3){o.tx=W/2;o.ty=by+bh-3}else{o.tx=W/2+((pi%3)-1)*5;o.ty=H+12}}}
    else if(gi>=0){[o.tx,o.ty]=per((gi+.5)/gs.length)}else if((o.w-=dt)<=0){o.w=1.5+Math.random()*4;o.tx=bx+5+Math.random()*(bw-10);o.ty=by+5+Math.random()*(bh-10)}
    const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);if(d>.6){const s=Math.min(d,(night?16:11)*dt);o.x+=dx/d*s;o.y+=dy/d*s}
    cx.fillStyle=p.st==='quar'?'#a4d63c':SKILLS[p.skill].c;cx.beginPath();cx.arc(o.x,o.y,2.5,0,7);cx.fill();cx.strokeStyle='#000a';cx.lineWidth=.7;cx.stroke()}
  if(S.phase==='day')S.visitors.forEach((v,i)=>{cx.fillStyle=v.type==='trader'?'#f0a81e':'#d8d2ba';cx.beginPath();cx.arc(W/2,by+bh+11+i*8,2.5,0,7);cx.fill();cx.strokeStyle='#000a';cx.lineWidth=.7;cx.stroke()});
  if(N){for(const z of N.zs){z.w+=dt*6;cx.fillStyle=z.boss?(z.rage?'#c21f14':'#7a1f1a'):z.raider?'#c8442c':z.brute?'#5f8a2a':'#8fb83a';cx.beginPath();cx.arc(z.x+Math.sin(z.w)*.6,z.y,z.boss?(z.rage?11:9):z.brute?4:2.6,0,7);cx.fill();cx.strokeStyle=z.boss?'#f0a81e':'#000b';cx.lineWidth=z.boss?1.6:.7;cx.stroke();
      if(z.boss){cx.fillStyle='#000a';cx.fillRect(z.x-12,z.y-15,24,3);cx.fillStyle='#dc5a34';cx.fillRect(z.x-12,z.y-15,24*Math.max(0,z.hp)/300,3)}}
    for(const s of N.shots){cx.strokeStyle=s.m?'#ffffff88':'#ffd76a';cx.lineWidth=s.m?1.2:.8;cx.beginPath();cx.moveTo(s.x1,s.y1);cx.lineTo(s.x2,s.y2);cx.stroke()}}
}
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(!S)return requestAnimationFrame(frame);
  if(N){const k=N.fast?3:1;for(let i=0;i<k&&N;i++)stepNight(dt*1.3)}
  draw(dt);requestAnimationFrame(frame)}

function start(data){
