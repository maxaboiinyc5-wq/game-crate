<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',PC=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches),BW=PC?60:42,BH=PC?60:58,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid #fff;border-radius:11px;background:#ffb020;cursor:pointer;opacity:1;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5);animation:mxglow 2.4s ease-in-out infinite}'
    +'@keyframes mxglow{50%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5),0 0 18px 5px rgba(255,176,32,.8)}}'
    +'@media (prefers-reduced-motion:reduce){.h{animation:none}}'
    +'.h svg{display:block;width:24px;height:24px;margin:0 auto;fill:#1a1205}'
    +(PC?'.h svg{width:28px;height:28px}.ht{display:block;margin-top:3px;font:900 10px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;color:#1a1205}.h{border-width:3px;border-left:0;border-radius:0 14px 14px 0}.h:hover{background:#ffc94d}':'')
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#ffc94d;animation:none}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    if(PC){x=BW/2;y=H/2-BH/2-5}   /* computers: docked on the left edge, above the controls tab */
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));
    host.style.left=x+'px';host.style.top=y+'px';
    w.classList.toggle('sl',x>W/2);w.classList.toggle('sr',x<=W/2);
    w.classList.toggle('vt',y<110);w.classList.toggle('vb',y>H-110);w.classList.toggle('vm',y>=110&&y<=H-110);
    pos=[x/W,y/H];
  }
  function put(){place(pos[0]*window.innerWidth,pos[1]*window.innerHeight)}
  try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))pos=p}catch(e){}
  put();window.addEventListener('resize',put);
  var drag=null;
  h.addEventListener('pointerdown',function(e){
    var r=host.getBoundingClientRect();
    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  h.addEventListener('pointermove',function(e){
    if(PC)return;
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<9)return;
    drag.moved=true;w.classList.remove('open');
    place(drag.ox+dx,drag.oy+dy);
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(e.type==='pointercancel')return;
    if(d.moved){try{localStorage.setItem(KEY,JSON.stringify(pos))}catch(_){}}
    else w.classList.toggle('open');
  }
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('click',function(e){if(e.detail===0)w.classList.toggle('open')});
  root.querySelector('.s').addEventListener('click',function(){w.classList.remove('open')});
  root.querySelector('.x').addEventListener('click',function(){
    try{
      if(window.__maxcade)location.reload();
      else if(history.length>1)history.back();
      else location.href='../';
    }catch(e){location.href='../'}
  });
  ['pointerdown','pointerup','pointermove','mousedown','mouseup','touchstart','touchend','touchmove','click','keydown','keyup'].forEach(function(t){
    host.addEventListener(t,function(e){e.stopPropagation()});
  });
  (document.documentElement||document.body).appendChild(host);
})();
</script>

<title>Lawn Guard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Layout: one-screen game. Wooden seed tray on top, lawn canvas fills the rest;
   lawn turns vertical on a portrait phone so cells stay thumb-sized. */
:root{
  color-scheme:dark;
  --soil:#2a1c12; --wood:#7a4a24; --wood-dark:#553116; --card:#e9d9a6;
  --ink:#2b1a0c; --sun:#ffd23c; --leaf:#5fb832; --danger:#d8452e;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
}
html,body{height:100%;overscroll-behavior:none}
*{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:var(--soil);color:var(--card);font-family:var(--display);display:flex;flex-direction:column;
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#hud{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--wood);
  border-bottom:4px solid var(--wood-dark);flex-wrap:wrap}
#sunbox{display:flex;align-items:center;gap:6px;background:var(--wood-dark);border-radius:10px;padding:6px 10px;
  font-size:22px;color:var(--sun);min-width:74px;font-variant-numeric:tabular-nums}
#sunbox i{width:20px;height:20px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px #f5a300}
.card{position:relative;width:52px;height:66px;border-radius:8px;border:3px solid var(--wood-dark);background:var(--card);
  color:var(--ink);font:16px var(--display);padding:0;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-end;overflow:hidden;cursor:pointer}
.card canvas{width:44px;height:44px}
.card.sel{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun)}
.card.poor{filter:grayscale(.8) brightness(.7)}
.card::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--cd,0)*100%);background:#000a}
.card:focus-visible{outline:3px solid #fff}
#shovel{justify-content:center;font-size:13px;margin-left:auto}
#shovel svg{width:30px;height:30px}
#bar{flex-basis:100%;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--card)}
#msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{width:110px;height:10px;background:var(--wood-dark);border-radius:5px;overflow:hidden}
#prog b{display:block;height:100%;width:0;background:var(--danger)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px 16px}
canvas#c{display:block;border-radius:8px;touch-action:none}
#over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#1a1009cc;text-align:center;padding:16px}
#over h1{margin:0;font-size:44px;color:var(--sun);font-weight:400;text-wrap:balance}
#over p{margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--card);max-width:30ch}
#go{font:22px var(--display);background:var(--leaf);color:#102404;border:0;border-bottom:5px solid #3a7a1a;
  border-radius:12px;padding:10px 28px;cursor:pointer}
#go:focus-visible{outline:3px solid #fff}
</style>

<div id="hud">
  <div id="sunbox"><i></i><span id="sun">50</span></div>
  <button class="card" id="k-sun" data-k="sun"><canvas width="88" height="88"></canvas>50</button>
  <button class="card" id="k-pea" data-k="pea"><canvas width="88" height="88"></canvas>100</button>
  <button class="card" id="k-nut" data-k="nut"><canvas width="88" height="88"></canvas>50</button>
  <button class="card" id="shovel" data-k="shovel" aria-label="Shovel">
    <svg viewBox="0 0 24 24"><path d="M14 3l7 7-2 2-2.5-2.5-6 6c1.5 2.5 1 5-1 7-2.500-1-5-2-6.500-3.500S2 15.500 1.500 13c2-2 4.500-2.500 7-1l6-6L12 3.500z" fill="#6b6f76" stroke="#2b1a0c" stroke-width="1"/></svg>Dig
  </button>
  <div id="bar"><span id="msg">Pick a plant, then tap the lawn</span><div id="prog"><b id="pb"></b></div></div>
</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="over">
    <h1 id="ot">Lawn Guard</h1>
    <p id="op">Plant sunflowers for sun, pea shooters to fight. Tap suns to collect them. Stop 30 zombies from crossing the lawn.</p>
    <button id="go">Play</button>
  </div>
</div>

<script>
const L=9.4,LN=5,CO=9,TOTAL=30;
const COST={sun:50,pea:100,nut:50},CD={sun:5,pea:5,nut:9},HP={sun:300,pea:300,nut:3000};
const cv=document.getElementById('c'),g=cv.getContext('2d'),stage=document.getElementById('stage');
const $=id=>document.getElementById(id);
let C=40,portrait=false,W=0,H=0,run=false,last=0;
let grid,zombies,peas,suns,sun,cds,sel,spawned,killed,T,nextZ,nextSky,finalShown;

function reset(){
  grid=[...Array(LN)].map(()=>Array(CO).fill(null));
  zombies=[];peas=[];suns=[];sun=50;cds={sun:0,pea:0,nut:0};sel=null;spawned=0;killed=0;T=0;nextZ=18;nextSky=2;finalShown=false;
  say('Pick a plant, then tap the lawn');
}
function say(t){$('msg').textContent=t}

function resize(){
  const r=stage.getBoundingClientRect(),w=r.width-32,h=r.height-16;
  portrait=h>w;
  C=Math.max(20,Math.floor(portrait?Math.min(w/LN,h/L):Math.min(w/L,h/LN)));
  W=portrait?LN*C:L*C;H=portrait?L*C:LN*C;
  const d=window.devicePixelRatio||1;
  cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';
  g.setTransform(d,0,0,d,0,0);
}
const pos=(u,d)=>portrait?[u*C,(L-d)*C]:[d*C,u*C];

/* ---------- sprites (origin = cell centre, s = cell size) ---------- */
function circ(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=f;c.fill()}
function leafBase(c,s){c.fillStyle='#3d8f1f';c.beginPath();c.ellipse(-.14*s,.36*s,.16*s,.07*s,-.3,0,7);c.ellipse(.14*s,.36*s,.16*s,.07*s,.3,0,7);c.fill()}
function drawSunflower(c,s,t){
  leafBase(c,s);
  c.strokeStyle='#3d8f1f';c.lineWidth=.07*s;c.beginPath();c.moveTo(0,.36*s);c.lineTo(0,0);c.stroke();
  const b=Math.sin(t*3)*.02*s;c.save();c.translate(0,-.1*s+b);
  c.fillStyle='#ffc61a';
  for(let i=0;i<12;i++){c.save();c.rotate(i*Math.PI/6);c.beginPath();c.ellipse(0,-.27*s,.075*s,.13*s,0,0,7);c.fill();c.restore()}
  circ(c,0,0,.2*s,'#a5651e');
  circ(c,-.07*s,-.04*s,.028*s,'#2b1a0c');circ(c,.07*s,-.04*s,.028*s,'#2b1a0c');
  c.strokeStyle='#2b1a0c';c.lineWidth=.025*s;c.beginPath();c.arc(0,.02*s,.09*s,.3,2.84);c.stroke();
  c.restore();
}
function drawPea(c,s,t,up,kick){
  leafBase(c,s);
  c.strokeStyle='#3d8f1f';c.lineWidth=.07*s;c.beginPath();c.moveTo(0,.36*s);c.lineTo(0,.05*s);c.stroke();
  const dx=up?0:1,dy=up?-1:0,k=(kick||0)*.06*s;
  c.save();c.translate(-dx*k,-.1*s+Math.sin(t*2.500)*.015*s-dy*k);
  circ(c,dx*.24*s,dy*.24*s,.13*s,'#6cc93a');
  circ(c,0,0,.22*s,'#7bd843');
  circ(c,dx*.33*s,dy*.33*s,.085*s,'#1f4d0d');
  if(up){circ(c,-.09*s,.02*s,.035*s,'#14280a');circ(c,.09*s,.02*s,.035*s,'#14280a')}
  else circ(c,.03*s,-.08*s,.04*s,'#14280a');
  c.fillStyle='#4fa524';c.beginPath();c.ellipse(-dx*.2*s,-dy*.2*s+(up?.2*s:0),.07*s,.11*s,up?0:1.2,0,7);c.fill();
  c.restore();
}
function drawNut(c,s,hp){
  const st=hp>2000?0:hp>1000?1:2; // 0 fresh, 1 worn (10 bites), 2 wrecked (20 bites)
  c.fillStyle='#0003';c.beginPath();c.ellipse(0,.38*s,.26*s,.06*s,0,0,7);c.fill();
  c.save();c.beginPath();c.ellipse(0,.02*s,.3*s,.36*s,0,0,7);c.clip();
  c.fillStyle=st==2?'#a8793f':'#c4904a';c.fillRect(-s,-s,2*s,2*s);
  c.fillStyle='#ffffff2a';c.beginPath();c.ellipse(-.1*s,-.14*s,.1*s,.16*s,-.3,0,7);c.fill();
  c.fillStyle='#5cab33';
  if(st>=1)circ(c,.3*s,-.26*s,.13*s,'#5cab33');
  if(st==2){circ(c,-.32*s,.22*s,.15*s,'#5cab33');circ(c,.33*s,.2*s,.1*s,'#5cab33');circ(c,-.08*s,-.4*s,.1*s,'#5cab33')}
  c.restore();
  c.strokeStyle='#5a3712';c.lineWidth=.022*s;c.lineCap='round';c.beginPath();
  if(st>=1){c.moveTo(.2*s,-.16*s);c.lineTo(.1*s,-.06*s);c.lineTo(.17*s,.02*s);c.moveTo(-.2*s,.16*s);c.lineTo(-.1*s,.24*s)}
  if(st==2){c.moveTo(-.22*s,-.2*s);c.lineTo(-.12*s,-.12*s);c.lineTo(-.2*s,0);c.lineTo(-.1*s,.08*s);
    c.moveTo(.06*s,.14*s);c.lineTo(.14*s,.24*s);c.lineTo(.06*s,.32*s);c.moveTo(0,-.3*s);c.lineTo(.04*s,-.2*s)}
  c.stroke();
  if(st==2){c.save();c.rotate(-.5);c.fillStyle='#f2e6cf';c.fillRect(-.02*s,-.34*s,.2*s,.07*s);
    c.fillStyle='#d9c7a3';c.fillRect(.05*s,-.34*s,.06*s,.07*s);c.restore()}
  const ey=-.04*s;
  circ(c,-.1*s,ey,.065*s,'#fff');circ(c,.1*s,ey,.065*s,'#fff');
  circ(c,-.1*s,ey+(st?.015*s:0),.03*s,'#2b1a0c');
  if(st==2){c.strokeStyle='#2b1a0c';c.lineWidth=.025*s;c.beginPath();c.moveTo(.06*s,ey-.04*s);c.lineTo(.14*s,ey+.04*s);
    c.moveTo(.14*s,ey-.04*s);c.lineTo(.06*s,ey+.04*s);c.stroke();circ(c,-.1*s,ey,.1*s,'#3a235588')}
  else circ(c,.1*s,ey+(st?.015*s:0),.03*s,'#2b1a0c');
  c.strokeStyle='#2b1a0c';c.lineWidth=.025*s;c.beginPath();
  if(st==0)c.arc(0,.1*s,.07*s,.3,2.84);
  else if(st==1){c.moveTo(-.07*s,.15*s);c.lineTo(.07*s,.15*s)}
  else c.arc(0,.2*s,.07*s,3.44,5.98);
  c.stroke();
}
function drawZombie(c,s,z){
  const w=Math.sin(z.wob)*.03*s,dx=portrait?0:-1,dy=portrait?1:0;
  const skin=z.flash>0?'#e8f2dc':'#9db08a';
  c.fillStyle='#3a3f52';c.fillRect(-.13*s,.2*s+w,.1*s,.22*s);c.fillRect(.03*s,.2*s-w,.1*s,.22*s);
  c.fillStyle=z.flash>0?'#a98570':'#6b4a3a';c.fillRect(-.17*s,-.1*s,.34*s,.34*s);
  c.fillStyle='#b5352a';c.fillRect(-.025*s,-.1*s,.05*s,.18*s);
  c.strokeStyle=skin;c.lineWidth=.07*s;c.lineCap='round';c.beginPath();
  c.moveTo(-.15*s,0);c.lineTo(-.15*s+dx*.26*s,dy*.22*s+.03*s+w);
  c.moveTo(.15*s,0);c.lineTo(.15*s+dx*.26*s,dy*.22*s+.03*s-w);c.stroke();
  const hb=z.eating?Math.sin(z.wob*3)*.03*s:0,hy=-.26*s+hb;
  circ(c,0,hy,.17*s,skin);
  circ(c,-.07*s,hy-.02*s,.05*s,'#fff');circ(c,.07*s,hy-.02*s,.04*s,'#fff');
  circ(c,-.07*s,hy-.02*s,.02*s,'#111');circ(c,.07*s,hy-.02*s,.018*s,'#111');
  c.fillStyle='#3b1410';c.fillRect(-.07*s,hy+.07*s,.14*s,(z.eating?.06:.03)*s);
  if(z.hp>200){
    c.fillStyle='#f08a1c';c.beginPath();c.moveTo(-.15*s,hy-.12*s);c.lineTo(.15*s,hy-.12*s);c.lineTo(0,hy-.5*s);c.fill();
    c.fillStyle='#fff';c.beginPath();c.moveTo(-.09*s,hy-.27*s);c.lineTo(.09*s,hy-.27*s);c.lineTo(.06*s,hy-.34*s);c.lineTo(-.06*s,hy-.34*s);c.fill();
    c.fillStyle='#d9730f';c.fillRect(-.19*s,hy-.14*s,.38*s,.045*s);
  }
}
function drawSun(c,x,y,r,t){
  c.save();c.translate(x,y);c.rotate(t);c.fillStyle='#ffb300';
  for(let i=0;i<8;i++){c.rotate(Math.PI/4);c.beginPath();c.moveTo(-.3*r,-.8*r);c.lineTo(.3*r,-.8*r);c.lineTo(0,-1.350*r);c.fill()}
  c.restore();circ(c,x,y,r,'#ffd23c');circ(c,x-.2*r,y-.2*r,.45*r,'#fff3a8');
}

/* ---------- update ---------- */
function update(dt){
  T+=dt;
  for(const k in cds)cds[k]=Math.max(0,cds[k]-dt);
  // sky sun
  if(T>=nextSky){nextSky=T+5;suns.push({u:.5+Math.random()*4,d:1+Math.random()*7,off:-6,life:12})}
  // zombies spawn
  if(spawned<TOTAL&&T>=nextZ){
    const fin=spawned>=TOTAL-8;
    if(fin&&!finalShown){finalShown=true;say('Final wave!')}
    const cone=T>45&&Math.random()<Math.min(.55,.2+(T-45)/150);
    zombies.push({lane:Math.floor(Math.random()*LN),d:L-.1,hp:cone?570:200,wob:Math.random()*6,flash:0,eating:false});
    spawned++;
    nextZ=T+(fin?1.200:Math.max(3,9-T/22));
  }
  // plants
  for(let l=0;l<LN;l++)for(let c=0;c<CO;c++){
    const p=grid[l][c];if(!p)continue;
    p.t-=dt;p.kick=Math.max(0,(p.kick||0)-dt*5);
    if(p.type==='sun'){if(p.t<=0){p.t=9;suns.push({u:l+.5,d:c+.5,off:-.5,life:12})}}
    else if(p.type==='pea'&&p.t<=0&&zombies.some(z=>z.lane===l&&z.d>c+.3&&z.d<L-.2)){p.t=1.400;p.kick=1;peas.push({lane:l,d:c+.85})}
  }
  // peas
  for(const p of peas){
    p.d+=5*dt;
    const z=zombies.find(z=>z.lane===p.lane&&Math.abs(z.d-p.d)<.28);
    if(z){z.hp-=20;z.flash=.1;p.dead=true}else if(p.d>L)p.dead=true;
  }
  peas=peas.filter(p=>!p.dead);
  // zombies
  for(const z of zombies){
    z.flash-=dt;z.wob+=dt*6;
    const c=Math.floor(z.d-.15),p=c>=0&&c<CO?grid[z.lane][c]:null;
    z.eating=!!p;
    if(p){p.hp-=100*dt;if(p.hp<=0)grid[z.lane][c]=null}else z.d-=.22*dt;
    if(z.d<-.15)return end(false);
  }
  const n=zombies.length;zombies=zombies.filter(z=>z.hp>0);killed+=n-zombies.length;
  for(const s of suns){s.off=Math.min(0,s.off+dt*1.800);if(s.off===0)s.life-=dt}
  suns=suns.filter(s=>s.life>0);
  if(killed>=TOTAL)end(true);
}
function end(win){
  run=false;
  $('ot').textContent=win?'Lawn saved!':'They got in';
  $('op').textContent=win?'All 30 zombies stopped.':'A zombie crossed the lawn. You stopped '+killed+' of 30.';
  $('go').textContent='Play again';$('over').hidden=false;
}

/* ---------- draw ---------- */
function draw(){
  g.clearRect(0,0,W,H);
  for(let l=0;l<LN;l++)for(let c=0;c<CO;c++){
    const [x,y]=portrait?[l*C,(L-c-1)*C]:[c*C,l*C];
    g.fillStyle=(l+c)%2?'#4f9a2c':'#5cab33';g.fillRect(x,y,C,C);
    if(sel&&sel!=='shovel'&&!grid[l][c]){g.fillStyle='#ffffff22';g.beginPath();g.arc(x+C/2,y+C/2,C*.1,0,7);g.fill()}
  }
  g.fillStyle='#6d6257';portrait?g.fillRect(0,0,W,.4*C):g.fillRect(CO*C,0,.4*C,H);
  g.fillStyle='#8a4b2a';portrait?g.fillRect(0,H-3,W,3):g.fillRect(0,0,3,H);
  const list=[];
  for(let l=0;l<LN;l++)for(let c=0;c<CO;c++){const p=grid[l][c];if(p){const [x,y]=pos(l+.5,c+.5);
    list.push([y,()=>{g.save();g.translate(x,y);if(p.type!=='nut')g.globalAlpha=.4+.6*Math.max(0,p.hp/300);
      p.type==='sun'?drawSunflower(g,C,T+c):p.type==='nut'?drawNut(g,C,p.hp):drawPea(g,C,T+c,portrait,p.kick);g.restore()}])}}
  for(const z of zombies){const [x,y]=pos(z.lane+.5,z.d);list.push([y+1,()=>{g.save();g.translate(x,y);drawZombie(g,C,z);g.restore()}])}
  list.sort((a,b)=>a[0]-b[0]).forEach(e=>e[1]());
  for(const p of peas){const [x,y]=pos(p.lane+.5,p.d);circ(g,x,y-(portrait?0:.1*C),.09*C,'#9be85a');circ(g,x-.02*C,y-(portrait?.02:.12)*C,.04*C,'#d6ffb0')}
  for(const s of suns){const [x,y]=pos(s.u,s.d);g.globalAlpha=Math.min(1,s.life/2);drawSun(g,x,y+s.off*C,.22*C,T);g.globalAlpha=1}
}
function hud(){
  $('sun').textContent=sun;
  $('pb').style.width=(killed/TOTAL*100)+'%';
  for(const k of ['sun','pea','nut']){const b=$('k-'+k);b.style.setProperty('--cd',cds[k]/CD[k]);
    b.classList.toggle('poor',sun<COST[k]);b.classList.toggle('sel',sel===k)}
  $('shovel').classList.toggle('sel',sel==='shovel');
}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(run)update(dt);
  draw();hud();requestAnimationFrame(frame);
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{
  if(!run)return;e.preventDefault();
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  for(let i=suns.length-1;i>=0;i--){const s=suns[i],[sx,sy]=pos(s.u,s.d);
    if(Math.hypot(x-sx,y-(sy+s.off*C))<.65*C){suns.splice(i,1);sun+=25;return}}
  const u=portrait?x/C:y/C,d=portrait?L-y/C:x/C,l=Math.floor(u),c=Math.floor(d);
  if(l<0||l>=LN||c<0||c>=CO)return;
  if(sel==='shovel'){if(grid[l][c]){grid[l][c]=null;sel=null}return}
  if(!sel){say('Pick a plant first');return}
  if(grid[l][c]){say('That spot is taken');return}
  if(sun<COST[sel]){say('Not enough sun');return}
  if(cds[sel]>0){say('Still recharging');return}
  sun-=COST[sel];cds[sel]=CD[sel];
  grid[l][c]={type:sel,hp:HP[sel],t:sel==='sun'?4:.6};sel=null;say('');
});
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.k;sel=sel===k?null:k;
  if(sel)say(k==='shovel'?'Tap a plant to dig it up':'Tap a lawn square to plant');
}));
$('go').addEventListener('click',()=>{reset();$('over').hidden=true;run=true});

// card icons
[['k-sun',c=>drawSunflower(c,80,0)],['k-pea',c=>drawPea(c,80,0,false,0)],['k-nut',c=>drawNut(c,80,3000)]].forEach(([id,f])=>{
  const c=$(id).querySelector('canvas').getContext('2d');c.translate(44,46);f(c)});

// no zooming: block pinch, double-tap and ctrl+wheel
['gesturestart','gesturechange','gestureend','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
let lastTE=0;document.addEventListener('touchend',e=>{const n=Date.now();
  if(n-lastTE<350){e.preventDefault();e.target.click&&e.target.closest('button')&&e.target.closest('button').click()}lastTE=n},{passive:false});
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
addEventListener('resize',resize);
reset();resize();requestAnimationFrame(frame);
</script>

</body></html>
