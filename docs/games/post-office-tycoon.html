<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',BW=30,BH=46,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid rgba(255,255,255,.75);border-radius:5px;background:rgba(18,16,34,.6);cursor:pointer;opacity:.65;touch-action:none}'
    +'.h svg{display:block;width:18px;height:18px;margin:0 auto;fill:#fff}'
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#191629}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));
    host.style.left=x+'px';host.style.top=y+'px';
    w.classList.toggle('sl',x>W/2);w.classList.toggle('sr',x<=W/2);
    w.classList.toggle('vt',y<110);w.classList.toggle('vb',y>H-110);w.classList.toggle('vm',y>=110&&y<=H-110);
    pos=[x/W,y/H];
  }
  function put(){place(pos[0]*window.innerWidth,pos[1]*window.innerHeight)}
  try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))pos=p}catch(e){}
  put();window.addEventListener('resize',put);
  var drag=null;
  h.addEventListener('pointerdown',function(e){
    var r=host.getBoundingClientRect();
    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  h.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<9)return;
    drag.moved=true;w.classList.remove('open');
    place(drag.ox+dx,drag.oy+dy);
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(e.type==='pointercancel')return;
    if(d.moved){try{localStorage.setItem(KEY,JSON.stringify(pos))}catch(_){}}
    else w.classList.toggle('open');
  }
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('click',function(e){if(e.detail===0)w.classList.toggle('open')});
  root.querySelector('.s').addEventListener('click',function(){w.classList.remove('open')});
  root.querySelector('.x').addEventListener('click',function(){
    try{
      if(window.__maxcade)location.reload();
      else if(history.length>1)history.back();
      else location.href='../';
    }catch(e){location.href='../'}
  });
  ['pointerdown','pointerup','pointermove','mousedown','mouseup','touchstart','touchend','touchmove','click','keydown','keyup'].forEach(function(t){
    host.addEventListener(t,function(e){e.stopPropagation()});
  });
  (document.documentElement||document.body).appendChild(host);
})();
</script>

 let th=-joy.y,st=joy.x;if(K.w||K.arrowup)th=1;if(K.s||K.arrowdown)th=-1;if(K.a||K.arrowleft)st=-1;if(K.d||K.arrowright)st=1;

 const nx=T.x+Math.sin(T.h)*T.v*dt,nz=T.z+Math.cos(T.h)*T.v*dt;
 drive.crashCd-=dt;
 if(truckHit(nx,nz,T.h)){if(Math.abs(T.v)>6&&drive.crashCd<=0){drive.crashes++;drive.crashCd=1;popup(drive.r.fragile?'💥 CRASH! Fragile packages!':'💥 CRASH!','bad');beep(90,0.3,'sawtooth',0.08);}T.v=-T.v*0.3;}
 else{T.x=clamp(nx,VX[0]-12,VX[4]+12);T.z=clamp(nz,HZ[0]-12,HZ[4]+12);}
 dTruck.position.set(T.x,0,T.z);dTruck.rotation.y=T.h;dTruck.userData.wheels.forEach(w=>w.rotation.x+=T.v*dt/0.45);
 drive.since+=dt;
 const s=drive.r.stops[drive.idx];if(s&&Math.hypot(T.x-s.x,T.z-s.z)<4.4)deliverStop();
 const fx=Math.sin(T.h),fz=Math.cos(T.h);
 const cx=T.x-fx*9.5,cz=T.z-fz*9.5;const k=1-Math.pow(0.002,dt);
 camera.position.x+=(cx-camera.position.x)*k;camera.position.z+=(cz-camera.position.z)*k;camera.position.y+=(4.6-camera.position.y)*k;
 camera.lookAt(T.x+fx*5,1.6,T.z+fz*5);
 marker.children[0].scale.setScalar(1+Math.sin(performance.now()/200)*0.08);}

function nearest(arr,v){let b=arr[0];for(const a of arr)if(Math.abs(a-v)<Math.abs(b-v))b=a;return b;}
function routePath(x,z,st){const hz=nearest(HZ,z),vx=nearest(VX,x);const onH=Math.abs(z-hz)<=Math.abs(x-vx);const p=[{x,z}];
 if(onH){if(hz===st.rz){p.push({x:st.x,z:st.z});return p;}let best=VX[0],bd=1e9;for(const v of VX){const d=Math.abs(x-v)+Math.abs(v-st.x);if(d<bd){bd=d;best=v;}}
  p.push({x:best,z:hz},{x:best,z:st.rz},{x:st.x,z:st.z});}
 else{p.push({x:vx,z:st.rz},{x:st.x,z:st.z});}return p;}

let curInter=null;
function pickInter(){const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);let best=null,bs=1e9;
 for(const it of getInter()){const dx=it.x-P.x,dz=it.z-P.z,d=Math.hypot(dx,dz);if(d>it.r)continue;const dot=d>0.01?(dx*fx+dz*fz)/d:1;if(dot<-0.1&&d>1.3)continue;const s=d-dot*1.3;if(s<bs){bs=s;best=it;}}
 return best;}

const SKY=[[420,[255,196,138]],[540,[159,211,255]],[1020,[159,211,255]],[1150,[255,150,100]],[1260,[44,62,110]]];
function updSky(){const m=S.time;let a=SKY[0],b=SKY[SKY.length-1];for(let i=0;i<SKY.length-1;i++)if(m>=SKY[i][0]&&m<=SKY[i+1][0]){a=SKY[i];b=SKY[i+1];break;}
 const t=clamp((m-a[0])/((b[0]-a[0])||1),0,1);skyCol.setRGB(lerp(a[1][0],b[1][0],t)/255,lerp(a[1][1],b[1][1],t)/255,lerp(a[1][2],b[1][2],t)/255);scene.fog.color.copy(skyCol);
 const dark=m>1150?clamp((m-1150)/110,0,1):m<480?clamp((480-m)/60,0,1)*0.4:0;sun.intensity=0.7-dark*0.45;hemi.intensity=0.8-dark*0.35;}
let rushShown=false;
function endDay(){customers.forEach(c=>scene.remove(c.g));customers.length=0;deskObjs.forEach(d=>d.queue.length=0);
 drivers.forEach((d,i)=>{if(d.busy)finishDriver(d,i);});
 const wages=S.clerks*60+S.sorters*50+S.drivers*80,rent=40+(S.expand?40:0)+(S.computer?30:0);S.money-=wages+rent;const st=S.stats;rushShown=false;save();
 openModal('summaryDay',`Day ${S.day} closed`,`<div class="sum">Money earned <b>$${st.earn}</b><br>Customers served <b>${st.served}</b><br>Left angry <b>${st.angry}</b><br>Routes delivered <b>${st.routes}</b><br>Staff wages <b>−$${wages}</b><br>Rent &amp; bills <b>−$${rent}</b><br>Popularity <b>${TIER[tier()]}</b><br>Cash now <b>$${S.money.toLocaleString()}</b></div><button class="buy wide" data-a="nextday">Start Day ${S.day+1}</button>`);}

// ================= HUD =================
let hudT=0;
function updHud(force){hudT-=1;if(hudT>0&&!force)return;hudT=10;updTut();
 $('storeName').textContent=S.name;$('bClose').innerHTML=S.closed?'🔓<small>OPEN</small>':'🔒<small>CLOSE</small>';$('money').textContent='$'+Math.floor(S.money).toLocaleString();
 const rush=S.time>=690&&S.time<810;$('clock').textContent=`Day ${S.day} · ${fmtTime(S.time)}${rush?' 🔥':''}`;
 $('popfill').style.width=S.pop+'%';$('popTxt').textContent=`Popularity: ${TIER[tier()]}${rush?' · Lunch rush!':''}`;
 $('routeBadge').textContent=S.computer?(S.deliveriesOn?`🚚 ${requests.length} route request${requests.length===1?'':'s'}${busyDrivers()?` · ${busyDrivers()} out`:''}`:'🚚 Deliveries OFF'):'';
 if(mode==='walk'){curInter=pickInter();const a=$('act');if(curInter){a.innerHTML=curInter.lab();a.classList.toggle('off',!curInter.ok());}else{a.innerHTML='—';a.classList.add('off');}$('hint').textContent=$('tut').hidden?hintText():'';}
 else if(drive){const r=drive.r;$('dTop').innerHTML=`<b>${r.name}</b><br>Stop ${Math.min(drive.idx+1,r.stops.length)} of ${r.stops.length} · Crashes ${drive.crashes}${r.fragile?`<br><span class="frag">FRAGILE: ${drive.crashes>=2?'no tips now':'2 crashes = no tips'}</span>`:''}`;
  $('speed').innerHTML=`${Math.round(Math.abs(T.v)*2.237)}<small>MPH</small>`;}}
function hintText(){
 if(P.carry>=0)return `Take the ${BIN_NAMES[P.carry]} package to the ${BIN_NAMES[P.carry]} bin`;
 if(S.served<3&&S.day===1)return 'Walk up to the front desk and tap SERVE when a customer is waiting';
 if(S.pile.length>=5&&S.sorters===0)return 'Packages are piling up! Grab one from OUTGOING and sort it';
 if(S.rack&&ITEMS.every(it=>S.board[it.id]===0))return ITEMS.some(it=>S.stock[it.id]>0)?'Restock the pin board':'Buy supplies in Shop → Supplies';
 if(S.computer&&!S.deliveriesOn)return 'Turn deliveries ON at the Delivery Computer';
 if(S.money>=8000&&!S.computer)return 'You can afford the Delivery Computer! (Shop → Delivery)';
 return '';}

// ================= TUTORIAL =================
let tutMoved=0,tutServedBase=0,tutSorted=false,tutShop=false,tutArrowY=3;
const tutArrow=new THREE.Mesh(new THREE.ConeGeometry(0.32,0.7,10),new THREE.MeshBasicMaterial({color:GOLD}));tutArrow.rotation.x=Math.PI;tutArrow.visible=false;scene.add(tutArrow);
const deskTarget=()=>({x:deskObjs[0].x,z:DESK_Z,y:2.9});
const TUT=[
 {t:'Welcome to your post office! Drag the left side of the screen to walk (WASD on computer). Drag the right side to look around.',done:()=>tutMoved>3},
 {t:'Walk up to DESK 1. Follow the gold arrow.',target:deskTarget,done:()=>Math.hypot(P.x-deskObjs[0].x,P.z-DESK_Z)<2.7},
 {t:'A customer is coming in! When they reach the desk, tap the gold SERVE button.',target:deskTarget,done:()=>S.served>tutServedBase},
 {t:'You got paid! Their package went to the OUTGOING table in the back. Walk over and tap PICK UP.',target:()=>({x:PILE.x,z:PILE.z,y:2.9}),done:()=>P.carry>=0},
 {t:()=>{const c=BIN_NAMES[Math.max(0,P.carry)];return `Check the sticker on top of the package. It's ${c}, so SORT it into the ${c} bin.`;},target:()=>P.carry>=0?{x:BIN_X[P.carry],z:BIN_Z,y:2.6}:null,done:()=>tutSorted},
 {t:'Nice sorting! Now tap SHOP in the top right. That is where you buy desks, workers and upgrades.',done:()=>tutShop},
 {t:'Happy customers raise your popularity, which brings in more customers. Angry ones lower it. Every day ends with rent and bills, so watch your cash. Save up $8,000 for the Delivery Computer to unlock delivery routes. The game autosaves, and you can save any time from MENU.',btn:'Got it, let\'s go!'},
];
const compTarget=()=>({x:COMP.x,z:COMP.z,y:2.9});
const TUT2=[null,
 {t:'Your Delivery Computer is in the back of the store. Walk over and open it.',target:compTarget,done:()=>modalKind==='computer'},
 {t:'At the Delivery Computer, turn Deliveries ON, then press DO IT on a route.',target:compTarget,done:()=>mode==='drive'},
 {t:'You are in the truck! Left side drives and steers (WASD on computer). Follow the gold line on the map and drive into the gold ring.',done:()=>!!(drive&&drive.idx>=1)},
 {t:'Delivered! Finish every stop to complete the route. Later, hire Delivery Drivers to run routes for you. Each driver needs their own truck.',btn:'Got it'},
];
function curTut(){if(S.tut<TUT.length)return {list:TUT,i:S.tut,part:1};if(S.tut2>0&&S.tut2<TUT2.length)return {list:TUT2,i:S.tut2,part:2};return null;}
function tutAdvance(){const c=curTut();if(!c)return;
 if(c.part===1){S.tut++;if(S.tut===2)tutServedBase=S.served;if(S.tut===4)tutSorted=false;if(S.tut===5)tutShop=false;if(S.tut>=TUT.length){S.tut=99;toast('🎉 Tutorial done! Run your post office.');}}
 else{S.tut2++;if(S.tut2>=TUT2.length)S.tut2=99;}
 beep(1100,0.08,'triangle',0.05);save();updTut();}
function updTut(){const c=curTut(),el=$('tut');
 if(!c||!started){el.hidden=true;tutArrow.visible=false;return;}
 const step=c.list[c.i];if(step.done&&step.done()){tutAdvance();return;}
 if(modalKind){el.hidden=true;tutArrow.visible=false;return;}
 el.hidden=false;
 $('tutStep').textContent=c.part===1?`TUTORIAL ${c.i+1}/${TUT.length}`:`DELIVERIES ${c.i}/${TUT2.length-1}`;
 const txt=typeof step.t==='function'?step.t():step.t;if($('tutTxt').textContent!==txt)$('tutTxt').textContent=txt;
 const btn=$('tutBtn');btn.hidden=!step.btn;if(step.btn)btn.textContent=step.btn;
 const tg=step.target&&step.target();
 if(tg&&mode==='walk'){tutArrow.visible=true;tutArrow.position.x=tg.x;tutArrow.position.z=tg.z;tutArrowY=tg.y||3;}else tutArrow.visible=false;}
$('tutBtn').addEventListener('click',tutAdvance);
$('tutSkip').addEventListener('click',()=>{S.tut=99;S.tut2=99;save();updTut();toast('Tutorial skipped. Replay it any time from MENU.');});

// ================= MAIN LOOP =================
let spawnT=2,saveT=0,clockAcc=0;
function update(dt,t){
 // clock
 const tutCalm=S.tut<5;
 if(S.time<1260){if(!tutCalm)S.time=Math.min(1260,S.time+dt*3.5);}else if(mode==='walk'&&!modalKind){endDay();return;}
 const rush=S.time>=690&&S.time<810;if(rush&&!rushShown){rushShown=true;toast('🍔 Lunch rush! Lots of customers incoming.');}
 updSky();
 // spawn
 if(tutCalm){if((S.tut===1||S.tut===2)&&!customers.some(c=>c.state!=='leave'&&c.state!=='gone'))spawnCustomer();}
 else{spawnT-=dt;if(spawnT<=0){spawnT=lerp(14,3.5,S.pop/100)*(rush?0.5:1)*rnd(0.75,1.25);const cap=6+S.desks*5;if(customers.length<cap&&S.time<1230&&!S.closed)spawnCustomer();}}
 updCustomers(dt,t);
 if(S.closed&&mode==='walk'&&!modalKind&&!customers.length){endDay();return;}
 // clerks
 deskObjs.forEach(d=>{if(!d.clerk)return;const c=d.queue[0];if(c&&c.ready){d.t+=dt;if(d.t>3)d.t=0,serve(d,true);}else d.t=0;animPerson(d.clerk,t,false);});
 // sorters
 if(S.sorters>0&&S.pile.length){sortAcc+=dt;if(sortAcc>2.4/S.sorters){sortAcc=0;sortPkg(S.pile.shift(),true);updPile();}}
 updDeliveries(dt);
 if(P.boost>0)P.boost-=dt;
 if(mode==='walk')updWalk(dt);else updDrive(dt);
 saveT+=dt;if(saveT>10){saveT=0;save();}}
let sortAcc=0;
function updWalk(dt){let mx=joy.x,my=joy.y;if(K.w||K.arrowup)my=-1;if(K.s||K.arrowdown)my=1;if(K.a||K.arrowleft)mx=-1;if(K.d||K.arrowright)mx=1;
 const sp=(P.boost>0?6.6:4.4)*dt;const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
 const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;}
 const dx=(fx*-my+rx*mx)*sp,dz=(fz*-my+rz*mx)*sp,r=0.35;
 if(!hitBox(colliders,P.x+dx,P.z,r))P.x+=dx;if(!hitBox(colliders,P.x,P.z+dz,r))P.z+=dz;
 if(S.tut===0)tutMoved+=Math.hypot(dx,dz);
 P.x=clamp(P.x,-110,80);P.z=clamp(P.z,-80,108);
 const moving=Math.abs(dx)+Math.abs(dz)>0.001;if(moving)P.bob+=dt*10;
 camera.position.set(P.x,1.65+(moving?Math.sin(P.bob)*0.04:0),P.z);camera.rotation.set(P.pitch,P.yaw,0);}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
 const paused=!started||(modalKind&&modalKind!=='computer');
 if(!paused)update(dt,now/1000);
 if(started){updHud();if(mode==='drive'&&drive)drawMini();if(tutArrow.visible)tutArrow.position.y=tutArrowY+Math.sin(now/200)*0.18;}
 renderer.render(scene,camera);}

// ================= START =================
function buildFromState(){drawName();ensureDesks();ensureClerks();ensureSorters();ensureDrivers();ensureComputer();ensureRack();ensureLockers();ensureCoffee();applyExpand();updBins();updPile();refreshParked();}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(t){const m=Math.floor((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
let pendingSlot=1;
function clearWorld(){customers.forEach(c=>scene.remove(c.g));customers.length=0;
 deskObjs.forEach(d=>{scene.remove(d.g);if(d.clerk)scene.remove(d.clerk);});deskObjs.length=0;
 [compG,rackG,lockG,coffeeG].forEach(g=>{if(g)scene.remove(g);});compG=rackG=lockG=coffeeG=null;
 sorterMeshes.forEach(m=>scene.remove(m));sorterMeshes.length=0;drivers.forEach(d=>scene.remove(d.mesh));drivers.length=0;
 dynCols.forEach(c=>{const i=colliders.indexOf(c);if(i>=0)colliders.splice(i,1);});dynCols.length=0;
 divider.visible=true;divCol.off=false;requests=[];P.carry=-1;updCarry();mode='walk';drive=null;dTruck.visible=false;marker.visible=false;recipient.visible=false;
 P.x=0;P.z=5;P.yaw=0;P.pitch=-0.08;rushShown=false;spawnT=2;$('driveHud').hidden=true;$('act').hidden=false;$('topR').hidden=false;}
function toTitle(){if(started)save();started=false;closeModal();clearWorld();$('tut').hidden=true;tutArrow.visible=false;$('hint').textContent='';renderStart();$('start').hidden=false;}
function startGame(n,isNew){clearWorld();slot=n;
 if(isNew){const nm=($('startName').value||'').trim().slice(0,28)||"Max's Post Office";S=fresh();S.name=nm;}
 else{const s=loadState(n);if(!s){renderStart();return;}S=s;}
 tutServedBase=S.served;
 buildFromState();$('start').hidden=true;started=true;save();updHud(true);
 toast(isNew?`📮 Welcome to ${S.name}!`:`📮 Welcome back to ${S.name}!`);beep(880,0.08,'triangle',0.05);}
function renderStart(){let h='<div class="slabel">Save files</div><div class="slots">';
 for(let n=1;n<=SLOTS;n++){const s=readSlot(n);
  if(s&&s.name)h+=`<div class="slot"><button class="slotMain" data-load="${n}"><b>${esc(s.name)}</b><small>Slot ${n} · Day ${s.day} · $${Math.floor(s.money).toLocaleString()}${s.savedAt?' · '+ago(s.savedAt):''}</small></button><button class="slotDel" data-del="${n}" aria-label="Delete save ${n}">🗑️</button></div>`;
  else h+=`<div class="slot"><button class="slotMain emptyS" data-new="${n}"><b>+ New game</b><small>Slot ${n} · empty</small></button></div>`;}
 $('startBody').innerHTML=h+'</div>';}
function showNewForm(n){pendingSlot=n;$('startBody').innerHTML=`<label for="startName">Name your post office (slot ${n})</label><input id="startName" class="nm" maxlength="28" placeholder="Max's Post Office"><button class="big" id="bNew">Open for business</button><button class="big alt" id="bBack">Back</button>`;
 $('bNew').onclick=()=>startGame(pendingSlot,true);$('bBack').onclick=renderStart;
 $('startName').addEventListener('keydown',e=>{if(e.key==='Enter')startGame(pendingSlot,true);});}
$('startBody').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.load)startGame(+t.dataset.load,false);
 else if(t.dataset.new)showNewForm(+t.dataset.new);
 else if(t.dataset.del){if(t.dataset.sure){try{localStorage.removeItem(slotKey(+t.dataset.del));}catch(_){}renderStart();}else{t.dataset.sure='1';t.textContent='Delete?';t.classList.add('sure');}}});
worldReady=true;drawName();renderStart();
camera.position.set(0,1.65,5);camera.rotation.set(-0.08,0,0);
requestAnimationFrame(loop);
</script>

</body></html>
