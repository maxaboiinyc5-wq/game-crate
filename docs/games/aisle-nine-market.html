<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',BW=30,BH=46,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid rgba(255,255,255,.75);border-radius:5px;background:rgba(18,16,34,.6);cursor:pointer;opacity:.65;touch-action:none}'
    +'.h svg{display:block;width:18px;height:18px;margin:0 auto;fill:#fff}'
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#191629}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));
    host.style.left=x+'px';host.style.top=y+'px';
    w.classList.toggle('sl',x>W/2);w.classList.toggle('sr',x<=W/2);
    w.classList.toggle('vt',y<110);w.classList.toggle('vb',y>H-110);w.classList.toggle('vm',y>=110&&y<=H-110);
    pos=[x/W,y/H];
  }
  function put(){place(pos[0]*window.innerWidth,pos[1]*window.innerHeight)}
  try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))pos=p}catch(e){}
  put();window.addEventListener('resize',put);
  var drag=null;
  h.addEventListener('pointerdown',function(e){
    var r=host.getBoundingClientRect();
    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  h.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<9)return;
    drag.moved=true;w.classList.remove('open');
    place(drag.ox+dx,drag.oy+dy);
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(e.type==='pointercancel')return;
    if(d.moved){try{localStorage.setItem(KEY,JSON.stringify(pos))}catch(_){}}
    else w.classList.toggle('open');
  }
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('click',function(e){if(e.detail===0)w.classList.toggle('open')});
  root.querySelector('.s').addEventListener('click',function(){w.classList.remove('open')});
  root.querySelector('.x').addEventListener('click',function(){
    try{
      if(window.__maxcade)location.reload();
      else if(history.length>1)history.back();
      else location.href='../';
    }catch(e){location.href='../'}
  });
  ['pointerdown','pointerup','pointermove','mousedown','mouseup','touchstart','touchend','touchmove','click','keydown','keyup'].forEach(function(t){
    host.addEventListener(t,function(e){e.stopPropagation()});
  });
  (document.documentElement||document.body).appendChild(host);
})();
</script>

<style>
/* Layout: full-bleed 3D view; shelf-label HUD pinned to the edges; manager phone and register slide up as paper sheets. Single committed look. */
:root{
  --ink:#1b2333; --tag:#ffd23f; --paper:#fff8e8; --sale:#e63946; --leaf:#1f9d63; --line:#dccfae; --mute:#6a6f7d;

#game{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

#top>*{pointer-events:auto}
.tag{font-family:var(--display);font-size:18px;background:var(--tag);color:var(--ink);padding:6px 12px 6px 22px;border-radius:4px;position:relative;font-variant-numeric:tabular-nums;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}

#phone{height:min(88%,660px)}

.sw{width:22px;height:22px;border-radius:3px;flex:none;border:2px solid var(--ink)}

.hi{color:var(--sale)}.lo{color:var(--leaf)}
#storeName{width:100%;min-height:44px;font:700 16px var(--body);padding:0 10px;border:2px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink)}
.sws{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.sws button{width:44px;height:44px;border-radius:4px;border:3px solid var(--line)}
.sws button.on{border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:8px 0}
.tile{min-height:60px;border:2px solid var(--ink);border-radius:4px;background:#fff;font-weight:700;font-size:13px;padding:6px;text-align:left}
.tile small{display:block;color:var(--mute);font-weight:500}
.tile.done{background:var(--line);border-color:var(--line);color:var(--mute);text-decoration:line-through}
.dens{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 0}
.dens button{min-height:46px;border:0;border-radius:4px;background:var(--leaf);color:var(--paper);font-weight:700;font-size:15px}
.big{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

#day{position:absolute;inset:0;background:rgba(27,35,51,.7);display:flex;align-items:center;justify-content:center;padding:16px}

p.note{color:var(--mute);font-size:13px;margin:6px 0}

    if(tgt.k==='box'){const i=S.boxes.indexOf(tgt.b);if(i<0)break;S.carry=S.boxes.splice(i,1)[0];syncBoxes();snd(380,.06,'sine',.08);}
    else if(tgt.k==='tier'&&S.carry){const t=tgt.t,k=Math.min(CAP-t.n,S.carry.n);t.p=S.carry.p;t.n+=k;S.carry.n-=k;if(S.carry.n<=0){S.carry=null;toast('Box empty');}refreshShelves();syncCarry();snd(700,.05,'triangle',.08);}
    else if(tgt.k==='no'&&S.carry){toast(PM[S.carry.p].cold?PM[S.carry.p].n+' has to go in a fridge':PM[S.carry.p].n+' goes on a regular shelf');snd(140,.15,'sawtooth');}
    else if(tgt.k==='price'){tab='price';phoneOpen=true;$('phone').hidden=false;renderPhone();}
    else if(tgt.k==='reg'){reg=true;cur=null;$('pos').hidden=false;renderPOS();}
    else if(tgt.k==='hoop'){hoop.on=true;hoop.v=0;hoop.dir=1;$('meter').hidden=false;}
    break;
  case 'drop':if(S.carry){const b=S.carry;b.x=cam.position.x-Math.sin(yaw)*1.1;b.z=cam.position.z-Math.cos(yaw)*1.1;S.boxes.push(b);S.carry=null;syncBoxes();snd(240,.06,'sine',.08);}break;
  case 'leave':reg=false;cur=null;$('pos').hidden=true;break;
  case 'scan':if(cur&&!cur.done[d.i]){cur.done[d.i]=true;const l=cur.c.cart[d.i];cur.sum+=l.q*l.pr;snd(1400,.05);if(cur.done.every(Boolean))cur.phase='pay';renderPOS();}break;
  case 'card':if(cur){snd(900,.1,'sine');finishServe();}break;
  case 'den':if(cur){cur.out+=+d.v;cur.hist.push(+d.v);snd(600,.04,'triangle');renderPOS();}break;
  case 'back':if(cur&&cur.hist&&cur.hist.length){cur.out-=cur.hist.pop();snd(420,.04,'triangle');renderPOS();}break;
  case 'give':if(cur&&cur.out===cur.due)finishServe();break;
  case 'open':
    if(!S.open&&S.time<DAY1&&!S.closing){S.open=true;toast(S.name+' is open');snd(660,.15,'triangle',.08);}
    else if(S.open&&!S.closing){S.closing=true;toast('Closing after the last customer');}
    break;
  case 'phone':phoneOpen=!phoneOpen;$('phone').hidden=!phoneOpen;resetArm=false;if(phoneOpen)renderPhone();break;
  case 'tab':tab=d.t;resetArm=false;renderPhone();break;
  case 'c+':cart[d.p]=(cart[d.p]||0)+1;renderPhone();break;
  case 'c-':cart[d.p]=Math.max(0,(cart[d.p]||0)-1);renderPhone();break;
  case 'order':{const tot=cartCost();if(!tot)break;if(!spend(tot))break;for(const k in cart)if(cart[k])deliver(k,cart[k]);cart={};syncBoxes();toast('Delivered to the yellow pad out front');renderPhone();break;}
  case 'shelf':{const f=d.f==='1';if(!freeSpot()){toast('No floor space left. Expand the store');break;}if(!spend(f?fridgeCost():shelfCost()))break;addShelf(f);buildStore();toast(f?'New fridge installed':'New shelf installed');renderPhone();break;}
  case 'p+':S.price[d.p]+=10;renderPhone();break;
  case 'p-':S.price[d.p]=Math.max(10,S.price[d.p]-10);renderPhone();break;
  case 'pm':S.price[d.p]=S.mkt[d.p];renderPhone();break;
  case 'hire':if(S.lvl>=STAFF[d.s].lvl&&spend(STAFF[d.s].hire)){S.staff[d.s]=true;toast(STAFF[d.s].n+' hired');renderPhone();}break;
  case 'fire':S.staff[d.s]=false;renderPhone();break;
  case 'lic':{const i=+d.i,L=LIC[i];if(S.lvl>=L.lvl&&!S.lic[i]&&spend(L.cost)){S.lic[i]=true;toast(L.n+' unlocked');renderPhone();}break;}
  case 'expand':{const E=EXP[S.expand];if(E&&S.lvl>=E.lvl&&spend(E.cost)){S.expand++;buildStore();toast('Store expanded');renderPhone();}break;}
  case 'wall':S.wall=+d.i;buildStore();renderPhone();break;
  case 'sound':S.sound=!S.sound;renderPhone();break;
  case 'reset':if(!resetArm){resetArm=true;renderPhone();}else{try{localStorage.removeItem('aisle9b');}catch(e){}custs.forEach(c=>scene.remove(c.m));custs.length=0;Q.length=0;load();buildStore();syncBoxes();cam.position.set(1.2,1.72,12.6);resetArm=false;renderPhone();toast('Fresh start');}break;
  case 'next':{S.money-=wages();S.day++;S.time=DAY0;S.open=false;S.closing=false;S.hoops=0;S.stats={rev:0,spent:0,cust:0,lost:0,tips:0};P.forEach(p=>{S.mkt[p.id]=Math.round(p.m*(.9+rnd(.2)));});$('day').hidden=true;dayShown=false;toast('Day '+S.day+'. Standard prices moved');save();break;}
  }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)act(b.dataset.a,b.dataset);});
document.addEventListener('change',e=>{if(e.target.id==='storeName'){S.name=e.target.value.trim().slice(0,18)||'Aisle Nine';drawSign();save();}});
const cartCost=()=>Object.keys(cart).reduce((a,k)=>a+cart[k]*PM[k].c*PM[k].box,0);
const shelfCost=()=>15000+4000*S.shelves.filter(x=>!x.f).length,fridgeCost=()=>25000+6000*S.shelves.filter(x=>x.f).length;
const wages=()=>(S.staff.cashier?STAFF.cashier.wage:0)+(S.staff.stocker?STAFF.stocker.wage:0);

/* ---------- phone ---------- */
function renderPhone(){
  $('tabs').innerHTML=[['order','Order'],['price','Prices'],['staff','Staff'],['grow','Grow'],['store','Store']].map(t=>'<button data-a="tab" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('');
  const un=P.filter(p=>S.lic[p.lic]);let h='';
  if(tab==='order'){
    h='<h3>Stock by the box</h3>'+un.map(p=>'<div class="row"><i class="sw" style="background:'+hex(p.col)+'"></i><div class="g"><b>'+p.n+'</b><small>Box of '+p.box+' · '+fmt(p.c*p.box)+(p.cold?' · fridge':'')+'</small></div><button class="st" data-a="c-" data-p="'+p.id+'" aria-label="Fewer '+p.n+'">−</button><span class="q">'+(cart[p.id]||0)+'</span><button class="st" data-a="c+" data-p="'+p.id+'" aria-label="More '+p.n+'">+</button></div>').join('')+
      '<div class="foot"><span>Order total '+fmt(cartCost())+'</span><button class="go" data-a="order"'+(cartCost()?'':' disabled')+'>Place order</button></div>'+
      '<h3>Fixtures</h3><p class="note">'+S.shelves.length+' of '+spots().length+' floor spots used.</p><div class="row"><div class="g"><b>Shelf unit</b><small>Three tiers for dry goods. You have '+S.shelves.filter(x=>!x.f).length+'</small></div><button class="buy" data-a="shelf" data-f="0">'+fmt(shelfCost())+'</button></div><div class="row"><div class="g"><b>Fridge</b><small>Three tiers for chilled and frozen food. You have '+S.shelves.filter(x=>x.f).length+'</small></div><button class="buy" data-a="shelf" data-f="1">'+fmt(fridgeCost())+'</button></div>';
  }else if(tab==='price'){
    h='<p class="note">Set your own price for each item. Go under the standard price and more shoppers come in and buy more of it. Go over and they start walking away. Standard prices shift a little every morning.</p>'+un.map(p=>{const r=S.price[p.id]/S.mkt[p.id];return '<div class="row"><i class="sw" style="background:'+hex(p.col)+'"></i><div class="g"><b>'+p.n+'</b><small>Standard '+fmt(S.mkt[p.id])+' · costs you '+fmt(p.c)+'</small><small class="'+(r>1.08?'hi':r<.96?'lo':'')+'">'+(r<=.8?'Flying off the shelf':r<.96?'Popular':r<=1.08?'Normal demand':r<=1.2?'Slow seller':'Too pricey for most')+'</small></div><button class="st" data-a="p-" data-p="'+p.id+'" aria-label="Lower price">−</button><span class="q '+(r>1.12?'hi':r<.95?'lo':'')+'">'+fmt(S.price[p.id])+'</span><button class="st" data-a="p+" data-p="'+p.id+'" aria-label="Raise price">+</button></div>';}).join('');
  }else if(tab==='staff'){
    h=Object.keys(STAFF).map(k=>{const s=STAFF[k],on=S.staff[k];return '<div class="row"><div class="g"><b>'+s.n+(on?' · on the team':'')+'</b><small>'+s.d+'. '+fmt(s.wage)+' a day'+(S.lvl<s.lvl?' · needs level '+s.lvl:'')+'</small></div>'+(on?'<button class="buy" data-a="fire" data-s="'+k+'">Let go</button>':'<button class="buy" data-a="hire" data-s="'+k+'"'+(S.lvl<s.lvl?' disabled':'')+'>Hire '+fmt(s.hire)+'</button>')+'</div>';}).join('')+'<p class="note">Wages come out when you start the next day.</p>';
  }else if(tab==='grow'){
    h='<h3>Product licenses</h3>'+LIC.map((L,i)=>'<div class="row"><div class="g"><b>'+L.n+'</b><small>'+P.filter(p=>p.lic===i).map(p=>p.n).join(', ')+'</small></div>'+(S.lic[i]?'<span class="q lo">Owned</span>':'<button class="buy" data-a="lic" data-i="'+i+'"'+(S.lvl<L.lvl?' disabled':'')+'>'+(S.lvl<L.lvl?'Level '+L.lvl:fmt(L.cost))+'</button>')+'</div>').join('');
    const E=EXP[S.expand];h+='<h3>Floor space</h3><div class="row"><div class="g"><b>'+(E?'Knock out the west wall':'Store is full size')+'</b><small>'+(E?'Adds room for more shelves and more shoppers':'Nothing left to expand')+'</small></div>'+(E?'<button class="buy" data-a="expand"'+(S.lvl<E.lvl?' disabled':'')+'>'+(S.lvl<E.lvl?'Level '+E.lvl:fmt(E.cost))+'</button>':'')+'</div>';
  }else{
    h='<h3>Store name</h3><input id="storeName" maxlength="18" value="'+S.name.replace(/"/g,'&quot;').replace(/</g,'&lt;')+'" autocomplete="off"><h3>Wall paint</h3><div class="sws">'+WALLS.map((c,i)=>'<button data-a="wall" data-i="'+i+'" class="'+(S.wall===i?'on':'')+'" style="background:'+hex(c)+'" aria-label="Wall colour '+(i+1)+'"></button>').join('')+'</div>'+
      '<h3>Today</h3><div class="sum"><span>Shopper rating</span><span>'+Math.round(S.rating)+' / 100</span></div><div class="sum"><span>Sales</span><span>'+fmt(S.stats.rev)+'</span></div><div class="sum"><span>Customers served</span><span>'+S.stats.cust+'</span></div>'+
      '<div class="row"><div class="g"><b>Sound</b></div><button class="buy" data-a="sound">'+(S.sound?'On':'Off')+'</button></div>'+
      '<div class="row"><div class="g"><b>Start over</b><small>Erases this store. Progress saves on this device by itself.</small></div><button class="buy" data-a="reset">'+(resetArm?'Tap again to erase':'Reset')+'</button></div>';
  }
  $('pbody').innerHTML=h;}

/* ---------- day ---------- */
let dayShown=false;
function endDay(){dayShown=true;S.open=false;reg=false;cur=null;$('pos').hidden=true;hoop.on=false;$('meter').hidden=true;const st=S.stats,w=wages(),net=st.rev+st.tips-st.spent-w;
  $('daybody').innerHTML='<h2>Day '+S.day+' closed</h2><div class="sum"><span>Sales</span><span>'+fmt(st.rev)+'</span></div><div class="sum"><span>Tips</span><span>'+fmt(st.tips)+'</span></div><div class="sum"><span>Stock and upgrades</span><span>'+fmt(-st.spent)+'</span></div><div class="sum"><span>Wages</span><span>'+fmt(-w)+'</span></div><div class="sum"><span>Customers served</span><span>'+st.cust+'</span></div><div class="sum"><span>Left empty-handed</span><span>'+st.lost+'</span></div><div class="sum"><span>Shopper rating</span><span>'+Math.round(S.rating)+' / 100</span></div><div class="sum t"><span>Day result</span><span class="'+(net<0?'hi':'lo')+'">'+fmt(net)+'</span></div><div class="foot"><span></span><button class="go" data-a="next">Start day '+(S.day+1)+'</button></div>';
  $('day').hidden=false;save();}

/* ---------- hud ---------- */
let hudT=0,lastLabel=null;const DAYC=new THREE.Color(0x9fd3f0),DUSK=new THREE.Color(0xf0a868);
function hud(){
  $('money').textContent=fmt(S.money);$('lvl').textContent='Lv '+S.lvl;$('xp').style.width=Math.min(100,S.xp/xpNeed(S.lvl)*100)+'%';
  const t=Math.min(S.time,DAY1),hh=(t/60)|0,mm=((t%60)/10|0)*10;$('clock').textContent='Day '+S.day+' · '+hh+':'+String(mm).padStart(2,'0');
  const ob=$('openBtn'),closing=S.closing||S.time>=DAY1;ob.textContent=closing?'Closing':S.open?'Close early':'Open store';ob.disabled=closing;ob.className='btn'+(S.open&&!closing?' shut':'');
  const stocked=S.shelves.some(s=>s.t.some(t=>t.n>0));let h='';
  if(!$('day').hidden||phoneOpen||reg)h='';
  else if(S.carry)h=PM[S.carry.p].cold?'Chilled item. Aim at a fridge tier and tap Stock':'Aim at a shelf tier and tap Stock';
  else if(!stocked&&S.boxes.length)h='Grab a delivery box from the yellow pad';
  else if(!stocked)h='Shelves are empty. Tap Manage to order stock';
  else if(!S.open&&!closing)h='Shelves stocked. Tap Open store';
  else if(Q.length&&!S.staff.cashier)h=Q.length+' waiting at the register. Stand behind the counter';
  $('hint').textContent=h;
  const k=Math.max(0,Math.min(1,(S.time-1020)/240));scene.background.copy(DAYC).lerp(DUSK,k);scene.fog.color.copy(scene.background);hemi.intensity=.42-.14*k;
}
function updTarget(){tgt=findTarget();const lab=hoop.on?'Release!':tgt?tgt.label:null;
  if(lab!==lastLabel){lastLabel=lab;$('actBtn').hidden=!lab;if(lab)$('actBtn').textContent=lab;}
  if(tgt&&!hoop.on){hl.visible=true;hl.position.set(tgt.h[0],tgt.h[1],tgt.h[2]);hl.scale.set(tgt.h[3],tgt.h[4],tgt.h[5]);}else hl.visible=false;}

/* ---------- loop ---------- */
const v3=new THREE.Vector3();let saveT=0;
function sim(dt){
  if(S.open&&S.time<DAY1)S.time+=dt*2.6;
  movePlayer(dt);cam.rotation.set(pitch,yaw,0);
  updCust(dt);updStaff(dt);
  for(const c of cars){c.x+=c.dir*c.sp*dt;if(c.x>120)c.x=-120;if(c.x<-120)c.x=120;c.m.position.set(c.x,.1,c.z);c.m.rotation.y=c.dir>0?0:Math.PI;}
  if(hoop.on){hoop.v+=hoop.dir*dt*1.5;if(hoop.v>1){hoop.v=1;hoop.dir=-1;}if(hoop.v<0){hoop.v=0;hoop.dir=1;}$('mk').style.left=(hoop.v*100)+'%';if(!tgt||tgt.k!=='hoop'){hoop.on=false;$('meter').hidden=true;}}
  if(shot){shot.t+=dt/1.0;const t=Math.min(1,shot.t);ball.position.lerpVectors(shot.a,shot.b,t);ball.position.y+=Math.sin(t*Math.PI)*2.4;
    if(shot.t>=1&&!shot.d){shot.d=1;const o={m:ball,y:.6};if(shot.ok){if(S.hoops<10){S.money+=300;say(o,'Swish! +$3.00','good');}else say(o,'Swish!','good');S.hoops++;snd(990,.2,'triangle',.08);}else say(o,'Off the rim','bad');}
    if(shot.t>1.5){ball.visible=false;shot=null;}
  }
  if((S.closing||S.time>=DAY1)&&!dayShown&&custs.every(c=>c.state==='leave'))endDay();
  if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').hidden=true;}
  hudT-=dt;if(hudT<=0){hudT=.2;hud();checkFound();}
  saveT+=dt;if(saveT>6){saveT=0;save();}
}
function labels(dt){const w=$('game').clientWidth,h=$('game').clientHeight;
  for(let i=says.length-1;i>=0;i--){const s=says[i];s.t-=dt;if(s.t<=0){s.el.remove();says.splice(i,1);continue;}
    v3.copy(s.o.m.position);v3.y+=s.y+(2.4-s.t)*.15;v3.project(cam);if(v3.z>1||v3.z<-1){s.el.style.display='none';continue;}
    s.el.style.display='';s.el.style.left=((v3.x*.5+.5)*w)+'px';s.el.style.top=((-v3.y*.5+.5)*h)+'px';s.el.style.opacity=Math.min(1,s.t*2);}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;sim(dt);updTarget();R.render(scene,cam);labels(dt);requestAnimationFrame(frame);}
buildStore();syncBoxes();resize();hud();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawSign);
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
try{window.__mxNoHot&&window.__mxNoHot.hot&&window.__mxNoHot.hot.snapshot&&window.__mxNoHot.hot.snapshot(()=>{save();return {};});}catch(e){}
requestAnimationFrame(frame);
</script>
