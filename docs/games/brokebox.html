    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#ffc94d;animation:none}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'

    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'

<title>Brokebox 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&family=Russo+One&family=Audiowide&family=Fredoka:wght@500;700&family=Pixelify+Sans:wght@500;700&family=Lilita+One&family=Bungee&family=Teko:wght@500;700&display=swap">
<!--THREE--><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><!--/THREE-->
<style>
/* Layout: a console dashboard. Boot screen, then a home with a shelf of game tiles over full-bleed
   key art from the selected game. Games run full screen with touch controls only on touch devices. */
:root{
  color-scheme:dark;
  --ink:#05060d;      /* screen black */
  --night:#0b0f22;    /* panel base */
  --glass:rgba(14,18,40,.62);
  --hi:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.16);
  --text:#f3f5ff;
  --mute:#a3abcd;
  --dim:#6d7599;
  --acc:#5aa8ff;      /* set per selected game */
  --acc2:#8f6bff;
  --bronze:#d68f5a;--silver:#cdd6e8;--gold:#ffcf4d;--plat:#a6ecff;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --ui:'Manrope','Segoe UI',system-ui,sans-serif;
  --g1:#5aa8ff;--g2:#8f6bff;--gfont:var(--display);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus{outline:none}
:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.screen{position:fixed;inset:0}

/* ---------- boot ---------- */
#boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(ellipse at 50% 60%,#121838 0%,var(--ink) 62%);cursor:pointer}
.mark{display:flex;align-items:center;gap:.16em;font-family:var(--display);font-weight:900;font-size:clamp(34px,8.4vw,92px);letter-spacing:.02em;line-height:1}
.mark .w{display:inline-flex;overflow:hidden}
.mark .w i{font-style:normal;display:inline-block;transform:translateY(110%);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.mark .five{display:grid;place-items:center;width:1.18em;height:1.18em;border-radius:50%;background:conic-gradient(from 200deg,#ff5f45,#ffcf4d,#3fe0b0,#5aa8ff,#8f6bff,#ff5f45);color:#05060d;font-size:.82em;transform:scale(0) rotate(-90deg);animation:pop .7s 1s cubic-bezier(.3,1.6,.4,1) forwards}
.sweep{position:relative}
.sweep::after{content:"";position:absolute;inset:-10% -20%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 1.4s 1.3s ease-in-out forwards;mix-blend-mode:overlay;pointer-events:none}
@keyframes rise{to{transform:none}}
@keyframes pop{to{transform:none}}
@keyframes sweep{to{transform:translateX(120%)}}
.press{font-weight:700;letter-spacing:.24em;text-transform:uppercase;font-size:13px;color:var(--mute);opacity:0;animation:fadein .6s 1.8s forwards,breathe 2.4s 2.4s ease-in-out infinite}
@keyframes fadein{to{opacity:1}}
@keyframes breathe{50%{opacity:.35}}
.bootbar{width:min(220px,50vw);height:3px;border-radius:2px;background:var(--hi);overflow:hidden}
.bootbar i{display:block;height:100%;width:0;background:var(--text);transition:width .25s}

/* ---------- home ---------- */
#home{overflow:hidden;background:var(--ink)}
.bg{position:absolute;inset:0;overflow:hidden}
.bgimg{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity .7s;animation:drift 28s ease-in-out infinite alternate}
.bgimg.on{opacity:1}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.1) translate(-1.5%,1%)}}
.bgshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,13,.92) 0%,rgba(5,6,13,.62) 42%,rgba(5,6,13,.15) 75%),linear-gradient(0deg,rgba(5,6,13,.95) 0%,rgba(5,6,13,0) 55%),linear-gradient(180deg,rgba(5,6,13,.7) 0%,rgba(5,6,13,0) 22%)}
.homewrap{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;align-items:center;gap:12px;padding-inline:max(16px,4vw);padding-block:14px 6px;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:nowrap;min-width:0}
.tab{font-weight:800;font-size:15px;color:var(--mute);padding:8px 12px;border-radius:999px;white-space:nowrap}
.tab.on{color:var(--text);background:var(--hi)}
.tab:focus-visible{outline-offset:0}
.sp{flex:1}
.clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--mute);font-size:15px}
.me{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border-radius:999px}
.me:hover{background:var(--hi)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:14px;color:#05060d;flex:none}
.me-t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.me-t b{font-size:14px}
.me-t small{font-size:12px;color:var(--mute);font-weight:700}
main{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-inline:max(16px,4vw);padding-block:8px 28px;scrollbar-width:thin}
.pane[hidden]{display:none}

.shelf{display:flex;gap:14px;overflow-x:auto;overflow-y:visible;padding-block:16px 14px;margin-inline:-14px;padding-inline:14px;scrollbar-width:none;scroll-behavior:smooth}
.shelf::-webkit-scrollbar{display:none}
.tile{position:relative;flex:none;width:clamp(78px,10.5vw,124px);aspect-ratio:1;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,var(--t1),var(--t2));box-shadow:0 8px 24px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;transform-origin:50% 60%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-family:var(--tf);font-size:clamp(11px,1.3vw,14px);line-height:1.05;background:linear-gradient(transparent,rgba(0,0,0,.75));text-shadow:0 1px 2px #000;text-align:left}
.tile.sel{transform:scale(1.14);box-shadow:0 0 0 3px var(--text),0 0 0 7px color-mix(in srgb,var(--acc) 55%,transparent),0 14px 34px rgba(0,0,0,.6)}
.tile:focus-visible{outline:none}
.shelf .gap{flex:none;width:4px}
.hero{display:flex;flex-direction:column;gap:12px;max-width:600px;padding-top:clamp(10px,4vh,46px)}
.genre{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--acc)}
.hlogo{font-family:var(--tf,var(--display));font-weight:400;font-size:clamp(38px,6.6vw,78px);line-height:.98;text-wrap:balance;text-shadow:0 4px 30px rgba(0,0,0,.6);letter-spacing:.01em}
.htag{color:#d6dbf2;font-size:clamp(15px,1.5vw,18px);max-width:46ch;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.play{display:inline-flex;align-items:center;gap:10px;background:var(--text);color:#05060d;font-weight:800;font-size:17px;padding:13px 34px;border-radius:999px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.play svg{width:16px;height:16px}
.play:focus-visible,.ghost:focus-visible,.row-btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.ghost{background:var(--glass);border:1px solid var(--line);font-weight:800;padding:12px 22px;border-radius:999px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.stats{display:flex;gap:10px 24px;flex-wrap:wrap;margin-top:8px;color:var(--mute);font-size:13.5px;font-weight:700}
.stats b{color:var(--text);font-weight:800}
.tbar{display:inline-block;vertical-align:middle;width:70px;height:5px;border-radius:3px;background:var(--hi);margin-left:8px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--acc)}
.hints{display:flex;gap:18px;justify-content:flex-end;padding-inline:max(16px,4vw);padding-block:6px 12px;font-size:12.5px;font-weight:700;color:var(--mute);flex:none}
.hints span{display:inline-flex;align-items:center;gap:6px}
.kb{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--hi);color:var(--text);font-size:11px;font-weight:800}
.kb.pad{border-radius:50%;width:22px;padding:0}
body.touch .hints{display:none}

/* trophies */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:18px}
.prof .av{width:64px;height:64px;font-size:26px}
.prof h2{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:700}
.lvl{display:flex;flex-direction:column;gap:6px;min-width:min(260px,100%)}
.lvlbar{height:8px;border-radius:4px;background:var(--hi);overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tiers{display:flex;gap:16px;font-weight:800;font-variant-numeric:tabular-nums}
.cup{display:inline-block;width:14px;height:14px;border-radius:50% 50% 45% 45%;vertical-align:-2px;margin-right:5px}
.cup.bronze{background:var(--bronze)}.cup.silver{background:var(--silver)}.cup.gold{background:var(--gold)}.cup.plat{background:var(--plat)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;gap:14px;align-items:center;text-align:left;padding:10px;border-radius:16px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tcard:hover{background:rgba(30,36,70,.7)}
.tcard:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tcard .ti{width:58px;height:58px;border-radius:12px;flex:none;background-size:cover;background-position:center}
.tcard .tt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tcard b{font-size:15px}
.tcard small{color:var(--mute);font-weight:700;font-size:12.5px}
.tlist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.thead{display:flex;align-items:center;gap:14px;padding-block:6px 14px;flex-wrap:wrap}
.thead h2{font-family:var(--tf,var(--display));font-weight:400;font-size:28px}
.trow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.trow.lock{opacity:.55}
.trow .tic{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center}
.trow .tic svg{width:22px;height:22px}
.trow .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.trow .tx small{color:var(--mute);font-weight:600}
.trow time{font-size:12px;color:var(--mute);font-weight:700;white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:9px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}

/* settings */
.set{display:flex;flex-direction:column;gap:10px;max-width:720px;padding-top:10px}
.set h3{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:14px 4px 2px}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--glass);border:1px solid var(--line);min-height:58px}
.row label,.row .rl{flex:1;min-width:140px;font-weight:700}
.row small{display:block;color:var(--mute);font-weight:600}
.row input[type=range]{width:min(260px,100%);accent-color:var(--acc)}
.row input[type=range]:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
.row input[type=text]{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:min(240px,100%);-webkit-user-select:text;user-select:text}
.row input[type=text]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.3);flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:999px;font-weight:800;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--text);color:#05060d}
.seg button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{width:38px;height:38px;border-radius:50%}
.avs button.on{box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--text)}
.row-btn{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--hi);border:1px solid var(--line)}
.row-btn.danger{color:#ff8a7a}

/* ---------- loader ---------- */
#loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:var(--ink) center/cover no-repeat;transition:opacity .3s}
#loader::before{content:"";position:absolute;inset:0;background:rgba(5,6,13,.78);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#loader>*{position:relative}
.lname{font-family:var(--tf,var(--display));font-size:clamp(34px,7vw,72px);text-align:center;padding-inline:16px;line-height:1}
.lbar{width:min(260px,60vw);height:4px;border-radius:2px;background:var(--hi);overflow:hidden}
.lbar i{display:block;height:100%;width:30%;background:var(--acc);animation:load 1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}

/* ---------- game ---------- */
#game{background:#000;touch-action:none;overflow:hidden}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gl[hidden]{display:none}
#gui{position:absolute;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#gui>*{pointer-events:auto}
#touch{position:absolute;inset:0;pointer-events:none}
#touch .zone{position:absolute;pointer-events:auto;touch-action:none}
.stick{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.18);pointer-events:none;opacity:.0;transition:opacity .15s}
.stick.on,.stick.rest{opacity:1}
.stick.rest{opacity:.45}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 10px rgba(0,0,0,.4)}

  rumble(s,ms){if(!Store.d.settings.vib)return;try{if(IN.device==='touch'&&navigator.vibrate)navigator.vibrate(ms);const a=IN.gp&&IN.gp.vibrationActuator;if(IN.device==='pad'&&a&&a.playEffect)a.playEffect('dual-rumble',{duration:ms,strongMagnitude:s,weakMagnitude:s*.6}).catch(()=>{})}catch(e){}},
  applyTouch(){const c=this.cur;if(!c)return;TC.layout(IN.device==='touch'&&c.touch?c.touch:null)},
  /* ---------- the game API ---------- */
  api(m,cover,cw,ch){const self=this,hud=$('hud'),hc=hud.getContext('2d');

      music:{play:s=>cover||MU.play(s),stop:()=>cover||MU.stop()},
      save,store(){Store.save()},

  uiShow(o){const g=$('gui');g.innerHTML='';const d=document.createElement('div');d.className='gm '+(o.cls||'')+(o.center?' center':'')+(o.wide?' wide':'');
    let h='';if(o.logo)h+=`<div class="gm-logo">${esc(this.cur.m.name)}</div>`;if(o.title)h+=`<div class="gm-title">${o.title}</div>`;if(o.sub)h+=`<p class="gm-sub">${o.sub}</p>`;if(o.body)h+=`<div class="gm-body">${o.body}</div>`;
    if(o.items&&o.items.length)h+=`<div class="gm-items ${o.grid?'grid':''}">${o.items.map((it,i)=>`<button class="gm-item" data-nav data-i="${i}" ${it.disabled?'disabled':''}><span class="gm-l">${it.label}${it.sub?`<span class="gm-s">${it.sub}</span>`:''}</span>${it.right!=null?`<span class="gm-r">${it.right}</span>`:''}</button>`).join('')}</div>`;
    if(o.foot)h+=`<div class="gm-foot">${o.foot}</div>`;d.innerHTML=h;g.appendChild(d);
    d.querySelectorAll('.gm-item').forEach(b=>{b.onclick=()=>{const it=o.items[+b.dataset.i];if(it.disabled){SFX.err();return}SFX.ok();IN.flush();it.on&&it.on()};b.onmouseenter=()=>{if(IN.device!=='touch')b.focus({preventScroll:true})}});
    this.layers=this.layers.filter(l=>!l.gui);this.pushLayer({el:g,gui:true,game:true,back:o.back?()=>{SFX.back();IN.flush();o.back()}:null},o.focus);
    return d},
  uiHide(){$('gui').innerHTML='';this.layers=this.layers.filter(l=>!l.gui);IN.flush()},
  openQuick(){if(this.state!=='game'||!this.cur||this.cur.paused)return;const c=this.cur;c.paused=true;AU.duck(true);SFX.ok();
    const q=$('quick');const ctl=c.m.controls?c.m.controls[IN.device==='pad'?'pad':IN.device==='touch'?'touch':'keys']:null;
    q.innerHTML=`<div class="qm"><h2>${esc(c.m.name)}</h2><p>Paused</p><button data-nav id="q-res">Resume</button>${c.inst&&c.inst.menu?'<button data-nav id="q-menu">Game menu</button>':''}<button data-nav id="q-fs">Full screen</button><button data-nav id="q-home">Quit to home</button>${ctl?`<div class="ctl">${ctl.map(([a,b])=>`<b>${esc(a)}</b><span>${esc(b)}</span>`).join('')}</div>`:''}</div>`;
    q.hidden=false;this.pushLayer({el:q,game:true,quick:true,back:()=>this.closeQuick()});

    if($('q-menu'))$('q-menu').onclick=()=>{this.closeQuick();c.inst.menu()}},
  closeQuick(silent){const q=$('quick');if(q.hidden)return;q.hidden=true;q.innerHTML='';this.layers=this.layers.filter(l=>!l.quick);if(this.cur){this.cur.paused=false}AU.duck(false);IN.flush();if(!silent)SFX.back();this.refocus()},
  lostFocus(){if(this.state==='game'&&this.cur&&!this.cur.paused&&!$('gui').firstChild&&!(this.cur.inst&&this.cur.inst.noAutoPause))this.openQuick()},
  /* ---------- trophies & toasts ---------- */
  unlock(m,id){const got=Store.d.tro[m.id]=Store.d.tro[m.id]||{};if(got[id])return;const t=trophyList(m).find(x=>x.id===id);if(!t)return;got[id]=Date.now();Store.save();
    this.toast(t.name,TIER[t.tier].name+' trophy · '+t.desc,t.tier);SFX.trophy();this.rumble(.4,80);
    const tl=trophyList(m);if(t.tier!=='plat'&&tl.every(x=>x.tier==='plat'||got[x.id])){const p=tl.find(x=>x.tier==='plat');setTimeout(()=>this.unlock(m,p.id),1800)}},
  toast(title,sub,kind){if($('toasts').children.length>=2){(this._tq=this._tq||[]).push([title,sub,kind]);if(!this._tqT)this._tqT=setInterval(()=>{if($('toasts').children.length<2&&this._tq.length)this.toast(...this._tq.shift());if(!this._tq.length){clearInterval(this._tqT);this._tqT=0}},400);return}
    const d=document.createElement('div');d.className='toast';
    const icon=kind&&TIER[kind]?`<span class="tic" style="background:${TIER[kind].col}">${CUP}</span>`:kind==='av'?`<span class="av" style="width:40px;height:40px;background:${AVS[Store.d.profile.av%AVS.length]}">${esc((Store.d.profile.name||'P').charAt(0).toUpperCase())}</span>`:kind==='pad'?`<span class="tic" style="background:var(--text)">${PADI}</span>`:'';
    d.innerHTML=`${icon}<span><b>${esc(title)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span>`;$('toasts').appendChild(d);

  /* ---------- focus & navigation layers ---------- */
  pushLayer(l,focus){this.layers.push(l);requestAnimationFrame(()=>this.refocus(focus))},
  popLayer(l){this.layers=this.layers.filter(x=>x!==l)},
  vis(el){return el.isConnected&&!el.closest('[hidden]')&&el.getClientRects().length>0},
  top(){for(let i=this.layers.length-1;i>=0;i--){const l=this.layers[i];if(l.el===$('gui')?l.el.firstChild&&this.vis(l.el.firstChild):this.vis(l.el))return l}return null},
  items(l){return [...l.el.querySelectorAll('[data-nav]')].filter(e=>!e.disabled&&this.vis(e))},
  refocus(i){const l=this.top();if(!l)return;if(IN.device==='touch'&&l.el===$('home'))return;const it=this.items(l);if(!it.length)return;

  nav(dir){const l=this.top();if(!l)return false;const it=this.items(l);if(!it.length)return false;let cur=document.activeElement;
    if(!it.includes(cur)){(l.el===$('home')&&this.tab==='games'?$('tile-'+this.games[this.sel].id):it[0]).focus({preventScroll:true});return true}
    if(cur.type==='range'&&(dir==='left'||dir==='right')){cur.value=clamp(+cur.value+(dir==='left'?-1:1)*+cur.step,+cur.min,+cur.max);cur.dispatchEvent(new Event('input'));return true}
    const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
    for(const e of it){if(e===cur)continue;const q=e.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;let main,cross;
      if(dir==='right'){main=q.left-r.right+r.width*.5;cross=Math.abs(y-cy);if(x<=cx+2)continue}
      else if(dir==='left'){main=r.left-q.right+r.width*.5;cross=Math.abs(y-cy);if(x>=cx-2)continue}
      else if(dir==='down'){main=q.top-r.bottom+r.height*.5;cross=Math.abs(x-cx);if(y<=cy+2)continue}
      else{main=r.top-q.bottom+r.height*.5;cross=Math.abs(x-cx);if(y>=cy-2)continue}
      const s=Math.max(0,main)+cross*(dir==='up'||dir==='down'?.6:2.2);if(s<bs){bs=s;best=e}}
    if(best&&best.classList.contains('tile')&&!cur.classList.contains('tile'))best=$('tile-'+this.games[this.sel].id);
    if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest'});SFX.nav();return true}return false},
  key(e){

    const l=this.top();const code=e.code;

    if(this.state==='game'&&!l&&(code==='KeyP'||code==='Tab')){e.preventDefault();this.openQuick();return}
    if(l){const dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'}[code];
      if(dir){e.preventDefault();this.nav(dir);return}
      if(l.el===$('home')&&(code==='KeyQ'||code==='KeyE')){e.preventDefault();const t=['games','trophies','settings'],i=t.indexOf(this.tab);this.showTab(t[(i+(code==='KeyE'?1:2))%3]);return}
      if(code==='Enter'||code==='Space'){const a=document.activeElement;if(!l.el.contains(a)||a===document.body){e.preventDefault();this.refocus();return}if(a.tagName!=='BUTTON'){e.preventDefault();a.click()}else if(code==='Space'){e.preventDefault();a.click()}else{e.preventDefault();a.click()}}

  padNav(dt){const l=this.top();const P=IN.padHits;

    if(this.state==='game'&&(P.has('start')||P.has('home'))){if(l&&l.quick)this.closeQuick();else if(!this.cur.paused)this.openQuick();return}

  /* ---------- main loop ---------- */
  frame(t){requestAnimationFrame(t2=>this.frame(t2));const dt=Math.min(.05,(t-(this.last||t))/1000);this.last=t;

    IN.end()},
  perf(dt){const p=this._pf=this._pf||{ema:16,t:0};p.ema=lerp(p.ema,dt*1000,.05);p.t+=dt;if(p.t<2.5||Store.d.settings.quality!=='auto')return;p.t=0;

};
function hud_clear(){const h=$('hud'),c=h.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,h.width,h.height)}

(()=>{const h=$('hud');const pt=e=>{const r=h.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const send=(type,e)=>{const c=OS.cur;if(OS.state!=='game'||!c||!c.inst||c.paused||!c.inst.pointer)return;const [x,y]=pt(e);c.inst.pointer(type,x,y,e)};

  function stepPlayer(h,inp){
