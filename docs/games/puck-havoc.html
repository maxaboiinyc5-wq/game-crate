<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',PC=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches),BW=PC?52:42,BH=PC?66:58,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid #fff;border-radius:11px;background:#ffb020;cursor:pointer;opacity:1;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5);animation:mxglow 2.4s ease-in-out infinite}'

    +'@media (prefers-reduced-motion:reduce){.h{animation:none}}'

    +(PC?'.h svg{width:26px;height:26px}.ht{display:block;margin-top:2px;font:900 9px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.1em;color:#1a1205}.h{border-radius:12px}.h:hover{background:#ffc94d}':'')
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#ffc94d;animation:none}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));
    host.style.left=x+'px';host.style.top=y+'px';
    w.classList.toggle('sl',x>W/2);w.classList.toggle('sr',x<=W/2);
    w.classList.toggle('vt',y<110);w.classList.toggle('vb',y>H-110);w.classList.toggle('vm',y>=110&&y<=H-110);
    pos=[x/W,y/H];

  function put(){place(pos[0]*window.innerWidth,pos[1]*window.innerHeight)}
  try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))pos=p}catch(e){}

  h.addEventListener('pointerdown',function(e){
    var r=host.getBoundingClientRect();

  root.querySelector('.s').addEventListener('click',function(){w.classList.remove('open')});
  root.querySelector('.x').addEventListener('click',function(){
    try{
      if(window.__maxcade)location.reload();

  });

    host.addEventListener(t,function(e){e.stopPropagation()});
  });

})();

<title>Puck Havoc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed night-rink playfield; scoreboard-style overlays sit on top of the ice. Single look by choice. */
:root{
  --ice:#e9f2f6; --ice-deep:#cfdfe8; --ink:#14202b; --red:#d8323c; --blue:#2a5fb8; --gold:#f2a51d; --board:#101a24;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--board);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100%;max-width:560px;margin:0 auto;background:var(--ice)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(16,26,36,.84);color:var(--ice)}
.ov h1{font-family:var(--display);font-size:clamp(40px,13vw,68px);line-height:.9;margin:0;color:var(--ice);text-wrap:balance;transform:rotate(-3deg)}
.ov h1 span{color:var(--gold);display:block}
.ov h2{font-family:var(--display);font-size:30px;margin:0;color:var(--gold)}
.ov p{font-size:21px;margin:0;max-width:310px;line-height:1.25}
.ov .stat{font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--ice-deep)}
button{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--gold);border:0;border-bottom:5px solid #b87608;padding:12px 30px;border-radius:6px;cursor:pointer}
button:active{transform:translateY(3px);border-bottom-width:2px}
button:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
#cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
#cards button{background:var(--ice);border-bottom-color:var(--blue);text-align:left;padding:10px 16px;font-size:18px}
#cards button small{display:block;font-family:var(--body);font-weight:500;font-size:18px;margin-top:2px}
.ov.end{justify-content:flex-end;padding-bottom:56px;background:linear-gradient(to top,rgba(16,26,36,.94) 0%,rgba(16,26,36,.75) 35%,rgba(16,26,36,0) 70%);cursor:pointer}
.ov.end.fin{justify-content:center;background:rgba(16,26,36,.6);cursor:default}
#endtxt{font-family:var(--display);font-size:clamp(20px,6vw,28px);line-height:1.15;max-width:340px;text-wrap:balance;color:var(--ice)}
#endfinal{display:flex;flex-direction:column;gap:14px;align-items:center}
#endstats{line-height:1.5}
</style>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="title">
    <h1>Puck <span>Havoc</span></h1>
    <p>You're the puck. Pull back anywhere and let go to fly. Hit goons fast and they break. Sit still and they break you.</p>
    <p class="stat">5 arenas · 5 bosses · win the Cup</p>
    <button id="play">Drop the puck</button>
    <div class="stat" id="best"></div>
  </div>
  <div class="ov" id="pick" hidden>
    <h2 id="pickh">Wave cleared</h2>
    <div class="stat" id="pickn">Pick one</div>
    <div id="cards"></div>
  </div>
  <div class="ov" id="over" hidden>
    <h2>Iced</h2>
    <p id="res"></p>
    <button id="again">Go again</button>
  </div>
  <div class="ov end" id="ending" hidden>
    <p id="endtxt"></p>
    <div id="endfinal" hidden>
      <h1>Cup <span>Champion</span></h1>
      <div class="stat" id="endstats"></div>
      <button id="replay">Play again</button>
    </div>
    <div class="stat" id="endskip">Tap to continue</div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('c'),ctx=cv.getContext('2d');
const C={ice:'#e9f2f6',deep:'#cfdfe8',ink:'#14202b',red:'#d8323c',blue:'#2a5fb8',gold:'#f2a51d',teal:'#15907f',purple:'#6b3fa0',white:'#ffffff',pink:'#d6478f',orange:'#e8742a',navy:'#274060',fire:'#ff5a1f'};
const ARENAS=[
 {name:'HOME RINK',floor:'#e9f2f6',edge:'#101a24',fg:'20,32,43',kind:'rink'},
 {name:'FROZEN POND',floor:'#d5e8ee',edge:'#1d3340',fg:'20,32,43',kind:'pond',patch:'snow'},
 {name:'THE GARAGE',floor:'#8f989d',edge:'#1e2124',fg:'20,32,43',kind:'garage',patch:'oil'},
 {name:'BLACKLIGHT',floor:'#170f2b',edge:'#07040e',fg:'233,242,246',kind:'neon',dark:1,moving:1},
 {name:'THE PIT',floor:'#2b1b17',edge:'#0e0605',fg:'255,236,220',kind:'pit',dark:1,patch:'lava'}];
let A=ARENAS[0],deco=[],patches=[];
const fgA=a=>'rgba('+A.fg+','+a+')';
function patchAt(x,y){for(const q of patches)if(Math.hypot(x-q.x,y-q.y)<q.r)return q;return null}
function makeDeco(){deco=[];const n=A.kind==='pond'?9:A.kind==='pit'?12:0;for(let i=0;i<n;i++){let x=Math.random(),y=Math.random();const pts=[[x,y]];for(let k=0;k<4;k++){x+=(Math.random()-.5)*.24;y+=(Math.random()-.5)*.16;pts.push([x,y])}deco.push(pts)}}
const COL={grunt:C.red,mini:C.pink,shooter:C.teal,charger:C.gold,bruiser:C.purple,splitter:C.pink,bomber:C.orange,sniper:C.navy,goalie:C.blue,zamboni:'#4a6572',twinA:'#a01f4b',twinB:'#1f7fa0',ref:'#fafafa',enforcer:'#4b2a7a'};
const T={grunt:{r:14,hp:1,sp:70,v:1},mini:{r:9,hp:1,sp:115,v:1},shooter:{r:14,hp:1,sp:60,v:2},charger:{r:15,hp:2,sp:50,v:3},bruiser:{r:24,hp:4,sp:38,v:4},splitter:{r:18,hp:2,sp:55,v:3},bomber:{r:15,hp:1,sp:88,v:2},sniper:{r:13,hp:1,sp:42,v:3},
 goalie:{r:42,hp:14,sp:30,v:25,b:1},zamboni:{r:38,hp:16,sp:26,v:25,b:1},twinA:{r:27,hp:9,sp:80,v:14,b:1},twinB:{r:27,hp:9,sp:55,v:14,b:1},ref:{r:30,hp:18,sp:45,v:25,b:1},enforcer:{r:40,hp:20,sp:46,v:25,b:1}};
const DASH={charger:{wind:.65,dv:540,dT:.5,rest:2.2,rng:340},zamboni:{wind:.85,dv:600,dT:1,rest:1.8,rng:9999},twinA:{wind:.5,dv:470,dT:.4,rest:1.5,rng:400}};
const BOSSES=[['goalie','THE GOALIE'],['zamboni','ZAMBONI'],['twins','THE TWINS'],['ref','THE REF'],['enforcer','THE ENFORCER']];
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=400,H=700,dpr=1,R={x:12,y:70,w:376,h:616};
function resize(){const b=wrap.getBoundingClientRect();W=b.width||400;H=b.height||700;dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);R={x:12,y:70,w:W-24,h:H-84};}
addEventListener('resize',resize);resize();

let best=0,bestW=0,cups=0;try{best=+localStorage.getItem('puckhavoc-best')||0;bestW=+localStorage.getItem('puckhavoc-wave')||0;cups=+localStorage.getItem('puckhavoc-cups')||0}catch(e){}
function showBest(){$('best').textContent=best?('Best '+best+(bestW?' · wave '+bestW:'')+(cups?' · Cups won '+cups:'')):'5 hearts. No refs. (One ref.)'}
showBest();

/* audio */
let ac=null;
function snd(f,d,type,vol,slide){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(ac.state==='suspended')ac.resume()}

/* state */
let state='title',p,en=[],pending=[],shots=[],parts=[],rings=[],texts=[],skids=[],queue=[],drops=[],bombs=[],bolts=[],bumpers=[];
let wave=0,score=0,combo=0,comboT=0,maxCombo=0,kills=0,shake=0,hs=0,ts=1,aim=null,banner=null,clearT=0,tGlobal=0,picksLeft=0,bossName='',bossMax=0,zoneI=-1,endT=0,endStep=0,endCardT=0,fwT=0,runT=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrapA=a=>{while(a>Math.PI)a-=6.2832;while(a<-Math.PI)a+=6.2832;return a};
function newPlayer(){return{x:R.x+R.w/2,y:R.y+R.h*.7,vx:0,vy:0,r:15,hp:5,max:5,ch:3,maxCh:3,regen:.75,rt:0,inv:0,dmg:1,blast:0,pow:1,deflect:false,chain:0,hat:0,padMax:0,pad:0,fric:1.05,fire:0,fireT:0,fireRate:1}}
p=newPlayer();

 {n:'Third Line',d:'+1 launch charge',f:()=>{p.maxCh++;p.ch=p.maxCh}},
 {n:'Second Wind',d:'Charges come back 30% faster',f:()=>{p.regen*=.7}},
 {n:'Heavy Puck',d:'+1 damage, slightly bigger',f:()=>{p.dmg++;p.r+=2}},
 {n:'Tape Job',d:'Heal 2 hearts',f:()=>{p.hp=Math.min(p.max,p.hp+2)}},
 {n:'Thick Skin',d:'+1 max heart, and heal it',f:()=>{p.max++;p.hp=Math.min(p.max,p.hp+1)}},
 {n:'Boards Blast',d:'Fast wall hits make a shockwave',f:()=>{p.blast++}},
 {n:'Slapshot',d:'Launch 18% harder',f:()=>{p.pow*=1.18}},
 {n:'Glove Save',d:'Smash enemy shots while fast',once:()=>p.deflect,f:()=>{p.deflect=true}},
 {n:'Chain Shock',d:'Kills zap the nearest goon',f:()=>{p.chain++}},
 {n:'Hat Trick',d:'Every 3rd combo kill explodes',f:()=>{p.hat++}},
 {n:'Shoulder Pad',d:'Blocks one hit every wave',f:()=>{p.padMax++;p.pad++}},
 {n:'Fresh Ice',d:'Glide a lot longer',once:()=>p.fric<.6,f:()=>{p.fric*=.72}},

];

let ck=null;
function start(){initAudio();ck=null;p=newPlayer();en=[];pending=[];shots=[];parts=[];rings=[];texts=[];skids=[];queue=[];drops=[];bombs=[];bolts=[];bumpers=[];wave=0;score=0;combo=0;maxCombo=0;kills=0;shake=0;hs=0;aim=null;
  $('title').hidden=true;$('over').hidden=true;$('pick').hidden=true;$('ending').hidden=true;zoneI=-1;patches=[];runT=0;state='play';nextWave()}
function spot(minD){for(let i=0;i<30;i++){const x=rnd(R.x+40,R.x+R.w-40),y=rnd(R.y+50,R.y+R.h-40);if(Math.hypot(x-p.x,y-p.y)>minD)return{x,y}}return{x:R.x+R.w/2,y:R.y+60}}
function nextWave(){wave++;clearT=0;p.ch=p.maxCh;p.pad=p.padMax;skids=[];bossName='';bossMax=0;
  const zone=Math.min(ARENAS.length-1,Math.floor((wave-1)/5));if(zone!==zoneI){zoneI=zone;A=ARENAS[zone];makeDeco();ck={wave,zone,p:Object.assign({},p),score,kills,maxCombo,runT}}
  bumpers=[];if(wave>=6){const n=Math.min(4,zone);for(let i=0;i<n;i++){let s,ok=false;for(let k=0;k<20&&!ok;k++){s=spot(110);ok=bumpers.every(b=>Math.hypot(b.x-s.x,b.y-s.y)>110)}if(ok)bumpers.push({x:s.x,y:s.y,r:20,f:0,vx:A.moving?rnd(50,90)*(Math.random()<.5?-1:1):0})}}
  patches=[];if(A.patch){const n=3+Math.floor(((wave-1)%5)/2);for(let i=0;i<n;i++){const r=rnd(34,56);let s,ok=false;for(let k=0;k<25&&!ok;k++){s=spot(r+70);ok=bumpers.every(b=>Math.hypot(b.x-s.x,b.y-s.y)>r+b.r+20)&&patches.every(q=>Math.hypot(q.x-s.x,q.y-s.y)>r+q.r+30)}
    if(ok){const l=[];for(let j=0;j<5;j++){const a=Math.random()*6.283;l.push([Math.cos(a)*r*.45,Math.sin(a)*r*.45,r*rnd(.45,.6)])}patches.push({x:s.x,y:s.y,r,t:A.patch,l})}}}
  let budget=3+Math.round(wave*1.7),list=[];
  if(wave%5===0){const bi=(wave/5-1)%BOSSES.length,B=BOSSES[bi];bossName=B[1];if(B[0]==='twins')list.push('twinA','twinB');else list.push(B[0]);budget=Math.floor(budget/3)}
  banner={txt:bossName||('WAVE '+wave),sub:A.name,t:1.8};
  const cost={grunt:1,shooter:2,charger:2,bruiser:3,splitter:3,bomber:2,sniper:3};
  while(budget>0){const o=['grunt'];if(wave>=2)o.push('shooter');if(wave>=3)o.push('charger');if(wave>=4)o.push('bruiser');if(wave>=6)o.push('splitter');if(wave>=7)o.push('bomber');if(wave>=9)o.push('sniper');
    const t=o[Math.floor(Math.random()*o.length)];if(cost[t]>budget){list.push('grunt');budget--}else{list.push(t);budget-=cost[t]}}

function mk(t,x,y){const b=T[t],sc=1+Math.min(wave,24)*.025,tier=Math.floor((wave/5-1)/BOSSES.length);
  let hp=b.hp;if(b.b){hp=Math.round((b.hp+wave*(t[0]==='t'?.5:1))*(1+Math.max(0,tier)*.6));bossMax+=hp}
  const e={t,x,y,vx:0,vy:0,r:b.r,hp,max:hp,sp:b.sp*sc,v:b.v,b:b.b||0,flash:0,hit:0,cd:rnd(1,2.2),cd2:5,st:'seek',stT:0,dx:0,dy:1,born:.4,dead:false,sa:0,mT:0,clk:0};
  if(DASH[t])Object.assign(e,DASH[t]);return e}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.25,.6),m:.6,c:col,s:rnd(2,5)})}}

/* draw */
function disc(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=f;ctx.fill()}

  if(k==='rink'){
    ctx.fillStyle='rgba(42,95,184,.55)';ctx.fillRect(R.x,R.y+R.h*.3-3,R.w,6);ctx.fillRect(R.x,R.y+R.h*.7-3,R.w,6);

    ctx.strokeStyle='rgba(216,50,60,.5)';for(const yy of[.14,.86])for(const xx of[.25,.75]){ctx.beginPath();ctx.arc(R.x+R.w*xx,R.y+R.h*yy,30,0,6.2832);ctx.stroke()}}
  else if(k==='pond'){ctx.strokeStyle='rgba(70,120,140,.25)';ctx.lineWidth=1.5;ctx.save();ctx.translate(3,2);decoLines();ctx.restore();ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2.5;decoLines();
    for(let x=R.x;x<R.x+R.w+22;x+=22){const a=11+6*Math.sin(x*.7);disc(x,R.y,a,'#ffffff');disc(x,R.y+R.h,a,'#ffffff')}
    for(let y=R.y;y<R.y+R.h+22;y+=22){const a=10+6*Math.sin(y*.9);disc(R.x,y,a,'#ffffff');disc(R.x+R.w,y,a,'#ffffff')}}
  else if(k==='garage'){ctx.strokeStyle='rgba(0,0,0,.13)';ctx.lineWidth=2;ctx.beginPath();for(let x=R.x+90;x<R.x+R.w;x+=90){ctx.moveTo(x,R.y);ctx.lineTo(x,R.y+R.h)}for(let y=R.y+90;y<R.y+R.h;y+=90){ctx.moveTo(R.x,y);ctx.lineTo(R.x+R.w,y)}ctx.stroke();
    ctx.strokeStyle='#f2c230';ctx.lineWidth=4;ctx.beginPath();for(let x=R.x+30;x<R.x+R.w-10;x+=62){ctx.moveTo(x,R.y+10);ctx.lineTo(x,R.y+80);ctx.moveTo(x,R.y+R.h-10);ctx.lineTo(x,R.y+R.h-80)}ctx.stroke();

    ctx.shadowBlur=16;ctx.shadowColor='#ff3fd0';ctx.strokeStyle='#ff3fd0';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,Math.min(R.w*.2,70),0,6.2832);ctx.stroke();rinkPath();ctx.lineWidth=8;ctx.stroke();
    ctx.shadowColor='#3cf0ff';ctx.strokeStyle='#3cf0ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(R.x,cy);ctx.lineTo(R.x+R.w,cy);ctx.stroke();ctx.shadowBlur=0}

function drawPatches(){for(const q of patches){

  /* enemies */
  for(const e of en){const a=Math.atan2(p.y-e.y,p.x-e.x),f=e.flash>0?C.white:COL[e.t];
    if((e.st==='wind'&&e.wind)||e.st==='aim'){const big=e.t==='zamboni';ctx.strokeStyle='rgba(216,50,60,.55)';ctx.lineWidth=big?e.r*1.6:(e.st==='aim'?2:4);ctx.globalAlpha=big?.35:1;ctx.setLineDash(e.st==='aim'?[]:[10,8]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.dx*(big||e.st==='aim'?900:260),e.y+e.dy*(big||e.st==='aim'?900:260));ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1}
    ctx.globalAlpha=e.st==='blink'?.2:(e.born>0?.5:1);disc(e.x+2,e.y+4,e.r,'rgba(20,32,43,.2)');disc(e.x,e.y,e.r,C.ink);disc(e.x,e.y,e.r-3,f);if(A.dark){ctx.strokeStyle=fgA(.4);ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+1,0,6.2832);ctx.stroke()}
    if(e.t==='ref'&&e.flash<=0){ctx.save();ctx.beginPath();ctx.arc(e.x,e.y,e.r-3,0,6.2832);ctx.clip();ctx.fillStyle=C.ink;for(let i=-2;i<=2;i++)ctx.fillRect(e.x+i*12-3,e.y-e.r,6,e.r*2);ctx.restore()}
    if(e.t==='shooter'||e.t==='twinB'||e.t==='sniper'){ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*(e.r+8),e.y+Math.sin(a)*(e.r+8));ctx.stroke()}

    if(e.t==='bomber')disc(e.x,e.y-e.r*.2,4+Math.sin(tGlobal*14)*1.5,C.gold);
    if(e.t==='enforcer'){ctx.strokeStyle=C.gold;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.arc(e.x,e.y,e.r+6,e.sa-1,e.sa+1);ctx.stroke()}
    if(e.rage){ctx.strokeStyle='rgba(216,50,60,'+(.5+.4*Math.sin(tGlobal*10))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+ (e.t==='enforcer'?14:5),0,6.2832);ctx.stroke()}
    const ex=Math.cos(a),ey=Math.sin(a),er=Math.max(2.5,e.r*.17),ec=e.t==='ref'?C.red:C.ink;
    disc(e.x+ex*e.r*.4-ey*e.r*.33,e.y+ey*e.r*.4+ex*e.r*.33,er,ec);disc(e.x+ex*e.r*.4+ey*e.r*.33,e.y+ey*e.r*.4-ex*e.r*.33,er,ec);
    if(e.max>1&&!e.b){const w=e.r*1.6;ctx.fillStyle=fgA(.3);ctx.fillRect(e.x-w/2,e.y-e.r-10,w,5);ctx.fillStyle=C.red;ctx.fillRect(e.x-w/2,e.y-e.r-10,w*Math.max(0,e.hp)/e.max,5)}
    ctx.globalAlpha=1}
  for(const s of shots){const mine=!s.vx&&!s.vy;disc(s.x,s.y,mine?7:6,A.dark?'#f4f4f4':C.ink);disc(s.x,s.y,3.5,mine?C.red:C.teal)}
  ctx.strokeStyle=C.blue;ctx.lineWidth=3;for(const q of bolts){ctx.globalAlpha=q.l/.18;ctx.beginPath();ctx.moveTo(q.a,q.b);const mx=(q.a+q.c)/2+rnd(-12,12),my=(q.b+q.d)/2+rnd(-12,12);ctx.lineTo(mx,my);ctx.lineTo(q.c,q.d);ctx.stroke()}ctx.globalAlpha=1;
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}ctx.globalAlpha=1;
  /* player */

  if(state!=='over'){
    if(hot&&spd>60){ctx.strokeStyle=hc;ctx.lineWidth=p.r*1.5;ctx.lineCap='round';ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.07,p.y-p.vy*.07);ctx.stroke();ctx.globalAlpha=1}
    if(!(p.inv>0&&Math.floor(tGlobal*16)%2)){disc(p.x+2,p.y+4,p.r,'rgba(20,32,43,.25)');disc(p.x,p.y,p.r+(fire?2:0),hot?hc:C.ink);disc(p.x,p.y,p.r-3.5,C.ink);disc(p.x-p.r*.25,p.y-p.r*.3,p.r*.22,'rgba(255,255,255,.35)');if(A.dark&&!hot){ctx.strokeStyle=fgA(.85);ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,p.r+1,0,6.2832);ctx.stroke()}}
    if(p.pad>0){ctx.strokeStyle=C.blue;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,p.r+5,0,6.2832);ctx.stroke()}
    if(!fire)for(let i=0;i<p.maxCh;i++){const x=p.x+(i-(p.maxCh-1)/2)*9,y=p.y+p.r+10;disc(x,y,3.5,i<p.ch?C.gold:fgA(.2))}
    if(aim&&state==='play'){const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,len=Math.hypot(dx,dy);if(len>14){const pw=Math.min(len,130)/130,nx=dx/len,ny=dy/len,L=60+pw*150;

  if(bossName&&state==='play'){let hp=0;for(const e of en)if(e.b)hp+=Math.max(0,e.hp);if(bossMax>0&&hp>0){const bw=R.w-70,bx=R.x+35,by=R.y+14;ctx.fillStyle=fgA(.25);ctx.fillRect(bx,by,bw,9);ctx.fillStyle=C.red;ctx.fillRect(bx,by,bw*hp/bossMax,9);ctx.strokeStyle=fgA(1);ctx.lineWidth=2;ctx.strokeRect(bx,by,bw,9);ctx.fillStyle=fgA(1);ctx.font='700 15px "Barlow Condensed",sans-serif';ctx.fillText(bossName,cx,by+26)}}
