<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',BW=30,BH=46,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid rgba(255,255,255,.75);border-radius:5px;background:rgba(18,16,34,.6);cursor:pointer;opacity:.65;touch-action:none}'
    +'.h svg{display:block;width:18px;height:18px;margin:0 auto;fill:#fff}'
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#191629}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg></button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));
    host.style.left=x+'px';host.style.top=y+'px';
    w.classList.toggle('sl',x>W/2);w.classList.toggle('sr',x<=W/2);
    w.classList.toggle('vt',y<110);w.classList.toggle('vb',y>H-110);w.classList.toggle('vm',y>=110&&y<=H-110);
    pos=[x/W,y/H];
  }
  function put(){place(pos[0]*window.innerWidth,pos[1]*window.innerHeight)}
  try{var p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.length===2&&isFinite(p[0])&&isFinite(p[1]))pos=p}catch(e){}
  put();window.addEventListener('resize',put);
  var drag=null;
  h.addEventListener('pointerdown',function(e){
    var r=host.getBoundingClientRect();
    drag={id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:r.left,oy:r.top,moved:false};
    try{h.setPointerCapture(e.pointerId)}catch(_){}
    e.preventDefault();
  });
  h.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==drag.id)return;
    var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<9)return;
    drag.moved=true;w.classList.remove('open');
    place(drag.ox+dx,drag.oy+dy);
  });
  function end(e){
    if(!drag||e.pointerId!==drag.id)return;
    var d=drag;drag=null;
    if(e.type==='pointercancel')return;
    if(d.moved){try{localStorage.setItem(KEY,JSON.stringify(pos))}catch(_){}}
    else w.classList.toggle('open');
  }
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  h.addEventListener('click',function(e){if(e.detail===0)w.classList.toggle('open')});
  root.querySelector('.s').addEventListener('click',function(){w.classList.remove('open')});
  root.querySelector('.x').addEventListener('click',function(){
    try{
      if(window.__maxcade)location.reload();
      else if(history.length>1)history.back();
      else location.href='../';
    }catch(e){location.href='../'}
  });
  ['pointerdown','pointerup','pointermove','mousedown','mouseup','touchstart','touchend','touchmove','click','keydown','keyup'].forEach(function(t){
    host.addEventListener(t,function(e){e.stopPropagation()});
  });
  (document.documentElement||document.body).appendChild(host);
})();
</script>

<title>Puck Havoc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed night-rink playfield; scoreboard-style overlays sit on top of the ice. Single look by choice. */
:root{
  --ice:#e9f2f6; --ice-deep:#cfdfe8; --ink:#14202b; --red:#d8323c; --blue:#2a5fb8; --gold:#f2a51d; --board:#101a24;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--board);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#wrap{position:relative;height:100%;max-width:560px;margin:0 auto;background:var(--ice)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:rgba(16,26,36,.82);color:var(--ice)}
.ov h1{font-family:var(--display);font-size:clamp(40px,13vw,68px);line-height:.9;margin:0;color:var(--ice);text-wrap:balance;transform:rotate(-3deg)}
.ov h1 span{color:var(--gold);display:block}
.ov h2{font-family:var(--display);font-size:30px;margin:0;color:var(--gold)}
.ov p{font-size:21px;margin:0;max-width:300px;line-height:1.25}
.ov .stat{font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--ice-deep)}
button{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--gold);border:0;border-bottom:5px solid #b87608;padding:12px 30px;border-radius:6px;cursor:pointer}
button:active{transform:translateY(3px);border-bottom-width:2px}
button:focus-visible{outline:3px solid var(--ice);outline-offset:3px}
#cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
#cards button{background:var(--ice);border-bottom-color:var(--blue);text-align:left;padding:10px 16px;font-size:18px}
#cards button small{display:block;font-family:var(--body);font-weight:500;font-size:18px;margin-top:2px}
</style>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="title">
    <h1>Puck <span>Havoc</span></h1>
    <p>You're the puck. Pull back anywhere and let go to fly. Hit goons fast and they break. Sit still and they break you.</p>
    <button id="play">Drop the puck</button>
    <div class="stat" id="best"></div>
  </div>
  <div class="ov" id="pick" hidden>
    <h2 id="pickh">Wave cleared</h2>
    <div class="stat">Pick one</div>
    <div id="cards"></div>
  </div>
  <div class="ov" id="over" hidden>
    <h2>Iced</h2>
    <p id="res"></p>
    <button id="again">Go again</button>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const wrap=$('wrap'),cv=$('c'),ctx=cv.getContext('2d');
const C={ice:'#e9f2f6',deep:'#cfdfe8',ink:'#14202b',red:'#d8323c',blue:'#2a5fb8',gold:'#f2a51d',teal:'#15907f',purple:'#6b3fa0',white:'#ffffff'};
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=400,H=700,dpr=1,R={x:12,y:70,w:376,h:616};
function resize(){const b=wrap.getBoundingClientRect();W=b.width||400;H=b.height||700;dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);R={x:12,y:70,w:W-24,h:H-84};}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('puckhavoc-best')||0}catch(e){}
function showBest(){$('best').textContent=best?('Best '+best):'5 hearts. No refs.'}
showBest();

/* audio */
let ac=null;
function snd(f,d,type,vol,slide){if(!ac)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function initAudio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}else if(ac.state==='suspended')ac.resume()}

/* state */
let state='title',p,en=[],shots=[],parts=[],rings=[],texts=[],skids=[],queue=[],drops=[];
let wave=0,score=0,combo=0,comboT=0,shake=0,hs=0,ts=1,aim=null,banner=null,clearT=0,tGlobal=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function newPlayer(){return{x:R.x+R.w/2,y:R.y+R.h*.7,vx:0,vy:0,r:15,hp:5,max:5,ch:3,maxCh:3,regen:.75,rt:0,inv:0,dmg:1,blast:0,pow:1,deflect:false}}
p=newPlayer();

const UP=[
 {n:'Third Line',d:'+1 launch charge',f:()=>{p.maxCh++;p.ch=p.maxCh}},
 {n:'Second Wind',d:'Charges come back 30% faster',f:()=>{p.regen*=.7}},
 {n:'Heavy Puck',d:'+1 damage, slightly bigger',f:()=>{p.dmg++;p.r+=2}},
 {n:'Tape Job',d:'Heal 2 hearts',f:()=>{p.hp=Math.min(p.max,p.hp+2)}},
 {n:'Thick Skin',d:'+1 max heart, and heal it',f:()=>{p.max++;p.hp=Math.min(p.max,p.hp+1)}},
 {n:'Boards Blast',d:'Fast wall hits make a shockwave',f:()=>{p.blast++}},
 {n:'Slapshot',d:'Launch 18% harder',f:()=>{p.pow*=1.18}},
 {n:'Glove Save',d:'Smash enemy shots while fast',once:true,f:()=>{p.deflect=true}}
];

function start(){initAudio();p=newPlayer();en=[];shots=[];parts=[];rings=[];texts=[];skids=[];queue=[];drops=[];wave=0;score=0;combo=0;shake=0;hs=0;aim=null;
  $('title').hidden=true;$('over').hidden=true;$('pick').hidden=true;state='play';nextWave()}
function spot(minD){for(let i=0;i<30;i++){const x=rnd(R.x+40,R.x+R.w-40),y=rnd(R.y+40,R.y+R.h-40);if(Math.hypot(x-p.x,y-p.y)>minD)return{x,y}}return{x:R.x+R.w/2,y:R.y+60}}
function nextWave(){wave++;clearT=0;p.ch=p.maxCh;banner={txt:wave%5===0?'BOSS':'WAVE '+wave,t:1.6};
  let budget=3+wave*2,list=[];
  if(wave%5===0){list.push('boss');budget=Math.floor(budget/2)}
  while(budget>0){const o=['grunt'];if(wave>=2)o.push('shooter');if(wave>=3)o.push('charger');if(wave>=4)o.push('bruiser');
    const t=o[Math.floor(Math.random()*o.length)],cost={grunt:1,shooter:2,charger:2,bruiser:3}[t];if(cost>budget){list.push('grunt');budget--}else{list.push(t);budget-=cost}}
  list.forEach((t,i)=>{const s=spot(150);queue.push({d:1+i*.45,t,x:s.x,y:s.y})});
  snd(330,.12,'square',.07);setTimeout(()=>snd(495,.18,'square',.07),120)}
function mk(t,x,y){const b={grunt:{r:14,hp:1,sp:70,v:1},shooter:{r:14,hp:1,sp:60,v:2},charger:{r:15,hp:2,sp:50,v:3},bruiser:{r:24,hp:4,sp:38,v:4},boss:{r:42,hp:12+wave*2,sp:30,v:25}}[t];
  const sc=1+Math.min(wave,20)*.025;return{t,x,y,vx:0,vy:0,r:b.r,hp:b.hp,max:b.hp,sp:b.sp*sc,v:b.v,flash:0,hit:0,cd:rnd(1,2.2),cd2:5,st:'seek',stT:0,dx:0,dy:0,born:.4,dead:false}}

function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.25,.6),m:.6,c:col,s:rnd(2,5)})}}
function hurtEnemy(e,d){if(e.dead||e.hit>0)return false;e.hp-=d;e.flash=.12;e.hit=.18;
  if(e.hp<=0){e.dead=true;combo++;comboT=2.4;const pts=10*e.v*combo;score+=pts;texts.push({x:e.x,y:e.y,txt:'+'+pts,l:.8});
    burst(e.x,e.y,col(e),e.t==='boss'?50:14,e.t==='boss'?420:260);rings.push({x:e.x,y:e.y,r:e.r,m:e.r*3,l:.3});
    shake=Math.min(18,shake+(e.t==='boss'?16:6));hs=e.t==='boss'?.18:.045;snd(180+combo*30,.14,'square',.09,90);
    if(p.hp<p.max&&Math.random()<(e.t==='boss'?1:.07))drops.push({x:e.x,y:e.y,l:9});return true}
  snd(240,.07,'triangle',.09);burst(e.x,e.y,C.white,5,160);return false}
function hurtPlayer(nx,ny){if(p.inv>0||state!=='play')return;p.hp--;p.inv=1.1;combo=0;shake=14;hs=.08;p.vx=nx*220;p.vy=ny*220;burst(p.x,p.y,C.ink,12,220);snd(120,.3,'sawtooth',.1,50);
  if(p.hp<=0){state='over';if(score>best){best=score;try{localStorage.setItem('puckhavoc-best',best)}catch(e){}}
    $('res').textContent='Score '+score+' · reached wave '+wave+(score>=best&&score>0?' · new best':'');setTimeout(()=>{$('over').hidden=false},600);showBest()}}
function col(e){return{grunt:C.red,shooter:C.teal,charger:C.gold,bruiser:C.purple,boss:C.blue}[e.t]}

/* input */
function pos(ev){const b=cv.getBoundingClientRect();return{x:ev.clientX-b.left,y:ev.clientY-b.top}}
cv.addEventListener('pointerdown',ev=>{if(state!=='play')return;initAudio();const q=pos(ev);aim={sx:q.x,sy:q.y,cx:q.x,cy:q.y,id:ev.pointerId};try{cv.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
cv.addEventListener('pointermove',ev=>{if(aim&&ev.pointerId===aim.id){const q=pos(ev);aim.cx=q.x;aim.cy=q.y}});
function release(ev){if(!aim||ev.pointerId!==aim.id)return;const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,len=Math.hypot(dx,dy);aim=null;
  if(state!=='play'||len<14)return;if(p.ch<1){snd(90,.08,'square',.05);return}
  const pw=Math.min(len,130)/130,sp=(480+720*pw)*p.pow;p.vx=dx/len*sp;p.vy=dy/len*sp;p.ch--;snd(300+pw*300,.12,'sawtooth',.07,700);burst(p.x,p.y,C.deep,6,120)}
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',()=>{aim=null});
$('play').onclick=start;$('again').onclick=start;

function showPick(){state='pick';$('pickh').textContent='Wave '+wave+' cleared';const box=$('cards');box.innerHTML='';
  const pool=UP.filter(u=>!(u.once&&p.deflect)&&!(u.n==='Tape Job'&&p.hp>=p.max));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  pool.slice(0,3).forEach((u,i)=>{const b=document.createElement('button');b.id='card'+i;b.innerHTML=u.n+'<small>'+u.d+'</small>';
    b.onclick=()=>{u.f();$('pick').hidden=true;state='play';snd(520,.15,'square',.07);nextWave()};box.appendChild(b)});
  $('pick').hidden=false}

/* update */
function step(dt){tGlobal+=dt;
  ts+=((aim?.18:1)-ts)*Math.min(1,dt*14);let g=dt*ts;if(hs>0){hs-=dt;g=0}
  shake*=Math.pow(.002,dt);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  for(const q of parts){q.x+=q.vx*g;q.y+=q.vy*g;q.vx*=1-2.5*g;q.vy*=1-2.5*g;q.l-=g}parts=parts.filter(q=>q.l>0);
  for(const q of rings){q.l-=g}rings=rings.filter(q=>q.l>0);
  for(const q of texts){q.l-=g;q.y-=30*g}texts=texts.filter(q=>q.l>0);
  if(state!=='play')return;
  if(comboT>0){comboT-=g;if(comboT<=0)combo=0}
  if(p.inv>0)p.inv-=g;
  if(p.ch<p.maxCh){p.rt+=g;if(p.rt>=p.regen){p.rt=0;p.ch++}}else p.rt=0;
  /* player */
  const ox=p.x,oy=p.y;p.x+=p.vx*g;p.y+=p.vy*g;const fr=Math.exp(-1.05*g);p.vx*=fr;p.vy*=fr;
  let spd=Math.hypot(p.vx,p.vy),hot=spd>250,bounced=false;
  if(p.x<R.x+p.r){p.x=R.x+p.r;p.vx=Math.abs(p.vx)*.9;bounced=true}
  if(p.x>R.x+R.w-p.r){p.x=R.x+R.w-p.r;p.vx=-Math.abs(p.vx)*.9;bounced=true}
  if(p.y<R.y+p.r){p.y=R.y+p.r;p.vy=Math.abs(p.vy)*.9;bounced=true}
  if(p.y>R.y+R.h-p.r){p.y=R.y+R.h-p.r;p.vy=-Math.abs(p.vy)*.9;bounced=true}
  if(bounced&&spd>120){snd(140,.05,'triangle',.06);burst(p.x,p.y,C.deep,4,100);
    if(hot&&p.blast){const br=55+p.blast*22;rings.push({x:p.x,y:p.y,r:10,m:br,l:.3});shake=Math.min(18,shake+4);for(const e of en)if(Math.hypot(e.x-p.x,e.y-p.y)<br+e.r)hurtEnemy(e,1)}}
  if(hot){skids.push({a:ox,b:oy,c:p.x,d:p.y});if(skids.length>500)skids.shift()}
  /* spawns */
  for(const q of queue){q.d-=g;if(q.d<=0){en.push(mk(q.t,q.x,q.y));burst(q.x,q.y,C.deep,8,140)}}queue=queue.filter(q=>q.d>0);
  /* enemies */
  for(const e of en){if(e.dead)continue;if(e.flash>0)e.flash-=g;if(e.hit>0)e.hit-=g;if(e.born>0)e.born-=g;
    let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,tx=nx,ty=ny,sp=e.sp;
    if(e.t==='shooter'){if(d<150){tx=-nx;ty=-ny}else if(d<230){tx=-ny;ty=nx;sp*=.6}
      e.cd-=g;if(e.cd<=0){e.cd=2.4;shots.push({x:e.x+nx*e.r,y:e.y+ny*e.r,vx:nx*150,vy:ny*150,l:6});snd(600,.06,'square',.04)}}
    else if(e.t==='charger'){e.cd-=g;
      if(e.st==='seek'&&e.cd<=0&&d<340){e.st='wind';e.stT=.65;e.dx=nx;e.dy=ny}
      if(e.st==='wind'){sp=0;e.dx=nx;e.dy=ny;e.stT-=g;if(e.stT<=0){e.st='dash';e.stT=.5;e.vx=e.dx*540;e.vy=e.dy*540;snd(220,.2,'sawtooth',.05,440)}}
      else if(e.st==='dash'){sp=-1;e.stT-=g;if(e.stT<=0){e.st='seek';e.cd=2.2}}}
    else if(e.t==='boss'){e.cd-=g;e.cd2-=g;
      if(e.cd<=0){e.cd=3;for(let i=0;i<8;i++){const a=i/8*6.283+tGlobal;shots.push({x:e.x,y:e.y,vx:Math.cos(a)*130,vy:Math.sin(a)*130,l:6})}snd(400,.15,'square',.06,200)}
      if(e.cd2<=0){e.cd2=6;for(let i=0;i<2;i++){const s=spot(140);queue.push({d:.9,t:'grunt',x:s.x,y:s.y})}}}
    if(sp>=0){e.vx+=(tx*sp-e.vx)*Math.min(1,g*3);e.vy+=(ty*sp-e.vy)*Math.min(1,g*3)}
    e.x+=e.vx*g;e.y+=e.vy*g;
    if(e.x<R.x+e.r){e.x=R.x+e.r;e.vx=Math.abs(e.vx)}if(e.x>R.x+R.w-e.r){e.x=R.x+R.w-e.r;e.vx=-Math.abs(e.vx)}
    if(e.y<R.y+e.r){e.y=R.y+e.r;e.vy=Math.abs(e.vy)}if(e.y>R.y+R.h-e.r){e.y=R.y+R.h-e.r;e.vy=-Math.abs(e.vy)}
    /* vs player */
    dx=p.x-e.x;dy=p.y-e.y;d=Math.hypot(dx,dy)||1;
    if(d<p.r+e.r){nx=dx/d;ny=dy/d;
      if(hot){if(e.hit<=0){const killed=hurtEnemy(e,p.dmg);if(killed){p.vx*=.95;p.vy*=.95}else{const vd=p.vx*nx+p.vy*ny;if(vd<0){p.vx-=2*vd*nx;p.vy-=2*vd*ny}p.vx*=.88;p.vy*=.88;p.x=e.x+nx*(p.r+e.r+1);p.y=e.y+ny*(p.r+e.r+1);e.vx-=nx*120;e.vy-=ny*120}}}
      else if(e.born<=0){hurtPlayer(nx,ny);p.x=e.x+nx*(p.r+e.r+1);p.y=e.y+ny*(p.r+e.r+1)}}
  }
  for(let i=0;i<en.length;i++)for(let j=i+1;j<en.length;j++){const a=en[i],b=en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,o=a.r+b.r-d;if(o>0){const nx=dx/d,ny=dy/d;a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2}}
  en=en.filter(e=>!e.dead);
  /* shots */
  for(const s of shots){s.x+=s.vx*g;s.y+=s.vy*g;s.l-=g;if(s.x<R.x||s.x>R.x+R.w||s.y<R.y||s.y>R.y+R.h)s.l=0;
    const dx=p.x-s.x,dy=p.y-s.y,d=Math.hypot(dx,dy)||1;if(s.l>0&&d<p.r+5){s.l=0;if(hot&&p.deflect){burst(s.x,s.y,C.teal,6,150);score+=5;snd(700,.05,'square',.04)}else hurtPlayer(dx/d,dy/d)}}
  shots=shots.filter(s=>s.l>0);
  for(const h of drops){h.l-=g;if(Math.hypot(p.x-h.x,p.y-h.y)<p.r+12){h.l=0;p.hp=Math.min(p.max,p.hp+1);snd(660,.2,'sine',.09,990);texts.push({x:h.x,y:h.y,txt:'+1 heart',l:.9})}}
  drops=drops.filter(h=>h.l>0);
  if(!en.length&&!queue.length&&state==='play'){clearT+=dt;if(clearT>.9){shots=[];showPick()}}
}

/* draw */
function disc(x,y,r,f){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fillStyle=f;ctx.fill()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#101a24';ctx.fillRect(0,0,W,H);
  ctx.save();if(!calm&&shake>.3)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  /* rink */
  ctx.fillStyle=C.ice;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(R.x,R.y,R.w,R.h,26);else ctx.rect(R.x,R.y,R.w,R.h);ctx.fill();
  ctx.save();ctx.clip();
  const cx=R.x+R.w/2,cy=R.y+R.h/2;
  ctx.fillStyle='rgba(42,95,184,.55)';ctx.fillRect(R.x,R.y+R.h*.3-3,R.w,6);ctx.fillRect(R.x,R.y+R.h*.7-3,R.w,6);
  ctx.fillStyle='rgba(216,50,60,.6)';ctx.fillRect(R.x,cy-3,R.w,6);
  ctx.strokeStyle='rgba(42,95,184,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,Math.min(R.w*.2,70),0,6.2832);ctx.stroke();
  ctx.strokeStyle='rgba(216,50,60,.5)';for(const yy of[.14,.86])for(const xx of[.25,.75]){ctx.beginPath();ctx.arc(R.x+R.w*xx,R.y+R.h*yy,30,0,6.2832);ctx.stroke()}
  ctx.strokeStyle='rgba(20,32,43,.12)';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();for(const s of skids){ctx.moveTo(s.a,s.b);ctx.lineTo(s.c,s.d)}ctx.stroke();
  /* spawn marks */
  for(const q of queue)if(q.d<.9){const k=1-q.d/.9;ctx.strokeStyle='rgba(20,32,43,'+(.25+.5*k)+')';ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(q.x,q.y,26-10*k,0,6.2832);ctx.stroke();ctx.setLineDash([])}
  for(const h of drops){const b=1+Math.sin(tGlobal*6)*.12;disc(h.x,h.y,10*b,C.red);disc(h.x,h.y,4*b,C.white)}
  for(const q of rings){const k=1-q.l/.3;ctx.strokeStyle='rgba(20,32,43,'+(1-k)*.7+')';ctx.lineWidth=5*(1-k)+1;ctx.beginPath();ctx.arc(q.x,q.y,q.r+(q.m-q.r)*k,0,6.2832);ctx.stroke()}
  /* enemies */
  for(const e of en){const a=Math.atan2(p.y-e.y,p.x-e.x),f=e.flash>0?C.white:col(e);
    if(e.t==='charger'&&e.st==='wind'){ctx.strokeStyle='rgba(216,50,60,.55)';ctx.lineWidth=4;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+e.dx*260,e.y+e.dy*260);ctx.stroke();ctx.setLineDash([])}
    ctx.globalAlpha=e.born>0?.5:1;disc(e.x+2,e.y+4,e.r,'rgba(20,32,43,.2)');disc(e.x,e.y,e.r,C.ink);disc(e.x,e.y,e.r-3,f);
    if(e.t==='shooter'){ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*(e.r+8),e.y+Math.sin(a)*(e.r+8));ctx.stroke()}
    const ex=Math.cos(a),ey=Math.sin(a),er=Math.max(2.5,e.r*.17);
    disc(e.x+ex*e.r*.4-ey*e.r*.33,e.y+ey*e.r*.4+ex*e.r*.33,er,C.ink);disc(e.x+ex*e.r*.4+ey*e.r*.33,e.y+ey*e.r*.4-ex*e.r*.33,er,C.ink);
    if(e.max>1){const w=e.r*1.6;ctx.fillStyle='rgba(20,32,43,.3)';ctx.fillRect(e.x-w/2,e.y-e.r-10,w,5);ctx.fillStyle=C.red;ctx.fillRect(e.x-w/2,e.y-e.r-10,w*Math.max(0,e.hp)/e.max,5)}
    ctx.globalAlpha=1}
  for(const s of shots){disc(s.x,s.y,6,C.ink);disc(s.x,s.y,3.5,C.teal)}
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s)}ctx.globalAlpha=1;
  /* player */
  const spd=Math.hypot(p.vx,p.vy),hot=spd>250;
  if(state!=='over'){
    if(hot){ctx.strokeStyle=C.gold;ctx.lineWidth=p.r*1.5;ctx.lineCap='round';ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.07,p.y-p.vy*.07);ctx.stroke();ctx.globalAlpha=1}
    if(!(p.inv>0&&Math.floor(tGlobal*16)%2)){disc(p.x+2,p.y+4,p.r,'rgba(20,32,43,.25)');disc(p.x,p.y,p.r,hot?C.gold:C.ink);disc(p.x,p.y,p.r-3.5,C.ink);disc(p.x-p.r*.25,p.y-p.r*.3,p.r*.22,'rgba(255,255,255,.35)')}
    for(let i=0;i<p.maxCh;i++){const x=p.x+(i-(p.maxCh-1)/2)*9,y=p.y+p.r+9;disc(x,y,3.5,i<p.ch?C.gold:'rgba(20,32,43,.2)')}
    if(aim&&state==='play'){const dx=aim.sx-aim.cx,dy=aim.sy-aim.cy,len=Math.hypot(dx,dy);if(len>14){const pw=Math.min(len,130)/130,nx=dx/len,ny=dy/len,L=60+pw*150;
      ctx.strokeStyle=p.ch>=1?C.ink:'rgba(20,32,43,.3)';ctx.lineWidth=4;ctx.setLineDash([4,9]);ctx.beginPath();ctx.moveTo(p.x+nx*p.r,p.y+ny*p.r);ctx.lineTo(p.x+nx*L,p.y+ny*L);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(p.x+nx*(L+12),p.y+ny*(L+12));ctx.lineTo(p.x+nx*L-ny*8,p.y+ny*L+nx*8);ctx.lineTo(p.x+nx*L+ny*8,p.y+ny*L-nx*8);ctx.fill();
      ctx.strokeStyle='rgba(216,50,60,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-nx*pw*46,p.y-ny*pw*46);ctx.stroke()}}
  }
  ctx.font='700 18px "Barlow Condensed",sans-serif';ctx.textAlign='center';ctx.fillStyle=C.ink;for(const q of texts){ctx.globalAlpha=Math.min(1,q.l*2);ctx.fillText(q.txt,q.x,q.y)}ctx.globalAlpha=1;
  if(banner&&state==='play'){ctx.globalAlpha=Math.min(1,banner.t)*.9;ctx.font='44px Bungee,Impact,sans-serif';ctx.fillStyle=C.ink;ctx.fillText(banner.txt,cx,R.y+R.h*.22);ctx.globalAlpha=1}
  ctx.restore();ctx.restore();
  /* hud */
  for(let i=0;i<p.max;i++){const x=24+i*20,y=30;disc(x,y,7.5,i<p.hp?C.red:'rgba(233,242,246,.18)')}
  ctx.textBaseline='middle';ctx.fillStyle=C.ice;ctx.font='700 15px "Barlow Condensed",sans-serif';ctx.textAlign='left';ctx.fillText('WAVE '+Math.max(1,wave),17,53);
  ctx.textAlign='right';ctx.font='24px Bungee,Impact,sans-serif';ctx.fillText(score,W-16,30);
  if(combo>1){ctx.fillStyle=C.gold;ctx.font='700 16px "Barlow Condensed",sans-serif';ctx.fillText('COMBO x'+combo,W-16,54)}
  ctx.textBaseline='alphabetic';
}
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;step(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
