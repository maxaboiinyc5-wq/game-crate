<script>

(function(){

    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';

<style>:root{color-scheme:dark;--ink:#f3f1ea;--mute:#a7adbb;--glass:rgba(16,20,30,.72);--glass2:rgba(26,32,46,.9);--line:rgba(255,255,255,.12);--gold:#f2c230;--blue:#3d7bff;--red:#ff4d5e;--green:#3ee6a8;

.tuthead{display:flex;align-items:center;justify-content:space-between;gap:8px}

<script>'use strict';
/* ============ Lockup Tycoon: core helpers ============ */
const T = THREE;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist2 = (ax, az, bx, bz) => { const dx = ax - bx, dz = az - bz; return dx * dx + dz * dz; };
const dist = (ax, az, bx, bz) => Math.sqrt(dist2(ax, az, bx, bz));
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const $ = id => document.getElementById(id);
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const COARSE = window.matchMedia && matchMedia('(pointer:coarse)').matches;
const MOBILE = IS_TOUCH && COARSE;
const STAR = n => '★'.repeat(n) + '<span class="dim">' + '★'.repeat(5 - n) + '</span>';

const FIRST = ['Marcus','Tony','Dre','Vince','Luis','Ray','Eddie','Jamal','Kyle','Rico','Sal','Terrence','Bobby','Nate','Carlos','Duane','Mikey','Omar','Frank','Jesse','Andre','Tyrell','Hector','Wes','Gus','Darius','Lenny','Rocco','Manny','Deshawn','Trina','Keisha','Rosa','Brenda','Tasha','Lola','Gina','Mona','Dana','Nikki'];
const LAST = ['Hayes','Moreno','Banks','Kowalski','Reyes','Price','Doyle','Grant','Vega','Mercer','Cruz','Boone','Fisher','Nash','Ortiz','Pike','Sloan','Tate','Vance','Wells','Rhodes','Carter','Lopez','Brooks','Gallo','Diaz','Hale','Russo','Fox','King'];
const FEMALE_FIRST = new Set(['Trina','Keisha','Rosa','Brenda','Tasha','Lola','Gina','Mona','Dana','Nikki']);
const STAFF_FIRST = ['Mike','Sarah','Dave','Lisa','Chris','Pam','Rob','Jen','Steve','Kim','Joe','Amy','Phil','Kate','Ron','Beth','Sam','Tina','Greg','Ann'];

/* ---------- save ---------- */
const SAVE_KEY = 'lockup.save.v1';
function loadSave() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } }
function writeSave(o) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }
function pref(k, d) { try { const v = localStorage.getItem('lockup.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function setPref(k, v) { try { localStorage.setItem('lockup.' + k, JSON.stringify(v)); } catch (e) { } }

/* ---------- sound (all synthesized) ---------- */
const SFX = {
  ctx: null, master: null, on: pref('sound', true), sirenNode: null, engine: null, alarmNode: null,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.6 : 0; this.master.connect(this.ctx.destination);

  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setOn(v) { this.on = v; setPref('sound', v); if (this.master) this.master.gain.value = v ? 0.6 : 0; },
  tone(f, d = 0.12, type = 'sine', vol = 0.2, slide = 0, delay = 0) {
    if (!this.ctx) return; const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d = 0.2, vol = 0.2, hp = 800) {
    if (!this.ctx) return; const c = this.ctx, n = Math.floor(c.sampleRate * d), b = c.createBuffer(1, n, c.sampleRate), a = b.getChannelData(0);

    const s = c.createBufferSource(); s.buffer = b; const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  click() { this.tone(900, 0.05, 'triangle', 0.08); },
  cash() { this.tone(1320, 0.08, 'square', 0.06); this.tone(1760, 0.14, 'square', 0.06, 0, 0.07); },
  place() { this.tone(220, 0.08, 'triangle', 0.18); this.noise(0.08, 0.08, 1500); },
  bad() { this.tone(200, 0.2, 'sawtooth', 0.1, -80); },
  cuff() { this.tone(2200, 0.04, 'square', 0.06); this.tone(1800, 0.05, 'square', 0.06, 0, 0.06); this.noise(0.05, 0.1, 3000); },

  zap() { this.noise(0.4, 0.15, 2500); this.tone(3000, 0.3, 'sawtooth', 0.04, -2000); },
  bark() { this.tone(520, 0.08, 'sawtooth', 0.12, -200); this.tone(480, 0.1, 'sawtooth', 0.12, -220, 0.14); },

      const c = this.ctx, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
      o.type = 'square'; o.frequency.value = 760; l.frequency.value = 1.6; lg.gain.value = 260; l.connect(lg); lg.connect(o.frequency);
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1800;
      g.gain.value = 0.045; o.connect(f); f.connect(g); g.connect(this.master); o.start(); l.start(); this.sirenNode = { o, l, g };
    } else if (!on && this.sirenNode) { try { this.sirenNode.o.stop(); this.sirenNode.l.stop(); } catch (e) { } this.sirenNode = null; }
  },
  alarm(on) {
    if (!this.ctx) return;
    if (on && !this.alarmNode) {
      const c = this.ctx, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
      o.type = 'sawtooth'; o.frequency.value = 520; l.type = 'square'; l.frequency.value = 2; lg.gain.value = 120; l.connect(lg); lg.connect(o.frequency);
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
      g.gain.value = 0.03; o.connect(f); f.connect(g); g.connect(this.master); o.start(); l.start(); this.alarmNode = { o, l };
    } else if (!on && this.alarmNode) { try { this.alarmNode.o.stop(); this.alarmNode.l.stop(); } catch (e) { } this.alarmNode = null; }
  },
  engineSet(on, speed = 0) {
    if (!this.ctx) return; const c = this.ctx;

      const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();

      o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master); o.start(); o2.start(); this.engine = { o, o2, g, f };
    }

    if (this.engine) {

      this.engine.o.frequency.setTargetAtTime(45 + s * 4.2, t, 0.08); this.engine.o2.frequency.setTargetAtTime(22 + s * 2.1, t, 0.08);
      this.engine.g.gain.setTargetAtTime(0.035 + Math.min(0.04, s * 0.0015), t, 0.1); this.engine.f.frequency.setTargetAtTime(300 + s * 40, t, 0.1);
    }

function toLambert(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const mm = Array.isArray(o.material) ? o.material : [o.material];
    const out = mm.map(old => {
      const m = new T.MeshLambertMaterial({ color: old.color ? old.color.clone() : new T.Color(0xffffff), map: old.map || null, skinning: !!o.isSkinnedMesh });

function loadModels(onProgress) {
  if (!T.GLTFLoader || !T.SkeletonUtils || !window.fflate) return Promise.resolve(false);
  const ld = new T.GLTFLoader(); let done = 0;
  const get = f => fetch('chars/' + f + '.txt').then(r => { if (!r.ok) throw new Error(f); return r.text(); }).then(t => {
    const bin = atob(t.trim()), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const raw = fflate.gunzipSync(u);
    return new Promise((res, rej) => ld.parse(raw.buffer.slice(raw.byteOffset, raw.byteOffset + raw.byteLength), '', res, rej));
  });
  const jobs = MODEL_IDS.map(id => get(id).then(g => {
    const kill = []; g.scene.traverse(o => { if (/^Cube204/.test(o.name) || o.name === 'Pistol') kill.push(o); }); kill.forEach(o => o.parent && o.parent.remove(o));
    toLambert(g.scene);
    const bb = new T.Box3().setFromObject(g.scene);
    MODELS[id] = { scene: g.scene, clips: g.animations, h: Math.max(0.5, bb.max.y - bb.min.y) };
    done++; onProgress && onProgress(done / MODEL_IDS.length);
  }).catch(e => { console.warn('model', id, e); done++; }));
  const to = new Promise(res => setTimeout(res, 30000));
  return Promise.race([Promise.all(jobs), to]).then(() => { modelsReady = Object.keys(MODELS).length > 0; return modelsReady; });
}

/* Build a person. role: inmate|guard|cop|player|janitor|civ|crook */
function makePersonView(role, opts = {}) {
  propMats();
  let id = opts.model;
  if (!id) {
    if (role === 'guard' || role === 'cop' || role === 'player') id = opts.female ? 'w_suit' : 'suit';
    else if (role === 'janitor') id = 'worker';
    else if (role === 'inmate') id = opts.female ? 'w_casual' : (Math.random() < 0.7 ? 'casual_2' : 'casual_hoodie');
    else id = pick(MODEL_IDS);
  }
  const root = new T.Group();
  const lean = new T.Group(); root.add(lean);
  const v = { root, lean, id, role, mixer: null, acts: {}, cur: null, B: {}, pose: null, poseT: 0, held: null, hat: null, h: 1.85 };
  const src = MODELS[id] || MODELS[Object.keys(MODELS)[0]];
  if (!src) { // fallback capsule person if models failed
    const m = new T.Mesh(new T.CylinderGeometry(0.22, 0.2, 1.7, 10), L({ color: role === 'inmate' ? 0xf0701e : role === 'guard' ? 0x23272f : 0x3a4a6a }));
    m.position.y = 0.85; m.castShadow = true; lean.add(m);
    const hd = new T.Mesh(new T.SphereGeometry(0.15, 12, 10), L({ color: 0xc68a62 })); hd.position.y = 1.75; lean.add(hd);

  const tone = opts.tone != null ? opts.tone : pick(SKIN_TONES), hair = opts.hair != null ? opts.hair : pick(HAIR_COLS);
  const uni = UNIFORMS[role === 'crook' ? 'none' : role];
  const randCloth = role === 'civ' || role === 'crook' ? (Math.random() < 0.65) : false;
  const rc = {};
  body.traverse(o => {
    if (!o.isMesh) return; o.frustumCulled = false;
    const fix = mm => {
      const part = matPart(id, mm.name);
      let hex = null;
      if (part === 'skin') hex = tone; else if (part === 'skind') hex = new T.Color(tone).multiplyScalar(0.85).getHex();
      else if (part === 'hair') hex = hair;
      else if (part === 'cloth') {
        if (role === 'inmate' && INMATE_MAP[id]) hex = INMATE_MAP[id][mm.name] != null ? INMATE_MAP[id][mm.name] : 0xf0701e;
        else if (uni) hex = uni[mm.name] != null ? uni[mm.name] : uni._all;
        else if (role === 'crook') hex = rc[mm.name] || (rc[mm.name] = pick([0x1d1d1f, 0x2a2a2e, 0x3a3030, 0x26303a, 0x40382a, 0x1f2a22]));
        else if (randCloth) hex = rc[mm.name] || (rc[mm.name] = pick(CLOTH_COLS));

  });

  lean.add(body); v.body = body;

  for (const c of src.clips) v.acts[c.name] = v.mixer.clipAction(c);
  body.traverse(o => { if (o.isBone) { v.B[o.name] = o; v.B[o.name.replace(/[.\s]/g, '')] = o; } });

  if ((role === 'guard' || role === 'cop' || role === 'player') && v.B.Head) {
    const cap = PROP.cap.clone(); v.B.Head.add(cap); v.hat = cap;
    // bone space is scaled with body; compensate so cap is world-sized
    const k = 1 / s; cap.scale.setScalar(k * 1.05); cap.position.set(0, 0.215 * k, 0.012 * k);
  }

    const a = v.acts[name]; if (!a) return;
    a.timeScale = ts;
    if (v.cur === a) return;
    a.reset().play(); if (v.cur) a.crossFadeFrom(v.cur, fade, false); v.cur = a;
  };

}

/* attach a held prop to the right hand */
function holdProp(v, kind) {
  if (v.held && v.held.userData.kind === kind) return;
  if (v.held) { v.held.parent && v.held.parent.remove(v.held); v.held = null; }
  if (!kind || !v.B['WristR']) return;

  const k = 1 / v.body.scale.x; p.scale.setScalar(k);
  if (kind === 'tray') { p.position.set(0, 0.12 * k, 0.12 * k); }
  if (kind === 'baton') { p.position.set(0, 0.06 * k, 0.04 * k); p.rotation.x = Math.PI / 2; }
  if (kind === 'mop') { p.position.set(0, 0.1 * k, 0); }
  if (kind === 'ball') { p.position.set(0, 0.1 * k, 0.1 * k); }

/* ---------- per-frame ---------- */
function crimeUpdate(dt) {
  if (!G) return;
  CRIME_T -= dt;
  const cap = 2 + Math.min(3, Math.floor(level() / 2));
  if (CRIME_T <= 0) { CRIME_T = rnd(22, 48) * (CRIMES_ACTIVE.length ? 1.3 : 0.7); if (CRIMES_ACTIVE.length < cap) spawnCrime(); }
  for (const cr of [...CRIMES_ACTIVE]) {
    cr.t += dt;
    if (cr.state === 'active' && cr.t > cr.life && cr.claimed !== 'officer') { for (const c of cr.crooks) { c.state = 'gone'; c.p.remove(); const i = CROOKS.indexOf(c); if (i >= 0) CROOKS.splice(i, 1); } if (cr.car) cr.car.remove(); removeCrime(cr); continue; }
    if (!cr.beacon && cr.state !== 'done') { const b = new T.Mesh(new T.CylinderGeometry(1.4, 1.4, 60, 16, 1, true), new T.MeshBasicMaterial({ color: STAR_COL[cr.stars], transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide })); b.position.set(cr.x, 30, cr.z); scene.add(b); cr.beacon = b; }
    if (cr.beacon) { // follow the suspect
      const live = cr.crooks.find(c => c.state !== 'gone' && c.state !== 'custody' && c.state !== 'booked' && c.state !== 'seat');
      if (live) { const px = live.car && live.state === 'driving' ? live.car.x : live.p.x, pz = live.car && live.state === 'driving' ? live.car.z : live.p.z; cr.x = px; cr.z = pz; cr.beacon.position.set(px, 30, pz); cr.beacon.visible = true; }
      else cr.beacon.visible = false;
    }
  }
  for (const c of [...CROOKS]) crookUpdate(c, dt);
  for (const car of CARS) if (car.kind === 'crook') crookCarUpdate(car, dt);
  for (const o of OFFICERS) officerUpdate(o, dt);
  roadThings(dt);
  if (PLAYER.taserCd > 0) PLAYER.taserCd -= dt; if (PLAYER.spikeCd > 0) PLAYER.spikeCd -= dt; if (PLAYER.rbCd > 0) PLAYER.rbCd -= dt;
  dogUpdate(dt);
  bookingCheck();
}

function camAvoid(pos, tgt) { // pull the camera in front of buildings

    for (const b of nearBoxes(pos.x, pos.z, 1)) if (!b.tree && pos.y < b.h + 1 && pos.x > b.x0 - 0.8 && pos.x < b.x1 + 0.8 && pos.z > b.z0 - 0.8 && pos.z < b.z1 + 0.8) { inside = true; break; }
    if (!inside) return;
    pos.x = tgt.x + (pos.x - tgt.x) * 0.8; pos.z = tgt.z + (pos.z - tgt.z) * 0.8; pos.y = Math.max(pos.y, tgt.y + 1.5);
  }
}
const _cv = new T.Vector3(), _ct = new T.Vector3();
function updateCamera(dt) {

    const dist = 8.6 + Math.min(6, Math.abs(sp) * 0.14) + (c.spec.h - 1.4) * 2, h = Math.max(1.6, 3.6 + (c.spec.h - 1.4) * 1.2 + CAM.tilt * 7);

  } else {

  $('bExit').onclick = exitBuild; $('bUndo').onclick = undo; $('bRotCam').onclick = () => { BUILD.cam.yaw += Math.PI / 2; BUILD.cam.yaw0 = BUILD.cam.yaw; };
  $('build').addEventListener('click', buildClick); initSignEditor();
  $('tRot').onclick = rotateGhost; $('tOk').onclick = placeGhost; $('tMove').onclick = moveSelected; $('tSell').onclick = sellSelected; $('tFix').onclick = fixSelected; $('tCancel').onclick = () => { cancelGhost(); clearSel(); BUILD.pick = null; renderBuildItems(); setHint(); };
  document.addEventListener('visibilitychange', () => { if (document.hidden && started) { saveGame(); SFX.siren(false); SFX.engineSet(false); } });
  window.addEventListener('pagehide', () => { if (started) saveGame(); });
}
function applyGfx() {
  const q = pref('gfx', MOBILE ? 'medium' : 'high');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, q === 'low' ? 1 : q === 'medium' ? 1.5 : 2));
  renderer.shadowMap.enabled = q !== 'low'; sun.castShadow = q !== 'low';
  scene.traverse(o => { if (o.material) { const m = Array.isArray(o.material) ? o.material : [o.material]; m.forEach(x => x.needsUpdate = true); } });
  onResize(true);
}

/* ---------- start / load ---------- */
function startGame(saved) {
  if (saved) { G = saved; UID = Math.max(UID, G.uidNext || 1); G.gear = G.gear || {}; G.seenTips = G.seenTips || {}; }
  loadJailFromState();
  for (const d of G.staff) { if (d.kind === 'officer') spawnOfficer(d); else { const s = new Staff(d); const t = randomReachable(GATE_I[0], 1, 'staff', (a, b) => !J.block[tid(a, b)]); s.p.place(tileX(t ? t[0] : GATE_I[0]), tileZ(t ? t[1] : 1)); } }
  for (const d of G.inmates) { if (d.escaped) continue; spawnInmateAtBed(d); }
  G.inmates = G.inmates.filter(d => !d.escaped);
  makePlayer(); swapPlayerCar(); if (G.gear.k9) makePlayerDog();
  SIM.lastAct = curAct(); SIM.locked = SIM.lastAct === 'sleep' || SIM.lastAct === 'lock';
  setTimeOfDay(G.hour);
  started = true; $('hud').classList.remove('hidden');
  setInterval(() => { if (started) saveGame(); }, 5 * 60 * 1000); // autosave every 5 real minutes
  UI.refresh(); UI.clock(); buildActionButtons(); showTut();
  CRIME_T = 6;
  if (!saved) { setTimeout(() => spawnCrime(1), 1500); }
  applyGfx();
}

/* ---------- loop ---------- */
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!started) { titleSpin(dt); renderer.render(scene, camera); return; }
  const sdt = dt * (UI.sheet && !BUILD.on ? 0 : 1);
  const simDt = sdt * SIM.speed;
  // player + cars
  if (MODE.cur !== 'build') updatePlayer(sdt); else if (PLAYER.car) { PLAYER.car.thr = 0; PLAYER.car.brake = 1; }
  for (const c of CARS) { if (c.parked && c !== PLAYER.car) { c.vx *= 0.8; c.vz *= 0.8; } if (c.ai && c.kind === 'traffic') aiDrive(c, sdt); else if (c.ai && c.kind === 'crook') aiDrive(c, sdt); c.physics(sdt); }
  carContacts();
  for (const c of CARS) { if (c.parked && c !== PLAYER.car) continue; c.collideWorld(); }
  // people
  simUpdate(simDt);
  doorUpdate(sdt);
  crimeUpdate(sdt);
  const camP = camera.position;
  for (const p of PEOPLE) {
    const jailSide = p.kind === 'inmate' || p.kind === 'staff';
    if (p.kind !== 'player') p.step(jailSide && !p.isFugitive ? simDt : sdt);
    // cars knock pedestrians aside
    if (p.kind === 'civ') for (const c of CARS) { if (Math.abs(c.speed()) > 3 && dist2(c.x, c.z, p.x, p.z) < 6) { const a = Math.atan2(p.x - c.x, p.z - c.z); p.x += Math.sin(a) * 1.5; p.z += Math.cos(a) * 1.5; } }
    p.sync(jailSide ? simDt || sdt * 0.0001 : sdt, camP);
  }
  updatePeds(PLAYER.x, PLAYER.z);
  updateTraffic(PLAYER.x, PLAYER.z, sdt);
  for (const c of CARS) c.sync(sdt);
  updateFX(sdt);
  // lights follow camera target
  const tx = MODE.cur === 'build' ? BUILD.cam.x : PLAYER.x, tz = MODE.cur === 'build' ? BUILD.cam.z : PLAYER.z;
  shadowTarget.position.set(tx, 0, tz); const sd = NIGHT.sunDir || new T.Vector3(0.5, 1, 0.4);
  sun.position.set(tx + sd.x * 120, sd.y * 120, tz + sd.z * 120);
  skyMesh.position.copy(camera.position);
  updateCamera(sdt || dt);
  updateGps();
  renderer.render(scene, camera);
  hudT -= dt;
  if (hudT <= 0) { hudT = 0.25; onResize(); eggCheck(); UI.clock(); buildActionButtons(); if (MODE.cur !== 'build') drawMinimap(); tutTick(); hudCarInfo(); promptText(); if (Math.random() < 0.1) UI.refresh(); if (Math.random() < 0.08) setTimeOfDay(G.hour); }
}
function hudCarInfo() {
  const c = PLAYER.car, box = $('carhp');
  if (!c || MODE.cur === 'build') { box.hidden = true; return; }
  box.hidden = false; $('carhpB').style.width = (c.hp / c.spec.hp * 100) + '%'; $('carhpB').style.background = c.hp / c.spec.hp > 0.5 ? '#3ee6a8' : c.hp / c.spec.hp > 0.25 ? '#f2c230' : '#ff4d5e';
  $('seats').textContent = '🔗 ' + c.seats.length + '/' + c.spec.seats;
}
function promptText() {
  const el = $('prompt'), pl = PLAYER; let t = '';
  if (MODE.cur === 'build') { el.hidden = true; return; }
  const g = gpsTarget();
  if (g && g.label === 'Booking') t = 'Bring them to the yellow booking box at the gate · ' + Math.round(dist(pl.x, pl.z, g.x, g.z)) + ' m';
  else if (g && g.label === 'Car') t = '🚓 Your cruiser · ' + Math.round(dist(pl.x, pl.z, g.x, g.z)) + ' m';
  else if (g) t = '📍 ' + Math.round(dist(pl.x, pl.z, g.x, g.z)) + ' m';
  if (pl.custody.length && !pl.car) t = '🔗 ' + pl.custody.length + ' in cuffs. Get in your car (or walk them to the gate).';
  el.hidden = !t; el.innerHTML = t;
}

/* ---------- easter eggs ---------- */
function eggCheck() {
  G.eggs = G.eggs || {}; const near = eggCheck.near || (eggCheck.near = {});
  for (const e of EGGS) {
    const d = dist(PLAYER.x, PLAYER.z, e.x, e.z);
    if (d > 45) { near[e.kind] = 0; continue; }
    if (d > 26 || near[e.kind]) continue;
    near[e.kind] = 1;
    if (G.eggs[e.kind]) { UI.toast('🥚 ' + e.name); continue; }
    G.eggs[e.kind] = 1; SFX.cash(); addXp(25);
    UI.event('🥚 Easter egg! You found <b>' + e.name + '</b>. Walk inside! (' + Object.keys(G.eggs).length + '/' + EGGS.length + ' found)', null, false, 8);
    saveGame();
  }
}

/* ---------- title ---------- */
let titleA = 0;
function titleSpin(dt) { titleA += dt * 0.05; const r = 46; camera.position.set(Math.sin(titleA) * r, 24, 72 + Math.cos(titleA) * r); camera.lookAt(0, 2, 66); }
function boot() {
  initRenderer(); buildCity(); initJail(); initInput();
  // preview jail on the title screen
  const saved = loadSave();
  G = saved && saved.v === 1 ? saved : newGame('County Jail');
  setOwned(G.lot); loadJailFromState(); setTimeOfDay(saved ? G.hour : 16.5);
  requestAnimationFrame(frame);
  $('tFoot').textContent = MOBILE ? 'Best played sideways.' : 'WASD to move · mouse to look · E to use your car';
  loadModels(f => { $('tLoadB').style.width = (10 + f * 90) + '%'; }).then(() => {
    $('tLoad').hidden = true; $('tBtns').hidden = false;
    if (saved && saved.v === 1) { $('tCont').hidden = false; $('tCont').textContent = 'Continue · ' + (saved.name || 'Jail') + ' · Day ' + (saved.day + 1); }
    // decorative people on the title screen
  });
  $('tCont').onclick = () => { SFX.init(); $('title').remove(); startGame(G); };
  $('tNew').onclick = () => { $('tNameRow').hidden = false; $('tNew').hidden = true; $('tCont').hidden = true; $('tName').focus(); };
  $('tStart').onclick = () => {
    SFX.init(); const name = ($('tName').value || 'County Jail').trim().slice(0, 22);
    clearSave(); for (const uid of [...J.byUid.keys()]) removeItem(uid, true);
    G = newGame(name); $('title').remove(); startGame(null); saveGame();
  };
}
(function noZoom() {
  let m = document.querySelector('meta[name=viewport]');
  if (!m) { m = document.createElement('meta'); m.name = 'viewport'; document.head.appendChild(m); }
  m.setAttribute('content', 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
  document.addEventListener('dblclick', e => { if (e.target && e.target.tagName !== 'INPUT') e.preventDefault(); }, { passive: false });
})();
Promise.race([document.fonts ? Promise.all(['900 64px "Barlow Condensed"', '64px "Paytone One"', '64px "Bowlby One"'].map(f => document.fonts.load(f))) : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).catch(() => { }).then(boot);
</script>
