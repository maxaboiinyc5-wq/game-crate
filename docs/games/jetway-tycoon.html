<script>
/* Maxcade: "back to console" tab on the side of the screen. Lives in a shadow root so the game's CSS and selectors never touch it. */
(function(){
  if(window.__mxHomeOn)return;window.__mxHomeOn=1;
  var KEY='maxcade.homepos2',PC=!!(window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches),BW=PC?60:42,BH=PC?60:58,pos=[1,.5],host=document.createElement('div');
  host.id='mx-home';
  host.style.cssText='position:fixed;z-index:2147483647;left:0;top:0;margin:0;padding:0;border:0;width:0;height:0;touch-action:none;-webkit-user-select:none;user-select:none';
  var root=host.attachShadow?host.attachShadow({mode:'open'}):host;
  root.innerHTML='<style>'
    +':host{all:initial}'
    +'.w{position:absolute;left:0;top:0;width:'+BW+'px;height:'+BH+'px;margin:-'+(BH/2)+'px 0 0 -'+(BW/2)+'px;font:600 14px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif}'
    +'.h{display:block;width:100%;height:100%;box-sizing:border-box;margin:0;padding:0;border:2px solid #fff;border-radius:11px;background:#ffb020;cursor:pointer;opacity:1;touch-action:none;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5);animation:mxglow 2.4s ease-in-out infinite}'
    +'@keyframes mxglow{50%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.5),0 0 18px 5px rgba(255,176,32,.8)}}'
    +'@media (prefers-reduced-motion:reduce){.h{animation:none}}'
    +'.h svg{display:block;width:24px;height:24px;margin:0 auto;fill:#1a1205}'
    +(PC?'.h svg{width:28px;height:28px}.ht{display:block;margin-top:3px;font:900 10px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;color:#1a1205}.h{border-width:3px;border-left:0;border-radius:0 14px 14px 0}.h:hover{background:#ffc94d}':'')
    +'.h:focus-visible,.q button:focus-visible{outline:3px solid #ffb020;outline-offset:2px;opacity:1}'
    +'.open .h{opacity:1;background:#ffc94d;animation:none}'
    +'.q{display:none;position:absolute;width:200px;box-sizing:border-box;padding:12px;border-radius:8px;background:#191629;border:2px solid #373055;color:#f3efe6;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}'
    +'.open .q{display:block}'
    +'.sl .q{right:calc(100% + 8px)}.sr .q{left:calc(100% + 8px)}'
    +'.vt .q{top:0}.vb .q{bottom:0}.vm .q{top:50%;transform:translateY(-50%)}'
    +'.q p{margin:0 0 10px;font:inherit}'
    +'.q button{display:block;width:100%;box-sizing:border-box;margin:0;padding:11px 8px;border:0;border-radius:6px;font:inherit;cursor:pointer}'
    +'.x{background:#ffb020;color:#191629}'
    +'.s{background:#2d2748;color:#f3efe6;margin-top:8px!important}'
    +'</style>'
    +'<div class="w"><button class="h" type="button" aria-label="Console menu" title="Console menu">'
    +'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.5 11.2h2.7V21h5.3v-6h3v6h5.3v-9.8h2.7z"/></svg>'+(PC?'<span class="ht">HOME</span>':'')+'</button>'
    +'<div class="q"><p>Leave this game?</p><button class="x" type="button">Back to console</button><button class="s" type="button">Keep playing</button></div></div>';
  var w=root.querySelector('.w'),h=root.querySelector('.h');
  function place(x,y){
    var W=window.innerWidth,H=window.innerHeight;
    if(PC){x=BW/2;y=H/2-BH/2-5}   /* computers: docked on the left edge, above the controls tab */
    x=Math.max(BW/2,Math.min(W-BW/2,x));y=Math.max(BH/2+4,Math.min(H-BH/2-4,y));

    host.addEventListener(t,function(e){e.stopPropagation()});
  });

<title>Jetway Tycoon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* layout: live 3D airfield on top with a signage-style HUD, flight-strip control panel below (side by side on wide screens) */
:root{
  --sign:#14161a; --board:#1b1e24; --row:#262a32; --row2:#30353f; --ink:#f4f1e6; --dim:#9aa0aa;
  --taxi:#ffcf1a; --go:#3ddc84; --warn:#ff6b4a; --blue:#58b4ff; --gold:#d4af37;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --ui:'B612','Trebuchet MS',system-ui,sans-serif;
  --mono:'B612 Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sign);color:var(--ink);font-family:var(--ui);font-size:13px;line-height:1.3;display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
svg{width:1.25em;height:1.25em;fill:currentColor;flex:none}
svg.st{stroke:currentColor}
#view{flex:1 1 0;min-height:0;position:relative;touch-action:none;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#chips{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.chip{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:4px;height:34px;min-width:34px;padding:0 7px;border-radius:17px;border:2px solid var(--sign);
  background:var(--taxi);color:var(--sign);font-family:var(--mono);font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,.45);will-change:transform}
.chip svg{width:18px;height:18px}
.chip.push{background:var(--go)}
.chip.urgent{background:var(--warn);color:#fff;animation:pulse .7s infinite alternate}
.chip.edge{opacity:.92}
.pay{position:absolute;left:0;top:0;font-family:var(--display);font-size:22px;color:var(--go);text-shadow:0 2px 0 #000,0 0 6px #000;white-space:nowrap}
@keyframes pulse{to{box-shadow:0 0 0 7px rgba(255,107,74,.35)}}
.hud{position:absolute;left:0;right:0;top:0;padding:8px 16px 0;display:flex;justify-content:space-between;gap:8px;align-items:stretch;pointer-events:none}
.hud>div{background:var(--sign);border-radius:6px;padding:5px 9px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.sign{border:2px solid var(--taxi)}
.sign .code{font-family:var(--display);font-weight:700;font-size:21px;line-height:.95;color:var(--taxi);letter-spacing:.05em}
.sign .tier,.mid span+span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.mid{align-items:center;text-align:center;flex:0 1 auto}
#clock{font-family:var(--mono);font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
#wxlab{color:var(--blue)!important}
.nums{align-items:flex-end;font-family:var(--mono);font-variant-numeric:tabular-nums}
#money{font-size:17px;color:var(--go);line-height:1.05}
#money.neg{color:var(--warn)}
#rep{font-size:12px;color:var(--taxi)}
#banner{position:absolute;left:16px;right:60px;top:62px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);text-align:center;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;
  padding:4px 12px;border-radius:4px;background:var(--taxi);color:var(--sign);pointer-events:none}
#banner.bad{background:var(--warn);color:#fff}
#banner.good{background:var(--go)}
#scope{position:absolute;right:12px;bottom:10px;width:84px;height:84px;pointer-events:none}
body.mx #scope{right:50px}
#closed{position:absolute;left:16px;bottom:10px;font-family:var(--mono);font-size:11px;background:var(--warn);color:#fff;padding:3px 8px;border-radius:4px;pointer-events:none}
#toasts{position:absolute;left:16px;right:104px;bottom:36px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.toast{background:rgba(20,22,26,.86);border-radius:4px;padding:4px 9px;font-size:12px;transition:opacity .35s,transform .35s;max-width:100%;overflow-wrap:anywhere}
.toast.good{color:var(--go)}.toast.warn{color:var(--taxi)}.toast.bad{color:var(--warn)}
.toast.out{opacity:0;transform:translateY(-6px)}
.side{position:absolute;right:12px;top:70px;display:flex;flex-direction:column;gap:6px}
.side button{width:40px;height:40px;border-radius:6px;border:0;background:var(--sign);color:var(--taxi);font-family:var(--display);font-weight:700;font-size:19px;display:grid;place-items:center}
.side button.on{background:var(--taxi);color:var(--sign)}
#hint{position:absolute;left:16px;right:104px;bottom:10px;z-index:2;margin:0 auto;max-width:440px;background:var(--sign);border:2px solid var(--taxi);border-radius:6px;padding:8px 11px;font-size:13px;line-height:1.4;pointer-events:none}
#panel{flex:0 0 41%;display:flex;flex-direction:column;background:var(--board);min-height:0;border-top:3px solid var(--taxi)}
#panel.min{flex-basis:auto}
#panel.min .list{display:none}
.tabs{display:flex;flex:none;background:var(--sign)}
.tabs button{flex:1;border:0;background:none;color:var(--dim);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:10px 0 9px;position:relative}
.tabs button.on{background:var(--board);color:var(--taxi)}
.tabs button[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:5px;margin-left:3px;min-width:15px;height:15px;border-radius:8px;background:var(--warn);color:#fff;font:700 10px/15px var(--ui);text-align:center;padding:0 3px;letter-spacing:0}
#tabG[data-n]:not([data-n=""])::after{background:var(--go);color:var(--sign)}
.tabs #bMin{flex:0 0 44px;font-size:15px}
#panel.min #bMin{transform:rotate(180deg)}
.list{flex:1;min-height:0;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:6px;touch-action:pan-y;overscroll-behavior:contain}
.strip{background:var(--row);border-radius:6px;padding:7px 9px 7px 0;display:grid;grid-template-columns:5px minmax(0,1fr) auto;column-gap:9px;row-gap:3px;align-items:center}
.strip.sel{background:var(--row2);box-shadow:inset 0 0 0 1.5px var(--blue)}
.strip.urgent{box-shadow:inset 0 0 0 1.5px var(--warn)}
.bar{grid-row:1/4;align-self:stretch;border-radius:6px 0 0 6px;width:5px;display:block}
.s-main{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.fn{font-family:var(--mono);font-size:15px;color:var(--taxi)}
.ty{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.tag{font:700 9px/1 var(--ui);letter-spacing:.08em;padding:3px 4px;border-radius:3px}
.tag.em{background:var(--warn);color:#fff}.tag.vip{background:var(--gold);color:var(--sign)}.tag.own{background:var(--taxi);color:var(--sign)}
.s-stat{font-size:12px;grid-column:2;overflow-wrap:anywhere}
.meter{grid-column:2;height:4px;border-radius:2px;background:#3a3f4a;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--go)}
.meter.low i{background:var(--warn)}
.meter.wide{grid-column:1/-1}
.s-acts{grid-column:3;grid-row:1/4;display:flex;gap:5px}
.act{border:0;border-radius:6px;min-height:44px;padding:0 11px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;background:var(--taxi);color:var(--sign);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;position:relative;overflow:hidden}
.act.off{background:#3a3f4a;color:var(--dim)}
.act.go,.act.buy{background:var(--go)}
.act.buy.off,.act.go.off{background:#3a3f4a}
.act.done{background:#22452f;color:var(--go)}
.act.warn{background:#4a2a24;color:var(--warn)}
.act.sv{flex-direction:column;gap:1px;width:50px;padding:0;font-size:12px;letter-spacing:.02em}
.act.sv svg{width:19px;height:19px;position:relative}
.act.sv span{position:relative}
.act.sv i{position:absolute;left:0;bottom:0;height:100%;width:var(--p,0%);background:rgba(61,220,132,.38);display:none}
.act.sv.busy{background:#3a3f4a;color:var(--ink)}
.act.sv.busy i{display:block}
.sec{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:8px 2px 0}
.item,.card{background:var(--row);border-radius:6px;padding:8px 10px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:2px;align-items:center}
.item .act{grid-column:2;grid-row:1/3;min-width:78px}
.item.air{grid-template-columns:5px minmax(0,1fr) auto;padding-left:0}
.item.air .bar{grid-row:1/3}
.item.air .i-name,.item.air .i-desc{grid-column:2}
.state{grid-column:3;grid-row:1/3;font-size:11px;color:var(--dim);text-align:right;max-width:120px}
.state.ok{color:var(--go)}
.i-name{font-size:14px;font-weight:700}
.i-name .own{font-weight:400;font-size:11px;color:var(--dim);margin-left:7px}
.i-desc{font-size:11.5px;color:var(--dim);line-height:1.35}
.i-desc.pad{padding:4px 2px}
.req{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.req li::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--dim);margin-right:8px;vertical-align:-1px}
.req li.ok{color:var(--go)}.req li.ok::before{background:var(--go);border-color:var(--go)}
.help p{margin:0 0 6px;font-size:12px;line-height:1.4;color:var(--ink)}.help p:last-child{margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.kv.good b{color:var(--go)}.kv.bad b{color:var(--warn)}
.empty{color:var(--dim);padding:20px 4px;text-align:center}
#intro,#report{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;z-index:5}
#intro{background:linear-gradient(180deg,rgba(20,22,26,.15) 0%,rgba(20,22,26,.7) 42%,rgba(20,22,26,1) 60%);justify-content:flex-end;padding-bottom:max(40px,9vh)}
#intro h1{font-family:var(--display);font-weight:700;font-size:clamp(48px,15vw,92px);line-height:.88;margin:0;color:var(--taxi);text-wrap:balance;letter-spacing:.01em}
#intro .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--ink);background:var(--sign);border:2px solid var(--taxi);border-radius:4px;padding:3px 9px}
#intro p{margin:0;max-width:38ch;line-height:1.5;font-size:14px}
#intro .act{font-size:22px;padding:13px 30px;min-height:54px}
#report{background:rgba(12,13,16,.8)}
.sheet{background:var(--board);border:2px solid var(--taxi);border-radius:8px;padding:16px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:left}
.sheet h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:0 0 8px;color:var(--taxi)}
@media (min-width:860px),(orientation:landscape) and (min-width:560px){body{flex-direction:row}#panel{flex:0 0 min(410px,46%);border-top:0;border-left:3px solid var(--taxi)}#panel.min{flex-basis:min(410px,46%)}#panel.min .list{display:flex}#bMin{display:none}}
@media (prefers-reduced-motion:reduce){.chip.urgent{animation:none}.toast{transition:none}}
</style>

<script>

function samplePath(pts,step,fn){
  for(let i=0;i<pts.length-1;i++){
    const ax=pts[i][0],az=pts[i][1],bx=pts[i+1][0],bz=pts[i+1][1],d=Math.hypot(bx-ax,bz-az),n=Math.max(1,Math.round(d/step));
    for(let k=0;k<n;k++){const t=k/n;fn(ax+(bx-ax)*t,az+(bz-az)*t,(bx-ax)/d,(bz-az)/d);}
  }
}

// ----- taxi routing -----
function mkRoute(f,pts){

    const d1=Math.hypot(p.x-a.x,p.z-a.z),d2=Math.hypot(b.x-p.x,b.z-p.z);
    p.turn=th;p.r=clamp(R*Math.tan(Math.min(th,2.5)/2),2.5,Math.max(2.5,Math.min(d1,d2)*0.5+1));

  else{p.push({x:ex,z:P,v:14,cb:rel});p.push({x:EAST_X,z:P,v:26});p.push({x:EAST_X,z:TWA,v:26});}

function pickDepRunway(f){

function routeOut(f){

    w.busy=q;q.state='lineup';return true;
  };
  if(r===0){p.push({x:DEP_X,z:LANE,v:20});p.push({x:DEP_X,z:rz-16.5,v:20,stop:true,h:0,wait:claim});}
  else{
    p.push({x:WEST_X,z:LANE,v:22});
    for(let k=0;k<r;k++)p.push({x:WEST_X,z:RZ[k]-24,v:24,yield:()=>!(RW[k].app&&RW[k].app.x<WEST_X+40)});
    p.push({x:WEST_X,z:TWP[r],v:24});p.push({x:DEP_X,z:TWP[r],v:18});
    p.push({x:DEP_X,z:rz-16.5,v:14,stop:true,h:0,wait:claim});

function taxiFollow(f,dt){
  const n=f.route&&f.route[f.ri];if(!n){f.v=Math.max(0,f.v-20*dt);return;}
  const dx=n.x-f.x,dz=n.z-f.z,d=Math.hypot(dx,dz),rev=!!n.rev,sg=rev?-1:1;
  const hd=rev?Math.atan2(-dx,-dz):Math.atan2(dx,dz);
  const stopNode=n.stop||(n.yield&&!n.yield());
  let vt=n.v||20;
  if(stopNode)vt=Math.min(vt,Math.sqrt(2*7*Math.max(0,d-0.2))+0.6);
  else if(n.turn>0.5)vt=Math.min(vt,Math.sqrt(121+2*7*Math.max(0,d-n.r)));
  const err=Math.abs(angd(f.h,hd));if(err>0.35&&d>1.5)vt=Math.min(vt,rev?4.5:10);
  if(wet())vt*=0.85;
  if(f.blk&&!rev)vt=0;
  f.v+=clamp(vt-f.v,-16*dt,(rev?3:6.5)*dt);if(f.v<0)f.v=0;
  if(f.v>0.2)f.h=turnTo(f.h,hd,clamp(f.v/f.T.Rt,0.25,1.9)*dt);

// ----- per-flight update -----
function airMove(f,hd,dt,rate,spd,altT,vs){
  const d=angd(f.h,hd),tr=clamp(d*2.2,-rate,rate);
  f.h+=tr*dt;f.bank=lerp(f.bank,-tr*0.6,Math.min(1,3*dt));
  f.v+=clamp(spd-f.v,-14*dt,10*dt);
  const dy=clamp(altT-f.y,-vs*dt,vs*dt);f.y+=dy;
  f.pitch=lerp(f.pitch,clamp(dy/Math.max(dt,1e-4)/Math.max(f.v,30),-0.25,0.3),Math.min(1,2.5*dt));
  f.x+=Math.sin(f.h)*f.v*dt;f.z+=Math.cos(f.h)*f.v*dt;

function canClaimApp(w){

    if(f.y>9||f.x>RX1+25){if(w.busy===f)w.busy=null;f.state='climb';depart(f);}

    f.v=Math.min(108,f.v+7*dt);f.pitch=lerp(f.pitch,0.2,Math.min(1,dt));f.y+=f.v*Math.sin(f.pitch)*dt;
    if(st==='divert'||f.x>420){f.h+=f.turnOut*dt*(st==='divert'?3:1);f.bank=lerp(f.bank,-f.turnOut*6,Math.min(1,dt));}
    f.x+=Math.sin(f.h)*f.v*dt;f.z+=Math.cos(f.h)*f.v*dt;
    if(Math.abs(f.x)>2700||Math.abs(f.z)>2700||f.y>900)return removeFlight(f);
  }
  if(f.em&&(AIRBORNE[f.state]||f.state==='rollout')&&Math.random()<0.6){const e=f.mdl.engs[0];_lv.set(e[0],e[1],e[2]).applyMatrix4(f.m.matrixWorld);emit(_lv.x,_lv.y,_lv.z,rnd(-1,1),rnd(0,2),rnd(-1,1),2.4,4,16,0.16,0.16,0.18,0.55);}
  // visuals
  const m=f.m;m.position.set(f.x,f.y,f.z);m.rotation.y=f.h;m.rotation.x=-f.pitch;m.rotation.z=f.bank;m.updateMatrixWorld();

  f.blob.visible=S.quality===0&&f.y<160;if(f.blob.visible){f.blob.position.set(f.x,0.35,f.z);f.blob.rotation.y=f.h;f.blob.material.opacity=1;}
}

// ----- vehicles -----
function nearestCorridor(x){let b=0,bd=1e9;for(const i of builtGates())for(const o of[-17,17]){const c=GX(i)+o,d=Math.abs(c-x);if(d<bd){bd=d;b=c;}}return b;}
function homePath(v){
  if(v.z>-38&&v.type!=='fire'){const c=nearestCorridor(v.x),p=[[c,v.z],[c,ROAD_Z]];return p.concat(roadPath(c,ROAD_Z,v.hx,v.hz));}
  return v.type==='fire'?[[v.hx,v.hz]]:roadPath(v.x,v.z,v.hx,v.hz);
}
function vehUpdate(v,dt){
  const j=v.job;let liftT=3.0;v.crew.visible=false;
  if(!j){if(v.path.length)vehMove(v,dt,v.type==='fire'?30:22);else v.h=turnTo(v.h,v.hh,3*dt);}
  else{
    const f=j.f;
    if(j.ph==='go'){
      if(j.kind==='fire'&&f.state==='emstop'&&!j.aim){j.aim=1;v.path=[[f.x-14+(VEH.indexOf(v)%2)*9,f.z-10]];}
      if(vehMove(v,dt,j.kind==='fire'?36:24)&&(j.kind!=='fire'||f.state==='emstop'))j.ph=j.kind==='tug'?'ready':'work';
    }else if(j.ph==='work'){
      if(j.kind==='fire'){v.h=turnTo(v.h,Math.atan2(f.x-v.x,f.z-v.z),3*dt);for(let n=0;n<2;n++)emit(v.x,3.8,v.z,(f.x-v.x)*0.9+rnd(-2,2),7+rnd(0,3),(f.z-v.z)*0.9+rnd(-2,2),1.0,2.5,6,0.9,0.95,1,0.5);}
      else{
        v.h=turnTo(v.h,j.h,3.5*dt);v.crew.visible=true;
        const s=f.svc[j.kind];s.p+=dt/(SVC[j.kind].time*f.T.size*Math.pow(0.76,S.speed));
        if(j.kind==='cat')liftT=f.T.cy+0.9;
        if(j.kind==='ice'&&Math.random()<0.7)emit(v.x-1.5,5.4,v.z+2.6,-(4+rnd(0,6)),rnd(-1,1.5),rnd(-5,5),1.1,2.5,7,0.95,0.7,0.5,0.4);
        if(s.p>=1){s.p=1;v.job=null;v.path=homePath(v);}
      }
    }else if(j.ph==='ready'){
      v.h=turnTo(v.h,0,3*dt);
      if(f.state==='pushwait'&&pushClear(f)){
        j.ph='push';f.state='pushback';const gx=GX(f.g);
        mkRoute(f,[{x:gx,z:LANE-9,rev:true,v:4.6},{x:gx+14,z:LANE,rev:true,v:4.6,stop:true,h:-Math.PI/2,cb:q=>{q.eng=true;if(GATE[q.g]===q)GATE[q.g]=null;q.state='taxiout';routeOut(q);
          for(const e of q.mdl.engs){_lv.set(e[0],e[1],e[2]-2).applyMatrix4(q.m.matrixWorld);puff(_lv.x,_lv.y,_lv.z,4,0.6,1,1.2,3,7,0.5,0.5,0.52,0.35);}sfx('spool');}}]);
      }
    }else if(j.ph==='push'){
      const k=f.T.L/2+2.8;v.x=f.x+Math.sin(f.h)*k;v.z=f.z+Math.cos(f.h)*k;v.h=f.h+Math.PI;
      if(f.state!=='pushback'){v.job=null;v.path=homePath(v);}
    }
  }
  if(v.lift)v.lift.position.y=lerp(v.lift.position.y,liftT,Math.min(1,2*dt));
  v.m.position.set(v.x,0,v.z);v.m.rotation.y=v.h;
}

// ----- weather and events -----
function banner(text,kind,t){BANNER.text=text;BANNER.kind=kind||'';BANNER.t=t||5;}
function pickWeather(){const late=S.day>=2||S.life.fl>25,h=hourNow(),r=Math.random();if(!late)return'rain';if(r<0.24)return'snow';if(r<(h<8?0.62:0.44))return'fog';return'rain';}
function wxUpdate(dt){
  WX.t-=dt;
  if(WX.type==='clear'&&!WX.next&&WX.t<45)WX.next=pickWeather();
  if(WX.t<=0){
    if(WX.type==='clear'){WX.type=WX.kind=WX.next||'rain';WX.next=null;WX.t=rnd(40,62);
      banner(WX.kind==='rain'?(S.wx?'Storm rolling in: all-weather kit holding':'Storm: wet runways, slower landings'):WX.kind==='fog'?(S.wx?'Fog bank: landing on instruments':'Fog: approaches slowed right down'):'Snow: departures need de-icing','warn',6);sfx('warn');}
    else{WX.type='clear';WX.t=rnd(75,140);banner('Skies clearing','good',3);}
  }
  WX.amt+=clamp((WX.type==='clear'?0:1)-WX.amt,-dt/7,dt/7);
  const k=WX.kind;
  ENV.overcast=WX.amt*(k==='fog'?0.75:1);ENV.vis=1-WX.amt*(k==='fog'?0.93:k==='snow'?0.62:0.4);
  WX.cover+=clamp(((k==='snow'&&WX.type==='snow')?1:0)-WX.cover,-dt/45,dt/18);
  ENV.snow=WX.cover;ENV.wind=Math.sin(TIME*0.13)*0.6+0.4;
  if(k==='rain'&&WX.amt>0.7){WX.bolt-=dt;if(WX.bolt<=0){WX.bolt=rnd(5,13);lightning(CAM.tx,CAM.tz);setTimeout(()=>sfx('thunder'),500+Math.random()*900);}}
}
function eventUpdate(dt){
  for(const r of RW)if(r.closed>0)r.closed-=dt;
  evT-=dt;if(evT>0)return;
  evT=rnd(75,125);const opts=[];
  if(S.served>=4)opts.push('closure');if(S.life.fl>=10&&inPattern()<5)opts.push('em');if(S.rep>=1.8&&inPattern()<5)opts.push('vip','vip');
  if(!opts.length)return;const e=pick(opts);
  if(e==='closure'){
    const c=[];for(let r=0;r<S.runways;r++)if(RW[r].closed<=0)c.push(r);if(!c.length)return;const r=pick(c);
    RW[r].closed=S.runways>1?30:20;banner('Runway '+(r+1)+' closed: debris sweep','warn',6);sfx('warn');
  }else if(e==='em'){const f=mkFlight(pick(signedList()),{em:true});banner('MAYDAY  '+f.num+' engine fire, land it now','bad',7);sfx('alarm');}
  else{const f=mkFlight(VIPAL);banner('VIP charter '+f.num+' inbound: pays big if on time','good',6);sfx('chime');}
}
function upkeep(){
  const veh=S.bag+S.fuel+S.cat+S.tug+S.ice;
  return 90*S.gates+650*(S.runways-1)+60*Math.max(0,veh-3)+450*S.chief+650*S.ctrl+350*S.jets+300*S.fire+120*(S.shops+S.garage+S.board+S.depot+S.radar+S.wx);
}
let REPORT=null;
function endDay(){
  const t=S.today,cost=upkeep();
  REPORT={day:S.day,fl:t.fl,pax:t.pax,fare:t.fare,term:t.term,cost,on:t.on,late:t.late,div:t.div,net:t.fare+t.term-cost};
  S.money-=cost;S.day++;S.life.days++;S.today={fl:0,pax:0,fare:0,term:0,on:0,late:0,div:0};save();
  showReport();
}
let lastTier=tierOf();
function simUpdate(dt){
  TIME+=dt;
  const pc=S.clock,hh=pc/60;S.clock=(S.clock+dt*1440/DAY_SECONDS*(hh>=22||hh<4.8?2.2:1))%1440;if(S.clock<pc)endDay();
  // arrivals
  spawnT-=dt*todFactor()*(0.8+0.09*S.rep);
  if(spawnT<=0){spawnT=clamp(58/S.gates,6.5,30);if(inPattern()<4+S.radar*2)spawn();}
  wxUpdate(dt);eventUpdate(dt);
  // staff
  if(S.ctrl){
    let active=0;for(const f of F)if(f.cleared&&AIRBORNE[f.state])active++;
    if(active<openRunways()*2){const c=F.filter(f=>(f.state==='hold'||f.state==='inbound')&&!f.cleared).sort((a,b)=>(b.em-a.em)||(a.fuel-b.fuel))[0];if(c&&freeGate()>=0&&openRunways())clearLand(c);}
  }
  if(S.chief)for(const f of F){
    if(f.state==='gate'){for(const k in f.svc)if(!f.svc[k].on)svcStart(f,k);}
    else if(f.state==='ready'&&freeVeh('tug',GX(f.g)))push(f);
  }
  // ground separation
  for(const f of F){
    if(f.state==='taxiin'||f.state==='taxiout'){f.blk=f.ghost>0?null:probeBlocked(f);}else f.blk=null;
    if(f.ghost>0)f.ghost-=dt;
  }
  // a ring of aircraft all waiting on each other: the lowest flight id goes first
  for(const f of F){
    f.free=false;if(!f.blk)continue;
    let q=f.blk,n=0,min=f.id;
    while(q&&n++<12){if(q===f){f.free=f.id===min;break;}if(q.id<min)min=q.id;q=q.blk;}
  }
  for(const f of F){
    if(f.free)f.blk=null;
    if(f.blk&&f.v<0.5){f.stuck+=dt;if(f.stuck>90){f.ghost=6;f.stuck=0;}}else f.stuck=0;
  }
  for(const f of F.slice())flUpdate(f,dt);
  for(const v of VEH)vehUpdate(v,dt);
  for(const b of BR){const f=GATE[b.i];if(!f||(f.state!=='gate'&&f.state!=='ready'))b.want=0;}
  updateBridges(dt);
  for(const m of MARSH){
    const f=GATE[m.i],on=f&&f.state==='taxiin'&&f.ri>=f.route.length-2;
    m.on=on?1:Math.max(0,m.on-dt*0.6);m.g.visible=m.on>0;
    if(on){const w=Math.sin(TIME*7)*0.5;m.a1.rotation.z=0.5+w;m.a2.rotation.z=-0.5-w;}
    else{m.a1.rotation.z=Math.PI*0.5;m.a2.rotation.z=-Math.PI*0.5;}
  }
  for(let i=PAY.length-1;i>=0;i--){PAY[i].t-=dt;if(PAY[i].t<=0)PAY.splice(i,1);}
  if(BANNER.t>0)BANNER.t-=dt;
  const t=tierOf();
  if(t>lastTier){banner('MAX is now a '+TIERS[t],'good',6);sfx('goal');buildTerminal();buildFieldLights();}
  else if(t<lastTier)drawSign();
  lastTier=t;
}

// ---------- sound (all synthesised) ----------
let AC=null,master=null,noiseBuf=null,rainGain=null,windGain=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=S.mute?0:0.9;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const loop=(type,freq,q)=>{const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(master);s.start();return g;};
    rainGain=loop('highpass',2400,0.4);windGain=loop('lowpass',260,0.3);windGain.gain.value=0.035;
  }catch(e){AC=null;}
}
function setMute(m){S.mute=m?1:0;if(master)master.gain.value=m?0:0.9;save();}
function tone(freq,dur,type,vol,when,to){
  const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol,type,f0,f1,when,attack,q){
  const t=AC.currentTime+(when||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;s.loop=true;
  f.type=type;f.Q.value=q||0.7;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(attack||0.02));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+0.05);
}
let lastSfx={};
function sfx(n){
  if(!AC||S.mute)return;
  const now=AC.currentTime,gap=n==='jet'||n==='prop'?3:n==='touch'?1.2:n==='cash'||n==='chime'?0.35:0.12;if(lastSfx[n]&&now-lastSfx[n]<gap)return;lastSfx[n]=now;
  try{
    if(n==='click')tone(720,0.05,'square',0.03);
    else if(n==='chime'){tone(784,0.5,'sine',0.07);tone(622,0.7,'sine',0.07,0.32);}
    else if(n==='radio'){noise(0.07,0.05,'bandpass',1900,0,0,0.005,2);tone(1180,0.07,'sine',0.05,0.06);}
    else if(n==='cash'){tone(988,0.09,'triangle',0.08);tone(1319,0.22,'triangle',0.08,0.08);noise(0.05,0.03,'highpass',5000,0,0.08,0.004);}
    else if(n==='warn'){tone(520,0.11,'square',0.04);tone(520,0.11,'square',0.04,0.17);}
    else if(n==='alarm'){for(let i=0;i<4;i++){tone(880,0.14,'square',0.05,i*0.3);tone(660,0.14,'square',0.05,i*0.3+0.15);}}
    else if(n==='goal'){[523,659,784,1047].forEach((f,i)=>tone(f,0.3,'triangle',0.07,i*0.09));}
    else if(n==='ready')tone(880,0.12,'sine',0.05);
    else if(n==='dock')noise(0.18,0.12,'lowpass',320,120);
    else if(n==='touch'){noise(0.38,0.12,'bandpass',2600,1100,0,0.01,3);noise(0.3,0.18,'lowpass',160,60);noise(2.8,0.09,'lowpass',900,300,0.2,0.5);}
    else if(n==='jet'){noise(7,0.2,'lowpass',260,900,0,2.6);noise(7,0.07,'bandpass',900,2400,0,2.8,4);tone(420,6.5,'sine',0.014,0,1500);}
    else if(n==='prop'){tone(92,6.5,'sawtooth',0.04,0,150);tone(184,6.5,'sawtooth',0.018,0,300);noise(6.5,0.08,'lowpass',300,600,0,2.2);}
    else if(n==='spool'){tone(180,2.4,'sine',0.03,0,820);noise(2.4,0.05,'lowpass',200,700,0,1.2);}
    else if(n==='thunder'){noise(3.2,0.5,'lowpass',240,50,0,0.04);noise(1.2,0.25,'lowpass',700,90,0.05,0.02);}
  }catch(e){}
}
function audioAmbience(){
  if(!AC)return;

function statusOf(f){

  switch(f.state){
    case'inbound':return f.cleared?'Cleared, inbound':'Inbound from '+f.city;
    case'hold':return f.cleared?'Cleared, waiting for a runway':'Holding, fuel '+Math.max(0,Math.ceil(f.fuel))+'s';
    case'base':return'Cleared, turning for final';
    case'final':return'On final, runway '+rn;
    case'rollout':return'Landed runway '+rn;
    case'emstop':return'Emergency crews attending';
    case'taxiin':return'Taxi to gate '+g;
    case'gate':{const l=stdLeft(f),w=f.deplane<1?'deplaning':f.board<1&&f.pax&&(!f.svc.cat||f.svc.cat.p>=1)?'boarding':'servicing';return'Gate '+g+', '+w+(l>=0?', due out '+l+'s':', late '+(-l)+'s');}
    case'ready':{const l=stdLeft(f);return'Gate '+g+' ready'+(l>=0?', due out '+l+'s':', late '+(-l)+'s');}
    case'pushwait':return'Waiting for tug';

function renderScope(dt){

  const a=scopeT*1.6,gr=g.createConicGradient?g.createConicGradient(a,R,R):null;
  if(gr){gr.addColorStop(0,'rgba(61,220,132,0)');gr.addColorStop(0.82,'rgba(61,220,132,0)');gr.addColorStop(1,'rgba(61,220,132,0.4)');g.fillStyle=gr;g.fillRect(0,0,W,W);}

  for(const f of F){

  }

  $('reportBody').innerHTML='<h2>Day '+r.day+' report</h2>'+kv('Departures',r.fl)+kv('Passengers',r.pax.toLocaleString('en-US'))+kv('On time',tot?pc+'%':'n/a')+kv('Diversions',r.div)+
    kv('Fares',fmt$(r.fare))+kv('Terminal income',fmt$(r.term))+kv('Upkeep and wages','-'+fmt$(r.cost).replace('-',''))+kv('Net for the day',fmt$(r.net),r.net>=0?'good':'bad');
  $('reportGo').textContent='Start day '+S.day;$('report').hidden=false;sfx('goal');
}
function initUI(){
  $('list').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'),row=e.target.closest('.strip');
    if(!b){if(row){const f=F.find(x=>x.id==row.dataset.id);if(f)rideAlong(f);}return;}
    const a=b.dataset.act,k=b.dataset.k;sfx('click');
    if(a==='buy')buy(k);
    else if(a==='claim')claimMission(+k);
    else if(a==='mute')setMute(!S.mute);
    else if(a==='quality'){S.quality=S.quality?0:1;applyQuality();save();}
    else if(a==='reset'){if(resetArm>0){resetAll();}else resetArm=3.5;}
    else{
      const f=F.find(x=>x.id==row.dataset.id);if(!f)return;
      if(a==='land'){if(clearLand(f)&&S.tut===0)S.tut=1;}
      else if(a==='push')push(f);
      else if(a==='svc'){if(!svcStart(f,k)&&!f.svc[k].on)toast('No '+SVC[k].name.toLowerCase()+' crew free','warn');}
    }
    uiDirty=true;listSig=tab==='F'?'F':'';
  });
  $('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const f=F.find(x=>x.id==c.dataset.id);if(f){const a=needAction(f);if(nextAction(f)&&a==='land'&&S.tut===0)S.tut=1;sfx('click');uiDirty=true;}});
  const tabs={F:'tabF',B:'tabB',G:'tabG',A:'tabA'};
  for(const k in tabs)$(tabs[k]).addEventListener('click',()=>{tab=k;for(const j in tabs)$(tabs[j]).classList.toggle('on',j===k);listSig='';$('list').scrollTop=0;$('panel').classList.remove('min');uiDirty=true;sfx('click');});
  $('bMin').addEventListener('click',()=>{$('panel').classList.toggle('min');setTimeout(sizeIt,30);});
  $('bSpeed').addEventListener('click',()=>{RUN.speed=RUN.speed%3+1;RUN.paused=false;sfx('click');uiDirty=true;});
  $('bPause').addEventListener('click',()=>{RUN.paused=!RUN.paused;sfx('click');uiDirty=true;});
  $('bSnd').addEventListener('click',()=>{setMute(!S.mute);uiDirty=true;});
  $('bCam').innerHTML=IC.cam;
  $('bCam').addEventListener('click',()=>{setPreset((CAM.preset+1)%PRESETS.length);toast(PRESETS[CAM.preset].name+' view','');sfx('click');});
  $('reportGo').addEventListener('click',()=>{$('report').hidden=true;RUN.modal=false;sfx('click');});
  $('open').addEventListener('click',()=>{$('intro').hidden=true;RUN.on=true;initAudio();if(AC&&AC.state==='suspended')AC.resume();sfx('chime');});
  if(S.life.fl>0){$('open').textContent='Back to work';$('introText').textContent='Welcome back. Your airport is as you left it: '+TIERS[tierOf()].toLowerCase()+', day '+S.day+', '+fmt$(S.money)+' in the bank.';}
}

// ---------- camera and touch input ----------
const CAM={tx:0,tz:8,az:0.5,el:0.62,dist:430,gd:430,follow:null,preset:0,anim:null,shake:0};
const PRESETS=[
  {name:'Overview',tx:0,tz:16,az:0.45,el:0.66,dist:0,paz:1.12,pel:0.56,ptx:10,ptz:6},
  {name:'Apron',tx:0,tz:-22,az:0.2,el:0.5,dist:150},
  {name:'Final approach',tx:-150,tz:RZ[0],az:-1.42,el:0.2,dist:230},
  {name:'Tower',tx:-40,tz:20,az:-0.95,el:0.36,dist:260}
];
const portrait=()=>VW<VH*1.15;
function overviewDist(){const grow=S.gates*14+(S.runways-1)*55;return portrait()?300+grow:clamp((250+grow)*900/Math.max(500,VW),260,560);}
function presetOf(i){const p=PRESETS[i],pt=portrait()&&p.paz!=null,dz=i===0?(S.runways-1)*26:0;return{tx:pt?p.ptx:p.tx,tz:(pt?p.ptz:p.tz)+dz,az:pt?p.paz:p.az,el:pt?p.pel:p.el,dist:p.dist||overviewDist()};}
function setPreset(i){
  CAM.preset=i;CAM.follow=null;CAM.saved=null;const p=presetOf(i);
  CAM.anim={t:0,from:{tx:CAM.tx,tz:CAM.tz,az:CAM.az,el:CAM.el,dist:CAM.gd},to:p};
}
function camUpdate(dt){
  if(CAM.anim){
    const a=CAM.anim;a.t=Math.min(1,a.t+dt*1.4);const k=smooth(a.t);
    CAM.tx=lerp(a.from.tx,a.to.tx,k);CAM.tz=lerp(a.from.tz,a.to.tz,k);CAM.az=a.from.az+angd(a.from.az,a.to.az)*k;CAM.el=lerp(a.from.el,a.to.el,k);CAM.gd=lerp(a.from.dist,a.to.dist,k);
    if(a.t>=1)CAM.anim=null;
  }
  let ty=0;
  if(CAM.follow){
    const f=CAM.follow;CAM.fk=Math.min(1,(CAM.fk||0)+dt*1.6);const k=CAM.fk*CAM.fk;CAM.tx=lerp(CAM.tx,f.x,k);CAM.tz=lerp(CAM.tz,f.z,k);ty=f.y+f.T.cy;
    const moving=f.v>3,back=f.state==='pushback';
    if(moving)CAM.az+=angd(CAM.az,f.h+(back?0:Math.PI)+0.32)*Math.min(1,dt*1.6);
    CAM.el=lerp(CAM.el,f.y>4?0.13:moving?0.22:0.34,Math.min(1,dt*1.2));
    if(F.indexOf(f)<0||((f.state==='climb'||f.state==='divert')&&(Math.abs(f.x)>1300||f.y>330)))camRelease();
  }
  CAM.ty=CAM.follow?lerp(CAM.ty||0,ty,CAM.fk*CAM.fk):lerp(CAM.ty||0,ty,Math.min(1,dt*3));
  CAM.dist+=(CAM.gd-CAM.dist)*Math.min(1,dt*10);
  const ce=Math.cos(CAM.el),d=CAM.dist;
  cam.position.set(CAM.tx+Math.sin(CAM.az)*ce*d,CAM.ty+Math.sin(CAM.el)*d,CAM.tz+Math.cos(CAM.az)*ce*d);
  cam.lookAt(CAM.tx,CAM.ty,CAM.tz);
  cam.near=clamp(d*0.03,2,14);cam.updateProjectionMatrix();
}
function rideAlong(f){
  if(CAM.follow===f){camRelease();return;}
  if(!CAM.follow)CAM.saved={tx:CAM.tx,tz:CAM.tz,az:CAM.az,el:CAM.el,dist:CAM.gd};
  CAM.follow=f;CAM.fk=0;CAM.anim=null;CAM.gd=clamp(f.T.L*3.4,48,105);toast('Riding along with '+f.num+'. Tap the ground to leave.','');
}
function camRelease(){
  if(!CAM.follow)return;CAM.follow=null;
  if(CAM.saved){CAM.anim={t:0,from:{tx:CAM.tx,tz:CAM.tz,az:CAM.az,el:CAM.el,dist:CAM.gd},to:CAM.saved};CAM.saved=null;}
}
const ptr=new Map();let gest=null,tapInfo=null;
function panBy(dx,dy){
  const k=CAM.dist*2*Math.tan(cam.fov*Math.PI/360)/Math.max(1,VH),s=Math.sin(CAM.az),c=Math.cos(CAM.az),fy=1/Math.max(0.35,Math.sin(CAM.el));
  CAM.tx-=(dx*c+dy*fy*s)*k;CAM.tz-=(-dx*s+dy*fy*c)*k;
  CAM.tx=clamp(CAM.tx,-620,560);CAM.tz=clamp(CAM.tz,-330,420);
}
canvas.addEventListener('pointerdown',e=>{
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  if(ptr.size===1)tapInfo={x:e.clientX,y:e.clientY,t:performance.now(),moved:0,btn:e.button,shift:e.shiftKey};
  gest=null;CAM.anim=null;
});
canvas.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1){
    if(tapInfo){tapInfo.moved+=Math.abs(dx)+Math.abs(dy);if(tapInfo.moved<6)return;}
    if(tapInfo&&(tapInfo.btn===2||tapInfo.shift)){CAM.az-=dx*0.006;CAM.el=clamp(CAM.el+dy*0.005,0.14,1.45);}
    else{if(CAM.follow&&tapInfo&&tapInfo.moved>30){CAM.follow=null;CAM.saved=null;}if(!CAM.follow)panBy(dx,dy);}
  }else if(ptr.size===2){
    const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),an=Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x),my=(a[0].y+a[1].y)/2;
    if(gest){
      CAM.gd=clamp(CAM.gd*gest.d/Math.max(20,d),55,1150);
      CAM.az-=angd(gest.an,an);
      CAM.el=clamp(CAM.el+(my-gest.my)*0.004,0.14,1.45);
    }
    gest={d,an,my};if(tapInfo)tapInfo.moved=99;
  }
});
function ptrUp(e){
  const had=ptr.has(e.pointerId);ptr.delete(e.pointerId);gest=null;
  if(had&&tapInfo&&ptr.size===0&&tapInfo.moved<9&&performance.now()-tapInfo.t<500&&e.type==='pointerup')tapWorld(e.clientX,e.clientY);
  if(ptr.size===0)tapInfo=null;
}
canvas.addEventListener('pointerup',ptrUp);canvas.addEventListener('pointercancel',ptrUp);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();CAM.gd=clamp(CAM.gd*(e.deltaY>0?1.12:0.89),55,1150);},{passive:false});
const _pv=new THREE.Vector3();
function project(x,y,z){
  _pv.set(x,y,z).project(cam);
  return {x:(_pv.x*0.5+0.5)*VW,y:(-_pv.y*0.5+0.5)*VH,ok:_pv.z<1&&_pv.z>-1};
}
function tapWorld(cx,cy){
  if(!RUN.on)return;
  const r=canvas.getBoundingClientRect(),x=cx-r.left,y=cy-r.top;let best=null,bd=46;
  for(const f of F){const p=project(f.x,f.y+f.T.cy,f.z);if(!p.ok)continue;const d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=f;}}
  if(!best){camRelease();return;}
  if(needAction(best)){const a=needAction(best);if(nextAction(best)&&a==='land'&&S.tut===0)S.tut=1;uiDirty=true;}
  else rideAlong(best);
  sfx('click');
}

// ---------- boot and main loop ----------
function rebuildWorld(what){
  if(!what||what==='gate'||what==='runway'){drawField();}
  if(!what||what==='gate'||what==='shops'){buildTerminal();}
  if(!what||what==='gate'){buildBridges();buildMarshallers();for(const f of F)if(f.state==='gate'||f.state==='ready')setBridge(f);}
  buildProps();syncVehicles();buildFieldLights();
}
function resetAll(franchise){
  for(const f of F.slice())removeFlight(f);
  for(const v of VEH)vehGroup.remove(v.m);VEH.length=0;
  for(const r of RW){r.busy=null;r.app=null;r.closed=0;}GATE.fill(null);
  const keep={mute:S.mute,quality:S.quality,fr:S.fr,life:S.life};S=JSON.parse(JSON.stringify(DEF));S.mute=keep.mute;S.quality=keep.quality;
  if(franchise){S.fr=keep.fr+1;S.life=keep.life;S.tut=9;S.money=5000;}
  WX.type='clear';WX.amt=0;WX.t=120;WX.next=null;WX.cover=0;spawnT=1.5;evT=95;resetArm=0;lastTier=0;
  fillMissions();rebuildWorld();save();if(franchise){banner(airportName()+' is open: fares +'+(S.fr*20)+'%','good',7);sfx('goal');}else toast('Fresh tarmac. Good luck.','good');tab='F';listSig='';setPreset(0);
  for(const k of['tabF','tabB','tabG','tabA'])$(k).classList.toggle('on',k==='tabF');
}
let last=performance.now(),uiT=0,saveT=0,fpsT=0,fpsN=0,fpsChecked=!!navigator.webdriver,animT=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;const dt=Math.min(0.05,raw);animT+=dt;
  if(RUN.on&&!RUN.paused&&!RUN.modal){for(let i=0;i<RUN.speed;i++)simUpdate(dt);}
  else if(!RUN.on){CAM.az+=dt*0.03;}
  // environment
  applyEnv();setSnowTint(ENV.snow);
  updateClouds(dt);updateCars(dt);updateParticles(dt);
  updateWeatherFx(dt,CAM.tx,CAM.tz,WX.kind==='rain'?WX.amt:0,WX.kind==='snow'?WX.amt:0);
  radar.rotation.y+=dt*1.6;radar2.rotation.y-=dt*1.1;sock.rotation.y=1.2+Math.sin(animT*0.7)*0.25+ENV.wind*0.4;sock.rotation.x=-0.15-0.1*Math.sin(animT*3.1);
  const Lf=ENV.lights;
  glassMat.emissiveIntensity=Math.pow(Lf,1.6)*0.95;cabMat.emissiveIntensity=Lf*0.5;poolMat.opacity=Lf*0.42;
  for(const m of fusMats)m.emissiveIntensity=Lf*0.9;
  camUpdate(dt);placeSky(CAM.tx,CAM.tz);
  const pr=renderer.getPixelRatio(),sc=VH*pr/(2*Math.tan(cam.fov*Math.PI/360));
  fieldLights.mat.uniforms.uScale.value=sc;fieldLights.mat.uniforms.uInt.value=0.1+0.95*Lf;fieldLights.mat.uniforms.uFogF.value=scene.fog.far;
  dynLights.mat.uniforms.uScale.value=sc;dynLights.mat.uniforms.uFogF.value=scene.fog.far*1.4;partMat.uniforms.uScale.value=sc;
  dynLights.clear();
  for(const f of F)planeLights(f,animT);
  const beat=(animT*1.1)%1<0.5;
  for(const v of VEH)if(v.job||v.path.length)dynLights.put(v.x,v.type==='fire'?4.4:3.2,v.z,v.type==='fire'?(beat?1.5:0.1):1.4,v.type==='fire'?0.1:0.75,v.type==='fire'?(beat?0.1:1.5):0.1,beat?4.5:2.2);
  for(let r=0;r<S.runways;r++)if(RW[r].closed>0&&beat)for(let x=RX0+40;x<RX1;x+=60)dynLights.put(x,1.5,RZ[r],1.6,0.15,0.1,9);
  const tb=(animT*0.5)%1;dynLights.put(TOWER.x,56.5,TOWER.z,tb<0.5?0.2:1.2,1.2,tb<0.5?0.3:1.2,(tb%0.5)<0.08?14:0.01);
  dynLights.flush();
  renderChips();renderScope(raw);
  renderer.render(scene,cam);
  // interface refresh
  uiT-=raw;if(uiT<=0||uiDirty){uiT=0.2;uiDirty=false;renderHud();renderList();}
  if(resetArm>0){resetArm-=raw;if(resetArm<=0)listSig='';}
  if(frArm>0){frArm-=raw;if(frArm<=0)listSig='';}
  for(let r=0;r<3;r++)RWX[r].visible=r<S.runways&&RW[r].closed>0;
  audioAmbience();
  saveT+=raw;if(saveT>6){saveT=0;if(RUN.on)save();}
  // drop to the lighter graphics mode on slow devices
  if(RUN.on&&!fpsChecked){fpsT+=raw;fpsN++;if(fpsT>4){fpsChecked=true;if(fpsT/fpsN>0.042&&S.quality>0){S.quality=0;applyQuality();toast('Graphics set to low for a smoother game','');save();}}}
}
function boot(){
  sizeIt();initGround();fillMissions();rebuildWorld();applyQuality();
  const p0=presetOf(0);CAM.gd=CAM.dist=p0.dist;CAM.az=p0.az;CAM.el=p0.el;CAM.tx=p0.tx;CAM.tz=p0.tz;
  if(document.getElementById('mx-home'))document.body.classList.add('mx');
  initUI();applyEnv();renderHud();renderList();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{drawField();drawSign();for(const m of fusMats){const al=m.userData.al;if(al){delete LIV[al.code];m.map=liveryTex(al);m.needsUpdate=true;}}});
  addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.__JT={get S(){return S;},renderer,sfx,audioState:()=>AC?AC.state:'none',claim:claimMission,tier:tierOf,F,RW,GATE,VEH,WX,ENV,CAM,RUN,sim:simUpdate,spawn,mkFlight,clearLand,svcAll,push,buy,nextAction,needAction,setPreset,rebuildWorld,VIPAL,AIR,OWN,endDay,
    setClock:h=>{S.clock=h*60;},weather:(k,t)=>{WX.type=WX.kind=k;WX.t=t||40;if(k==='clear')WX.t=200;}};
  requestAnimationFrame(frame);
}
boot();

})();
